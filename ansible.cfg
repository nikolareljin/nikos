[defaults]
roles_path = ./roles:./roles/optional
# A failed task names its file and line, so the log says where to look.
show_task_path_on_failure = True
become_plugins = ./plugins/become

[privilege_escalation]
# sudo-rs (Ubuntu 26.04) prints the password prompt in a form the builtin sudo
# plugin does not recognise until ansible-core 2.20.11 and 2.21.6; see
# plugins/become/nikos_sudo.py.
become_method = nikos_sudo
