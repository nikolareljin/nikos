---
# ── Node.js ─────────────────────────────────────────────────────────────────
# See vars/main.yml for why this does not install Node from apt. Short version:
# the NodeSource package Conflicts with Ubuntu's npm, so an in-place upgrade
# removes npm along with eslint, webpack and a pile of Debian node-* packages.
#
# Use the system Node when it is already new enough; otherwise put a pinned
# Node under the user's home with nvm, where a global npm install needs no root.
- name: Locate the Node on PATH
  ansible.builtin.command:
    argv:
      - which
      - node
  register: cloud_ai_cli_node_path
  changed_when: false
  failed_when: false
  check_mode: false
  tags: [ai-node, ai-gemini, openclaw]

- name: Read that Node's version
  ansible.builtin.command: "{{ cloud_ai_cli_node_path.stdout | trim }} --version"
  register: cloud_ai_cli_system_node
  changed_when: false
  failed_when: false
  check_mode: false
  when: cloud_ai_cli_node_path.rc | default(1) == 0
  tags: [ai-node, ai-gemini, openclaw]

# Resolve the version against the Node that is actually first on PATH, not
# against an assumed /usr/bin/node. On a machine where the user already runs
# nvm, those are different binaries with different versions, and picking the
# wrong one is what put Node 18 under a CLI that needs 22.
- name: Read the located Node's version number
  ansible.builtin.set_fact:
    cloud_ai_cli_node_version: >-
      {{ cloud_ai_cli_system_node.stdout | default('') | trim | regex_replace('^v', '') }}
  tags: [ai-node, ai-gemini, openclaw]

# The version test raises on an empty input rather than returning false, and
# every path that cannot find Node - no node on PATH, a skipped lookup under
# --check - produces exactly that. Guard it rather than relying on `and` to
# short-circuit, which it does not do here.
- name: Decide whether that Node is new enough
  ansible.builtin.set_fact:
    cloud_ai_cli_system_node_ok: >-
      {{ cloud_ai_cli_node_version != ''
         and cloud_ai_cli_node_version is version(nikos_node_min_version, '>=') }}
  tags: [ai-node, ai-gemini, openclaw]

- name: Report the Node that will be used
  ansible.builtin.debug:
    msg: >-
      Node {{ cloud_ai_cli_system_node.stdout | default('absent') }}
      at {{ cloud_ai_cli_node_path.stdout | default('-') | trim }}
      {{ 'meets the ' ~ nikos_node_min_version ~ ' minimum; using it.'
         if cloud_ai_cli_system_node_ok
         else 'is below ' ~ nikos_node_min_version ~ '; installing Node '
              ~ nikos_node_version ~ ' with nvm instead.' }}
  tags: [ai-node, ai-gemini, openclaw]

- name: Install nvm when the system Node is too old
  when:
    - not cloud_ai_cli_system_node_ok
    - not ansible_check_mode
  tags: [ai-node, ai-gemini, openclaw]
  block:
    - name: Download the nvm install script
      ansible.builtin.get_url:
        url: "https://raw.githubusercontent.com/nvm-sh/nvm/{{ nikos_nvm_version }}/install.sh"
        dest: /tmp/nvm-install.sh
        checksum: "sha256:{{ nvm_install_sha256 }}"
        mode: "0755"

    # The script clones nvm at the same tag (NVM_INSTALL_VERSION is what it
    # reads, set here so it cannot drift from the hashed script), and nvm
    # checks every Node tarball against nodejs.org's SHASUMS256.txt.
    # PROFILE=/dev/null stops the script appending its shell snippet on every
    # run; the profile lines are written once by the task below instead.
    # NVM_DIR is set explicitly rather than left to $HOME/.nvm. The installer
    # and every task below have to agree on one directory, and $HOME is not
    # reliably nikos_home: it differs when the playbook provisions an image
    # rather than a live account, and a stray NVM_DIR in the environment would
    # override it either way.
    - name: Run the nvm install script
      ansible.builtin.command: bash /tmp/nvm-install.sh
      args:
        creates: "{{ nikos_home }}/.nvm/nvm.sh"
      environment:
        PROFILE: /dev/null
        NVM_DIR: "{{ nikos_home }}/.nvm"
        NVM_INSTALL_VERSION: "{{ nikos_nvm_version }}"

    # executable: /bin/bash is load-bearing. ansible.builtin.shell runs /bin/sh,
    # which is dash here, and nvm.sh works out its own directory from
    # ${BASH_SOURCE[0]}. Under dash that is unset, so nvm falls back to the
    # directory of $0 - /bin - and installs Node into /usr/bin/versions/node
    # instead of NVM_DIR. It reports success while doing it, so the failure
    # only surfaces at the next task, which looks for npm where it should have
    # gone. NVM_DIR is exported for the same reason as in the task above.
    - name: Install the pinned Node version through nvm
      ansible.builtin.shell: |
        set -e
        export NVM_DIR="{{ nikos_home }}/.nvm"
        . "$NVM_DIR/nvm.sh"
        nvm install "{{ nikos_node_version }}"
        # Only when there is no default yet: an existing default (possibly a
        # newer Node the user chose) is never moved back to the pin.
        if [ "$(nvm version default)" = "N/A" ]; then
          nvm alias default "{{ nikos_node_version }}"
        fi
      args:
        creates: "{{ nikos_home }}/.nvm/versions/node/v{{ nikos_node_version }}/bin/node"
        executable: /bin/bash
      # nvm is a shell function, so this needs a shell that has sourced it.
      # noqa: command-instead-of-module

    - name: Make nvm available in interactive shells
      ansible.builtin.blockinfile:
        path: "{{ nikos_home }}/.bashrc"
        create: true
        mode: "0644"
        marker: "# {mark} NIKOS NVM"
        block: |
          export NVM_DIR="$HOME/.nvm"
          [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"
          [ -s "$NVM_DIR/bash_completion" ] && . "$NVM_DIR/bash_completion"

- name: Record the Node used for npm installs
  ansible.builtin.set_fact:
    cloud_ai_cli_node_bin: >-
      {{ (cloud_ai_cli_node_path.stdout | trim | dirname)
         if cloud_ai_cli_system_node_ok
         else nikos_home ~ '/.nvm/versions/node/v' ~ nikos_node_version ~ '/bin' }}
  tags: [ai-node, ai-gemini, openclaw]

# The npm shim runs whichever `node` it finds on PATH, not the one beside
# itself, so without this it reports the prefix of a different Node entirely -
# which is the same mix-up that put Node 18 under a CLI needing 22.
- name: Read that Node's global npm prefix
  ansible.builtin.command: "{{ cloud_ai_cli_node_bin }}/npm prefix -g"
  register: cloud_ai_cli_npm_prefix
  changed_when: false
  failed_when: false
  environment:
    PATH: "{{ cloud_ai_cli_node_bin }}:{{ ansible_env.PATH }}"
  tags: [ai-node, ai-gemini, openclaw]

# Root is needed only when the prefix sits outside the user's home. An nvm
# install puts it under ~/.nvm, so those runs need no privilege at all.
- name: Decide whether npm needs root
  ansible.builtin.set_fact:
    cloud_ai_cli_npm_needs_root: >-
      {{ not (cloud_ai_cli_npm_prefix.stdout | default('/usr/local', true) | trim)
             .startswith(nikos_home) }}
  tags: [ai-node, ai-gemini, openclaw]

# npm stages a global upgrade by renaming the existing package to
# .<name>-<suffix> and fails with ENOTEMPTY if an abandoned staging directory
# from an interrupted run is already sitting there. That state survives
# forever and breaks every later install, so clear it before installing.
- name: Remove abandoned npm staging directories
  ansible.builtin.shell: >-
    find /usr/lib/node_modules /usr/local/lib/node_modules
    "{{ nikos_home }}/.nvm/versions" -maxdepth 3 -type d -name '.*-*'
    -prune -exec rm -rf {} + 2>/dev/null || true
  become: true
  changed_when: false
  when: not ansible_check_mode
  tags: [ai-node, ai-gemini, openclaw]

# An exact version from vars/versions.yml; npm checks the tarball against the
# registry's integrity hash. Installed when missing or older than the pin;
# never downgraded.
- name: Read the installed Gemini CLI version
  ansible.builtin.slurp:
    src: "{{ (cloud_ai_cli_npm_prefix.stdout | default('/usr/local', true) | trim) ~ '/lib/node_modules/@google/gemini-cli/package.json' }}"
  register: cloud_ai_cli_gemini_installed
  failed_when: false
  check_mode: false
  tags: [ai-gemini]

- name: Decide whether Gemini CLI needs installing
  ansible.builtin.include_role:
    name: pin-gate
    tasks_from: version
    apply:
      tags: [ai-gemini]
  vars:
    pin_gate_name: Gemini CLI
    pin_gate_want: "{{ gemini_cli_version }}"
    pin_gate_path: "{{ (cloud_ai_cli_npm_prefix.stdout | default('/usr/local', true) | trim) ~ '/lib/node_modules/@google/gemini-cli/package.json' }}"
    pin_gate_output: "{{ (cloud_ai_cli_gemini_installed.content | default('e30=') | b64decode | from_json).version | default('') }}"
  tags: [ai-gemini]

- name: Install Gemini CLI {{ gemini_cli_version }}
  community.general.npm:
    name: "@google/gemini-cli"
    version: "{{ gemini_cli_version }}"
    global: true
    state: present
    executable: "{{ cloud_ai_cli_node_bin }}/npm"
  become: "{{ cloud_ai_cli_npm_needs_root }}"
  environment:
    PATH: "{{ cloud_ai_cli_node_bin }}:{{ ansible_env.PATH }}"
  when:
    - not ansible_check_mode
    - pin_gate_install | bool
  tags: [ai-gemini]

- name: Check whether GitHub CLI is installed
  ansible.builtin.command:
    argv:
      - which
      - gh
  register: cloud_ai_cli_gh_installed
  changed_when: false
  failed_when: false
  tags: [ai-copilot-cli]

# gh 2.98.0 made `copilot` a built-in command, and gh from cli.github.com (the
# github-setup role) is newer than that. The old github/gh-copilot extension
# was a release binary gh downloads without a checksum, so NikOS no longer
# installs it; an older gh is told to upgrade instead.
- name: Check whether gh provides the copilot command
  ansible.builtin.command: gh copilot --help
  register: cloud_ai_cli_gh_copilot
  changed_when: false
  failed_when: false
  when: cloud_ai_cli_gh_installed.rc == 0
  tags: [ai-copilot-cli]

- name: Say that this gh has no copilot command
  ansible.builtin.debug:
    msg: >-
      gh has no built-in `copilot` command (it arrived in gh 2.98.0). Upgrade gh
      from cli.github.com (`sudo apt install --only-upgrade gh`) to get it.
  when:
    - cloud_ai_cli_gh_installed.rc == 0
    - cloud_ai_cli_gh_copilot.rc | default(1) != 0
  tags: [ai-copilot-cli]

# Exact versions from vars/versions.yml, installed when missing or older than
# the pin and never downgraded. `--force` replaces an older install.
- name: Read the pipx applications NikOS installs
  ansible.builtin.command: pipx list --short
  register: cloud_ai_cli_pipx_list
  changed_when: false
  failed_when: false
  check_mode: false
  environment:
    PIPX_HOME: "{{ nikos_home }}/.local/pipx"
    PIPX_BIN_DIR: "{{ nikos_home }}/.local/bin"

- name: Decide whether shell-gpt needs installing
  ansible.builtin.include_role:
    name: pin-gate
    tasks_from: version
  vars:
    pin_gate_name: shell-gpt
    pin_gate_want: "{{ shell_gpt_version }}"
    pin_gate_path: "{{ nikos_home }}/.local/bin/sgpt"
    pin_gate_output: >-
      {{ cloud_ai_cli_pipx_list.stdout_lines | default([]) | select('match', '^shell-gpt ')
         | first | default('') | regex_replace('^shell-gpt ', '') }}

- name: Install shell-gpt via pipx at {{ shell_gpt_version }}
  ansible.builtin.command: pipx install --force shell-gpt=={{ shell_gpt_version }}
  changed_when: true
  when:
    - not ansible_check_mode
    - pin_gate_install | bool
  environment:
    PIPX_HOME: "{{ nikos_home }}/.local/pipx"
    PIPX_BIN_DIR: "{{ nikos_home }}/.local/bin"

- name: Decide whether glances needs installing
  ansible.builtin.include_role:
    name: pin-gate
    tasks_from: version
  vars:
    pin_gate_name: glances
    pin_gate_want: "{{ glances_version }}"
    pin_gate_path: "{{ nikos_home }}/.local/bin/glances"
    pin_gate_output: >-
      {{ cloud_ai_cli_pipx_list.stdout_lines | default([]) | select('match', '^glances ')
         | first | default('') | regex_replace('^glances ', '') }}

- name: Install glances via pipx at {{ glances_version }}
  ansible.builtin.command: pipx install --force glances=={{ glances_version }}
  changed_when: true
  when:
    - not ansible_check_mode
    - pin_gate_install | bool
  environment:
    PIPX_HOME: "{{ nikos_home }}/.local/pipx"
    PIPX_BIN_DIR: "{{ nikos_home }}/.local/bin"

- name: Skip the GitHub Copilot CLI because gh is not installed
  ansible.builtin.debug:
    msg: "Skipping the GitHub Copilot CLI because 'gh' is not installed or not available in PATH."
  when: cloud_ai_cli_gh_installed.rc != 0
  tags: [ai-copilot-cli]
