---
# NikOS-managed checkouts (distrodeck, image-view, git-lantern, ai-runner) live
# in nikos_tools_dir, not ~/Projects: that is the user's workspace, and a
# developer's own clone of one of these repos there made the playbook fail on
# "Local modifications exist in the destination".
- name: Ensure the NikOS tools directory exists
  ansible.builtin.file:
    path: "{{ nikos_tools_dir }}"
    state: directory
    mode: "0755"

# ── distrodeck (installs Rust/cargo, bat, eza, fzf, lazygit, gh, go, docker…) ──

# distrodeck_version is a release tag pinned in vars/versions.yml, checked out
# as distrodeck_commit after confirming the tag still points there; `nikos
# update` moves an existing clone to a changed pin. "latest" (vars/local.yml)
# follows the newest release tag instead. Offline, an existing clone is kept
# with a warning; with none there is nothing to fall back to.
- name: Resolve the distrodeck release
  ansible.builtin.command:
    argv:
      - "{{ playbook_dir }}/scripts/distrodeck-version.sh"
      - "{{ distrodeck_version }}"
      - "{{ '' if distrodeck_version == 'latest' else (distrodeck_commit | default('')) }}"
  environment:
    DISTRODECK_REPO_URL: "{{ distrodeck_repo_url }}"
  register: dev_tools_distrodeck_resolve
  changed_when: false
  failed_when: false
  check_mode: false

- name: Stop when the distrodeck tag does not match its pinned commit
  ansible.builtin.fail:
    msg: "{{ dev_tools_distrodeck_resolve.stderr | trim }}"
  when: dev_tools_distrodeck_resolve.rc == 3

- name: Check for an existing distrodeck clone
  ansible.builtin.stat:
    path: "{{ nikos_tools_dir }}/distrodeck/.git"
  register: dev_tools_distrodeck_clone

- name: Stop when no distrodeck release can be resolved and none is cloned
  ansible.builtin.fail:
    msg: >-
      Could not read distrodeck's release tags (offline?) and there is no
      clone at {{ nikos_tools_dir }}/distrodeck. Connect and re-run, or set
      distrodeck_version to a release in vars/local.yml.
  when:
    - dev_tools_distrodeck_resolve.rc != 0
    - not dev_tools_distrodeck_clone.stat.exists

- name: Warn that the existing distrodeck clone is kept
  ansible.builtin.debug:
    msg: >-
      Could not resolve distrodeck {{ distrodeck_version }} (offline?); keeping
      the existing clone at {{ nikos_tools_dir }}/distrodeck as it is.
  when: dev_tools_distrodeck_resolve.rc != 0

# The git module refuses to check out over tracked edits and would fail the
# whole update; keep an edited clone where it is and say so instead.
- name: Check the distrodeck clone for local edits
  ansible.builtin.command:
    argv: [git, -C, "{{ nikos_tools_dir }}/distrodeck", status, --porcelain, --untracked-files=no]
  register: dev_tools_distrodeck_dirty
  changed_when: false
  failed_when: false
  check_mode: false
  when: dev_tools_distrodeck_clone.stat.exists

- name: Warn that an edited distrodeck clone is not moved
  ansible.builtin.debug:
    msg: >-
      {{ nikos_tools_dir }}/distrodeck has local edits; leaving it where it
      is rather than moving it to {{ dev_tools_distrodeck_resolve.stdout | trim }}.
      Commit, stash or discard them and re-run `nikos update`.
  when:
    - nikos_update_mode | bool
    - dev_tools_distrodeck_resolve.rc == 0
    - (dev_tools_distrodeck_dirty.stdout | default('') | trim) | length > 0

# A clone that already contains the resolved release (one ahead of the pin)
# stays where it is: `nikos update` never moves a checkout backwards.
- name: Decide whether the distrodeck checkout has to move
  ansible.builtin.include_role:
    name: pin-gate
    tasks_from: git
  vars:
    pin_gate_dest: "{{ nikos_tools_dir }}/distrodeck"
    pin_gate_commit: "{{ dev_tools_distrodeck_resolve.stdout | default('') | trim }}"

- name: Clone distrodeck
  ansible.builtin.git:
    repo: "{{ distrodeck_repo_url }}"
    dest: "{{ nikos_tools_dir }}/distrodeck"
    version: "{{ dev_tools_distrodeck_resolve.stdout | trim }}"
    update: "{{ (nikos_update_mode | bool) or not dev_tools_distrodeck_clone.stat.exists }}"
  when:
    - dev_tools_distrodeck_resolve.rc == 0
    - (dev_tools_distrodeck_dirty.stdout | default('') | trim) | length == 0
    - not pin_gate_clone_current | bool

- name: Install distrodeck PATH wrapper
  ansible.builtin.copy:
    dest: /usr/local/bin/distrodeck
    mode: "0755"
    content: |
      #!/usr/bin/env bash
      exec "{{ nikos_tools_dir }}/distrodeck/distrodeck" "$@"
  become: true
  when: not ansible_check_mode

# The catalog flag decides which way distrodeck is driven. A release that has
# it installs exactly the list chosen at install time or with
# `nikos add tools`. An older release (0.10.3 and before) has no catalog to
# choose from, so it keeps the previous behaviour: the whole default set.
# Both paths stay, so NikOS works on either side of the release that adds it.
- name: Check whether this distrodeck publishes a tool catalog
  ansible.builtin.command:
    argv:
      - "{{ nikos_tools_dir }}/distrodeck/distrodeck"
      - install-tools
      - --list-catalog
      - --format
      - tsv
  register: dev_tools_catalog
  changed_when: false
  failed_when: false
  check_mode: false

# The saved list was chosen against an older catalog when `nikos update` has
# just moved distrodeck forward. distrodeck rejects the whole run (exit 2) on
# one unknown name, so drop names this release does not know. The rest keep
# the saved order: the selection already put each tool's needs before it
# (postgresql before pgvector), and distrodeck installs in that order.
- name: Match the saved distrodeck tools against this catalog
  vars:
    dev_tools_known: >-
      {{ dev_tools_catalog.stdout_lines | default([])
         | map('regex_replace', '^[^\t]*\t[^\t]*\t([^\t]*).*$', '\1') | list }}
    dev_tools_wanted: "{{ nikos_distrodeck_tools.split(',') | map('trim') | select | list }}"
  ansible.builtin.set_fact:
    dev_tools_selected: >-
      {{ dev_tools_wanted | select('in', dev_tools_known)
         | reject('in', nikos_distrodeck_owned_tools) | list }}
    dev_tools_owned: "{{ dev_tools_wanted | select('in', nikos_distrodeck_owned_tools) | list }}"
    dev_tools_unknown: >-
      {{ dev_tools_wanted | reject('in', dev_tools_known)
         | reject('in', nikos_distrodeck_owned_tools) | list }}
  when: (dev_tools_catalog.rc | default(1)) == 0

- name: Warn about saved distrodeck tools this release does not have
  ansible.builtin.debug:
    msg: >-
      Not in this distrodeck's catalog, skipped: {{ dev_tools_unknown | join(', ') }}.
      Run `nikos add tools` to update the selection.
  when:
    - (dev_tools_catalog.rc | default(1)) == 0
    - dev_tools_unknown | length > 0

- name: Warn about saved distrodeck tools NikOS installs itself
  ansible.builtin.debug:
    msg: >-
      Not installed through distrodeck: {{ dev_tools_owned | join(', ') }}.
      NikOS owns these: Ollama comes from the ai-stack role, MongoDB from
      `nikos add mongodb`. Run `nikos add tools` to save a list without them.
  when:
    - (dev_tools_catalog.rc | default(1)) == 0
    - dev_tools_owned | length > 0

- name: Install the selected distrodeck tools
  ansible.builtin.command:
    argv:
      - "{{ nikos_tools_dir }}/distrodeck/distrodeck"
      - install-tools
      - --tools
      - "{{ dev_tools_selected | join(',') }}"
  changed_when: false
  when:
    - not ansible_check_mode
    - (dev_tools_catalog.rc | default(1)) == 0
    - dev_tools_selected | length > 0

- name: Note that no distrodeck tools were selected
  ansible.builtin.debug:
    msg: >-
      No distrodeck tools are selected for this machine. Run `nikos add tools`
      to choose some.
  when:
    - (dev_tools_catalog.rc | default(1)) == 0
    - dev_tools_selected | length == 0

- name: Note that this distrodeck has no tool catalog
  ansible.builtin.debug:
    msg: >-
      distrodeck {{ dev_tools_distrodeck_resolve.stdout | default('') | trim | default(distrodeck_version, true) }} has no tool catalog
      (install-tools --list-catalog); installing its default set with --all.
  when: (dev_tools_catalog.rc | default(1)) != 0

- name: Install the default distrodeck tool set
  ansible.builtin.command: "{{ nikos_tools_dir }}/distrodeck/distrodeck install-tools --all"
  changed_when: false
  args:
    creates: "{{ nikos_home }}/.local/state/distrodeck/installed-tools.txt"
  when:
    - not ansible_check_mode
    - (dev_tools_catalog.rc | default(1)) != 0

# `distrodeck install-tools` has no upgrade or force mode - it detects an
# existing executable and records it as "Already installed (skipped)" - so the
# task above cannot refresh anything on a host that already has the tools. The
# refresh therefore goes through the package managers distrodeck installed the
# tools with. The apt ones need nothing here: the base role's "Upgrade all
# packages" runs `upgrade: safe` earlier in this same play, on every pass. snap
# and flatpak are not covered anywhere else and account for most of the
# catalog. Tools installed with cargo, go or npm still need an upgrade mode in
# distrodeck itself and are documented as not refreshed.
- name: Resolve the package managers distrodeck installs through
  # `command -v` is a shell builtin, so this needs a shell rather than command.
  ansible.builtin.shell: "command -v {{ item }} || true"
  register: dev_tools_extra_pkg_managers
  changed_when: false
  check_mode: false
  loop:
    - snap
    - flatpak

- name: Refresh snap packages managed through distrodeck
  ansible.builtin.command: snap refresh
  become: true
  changed_when: false
  when:
    - not ansible_check_mode
    - nikos_update_mode | bool
    - dev_tools_extra_pkg_managers.results[0].stdout | trim | length > 0

- name: Refresh flatpak packages managed through distrodeck
  ansible.builtin.command: flatpak update --assumeyes
  become: true
  changed_when: false
  when:
    - not ansible_check_mode
    - nikos_update_mode | bool
    - dev_tools_extra_pkg_managers.results[1].stdout | trim | length > 0

# ── image-view (terminal image preview — requires cargo from distrodeck) ──

# image-view's `setup` runs a plain `cargo build --release` with no --locked,
# and its dependencies use version ranges, so every build can rewrite the
# tracked Cargo.lock. The build below now runs on every update, so by the next
# update that file is modified and ansible.builtin.git - which defaults to
# force: false - refuses to update the checkout. Restore that one generated
# file. Anything else the user changed still blocks the update, which is the
# behaviour worth keeping.
# noqa: command-instead-of-module - the git module manages a whole
# checkout and cannot restore a single tracked path; force: true would
# discard the user's own edits, which is what this must preserve.
- name: Check whether the image-view build left Cargo.lock modified # noqa: command-instead-of-module
  ansible.builtin.command:
    cmd: git -C {{ nikos_tools_dir }}/image-view status --porcelain -- Cargo.lock
  register: dev_tools_image_view_lock
  changed_when: false
  failed_when: false
  check_mode: false

# noqa: command-instead-of-module - the git module manages a whole
# checkout and cannot restore a single tracked path; force: true would
# discard the user's own edits, which is what this must preserve.
- name: Restore the generated image-view Cargo.lock # noqa: command-instead-of-module
  ansible.builtin.command:
    cmd: git -C {{ nikos_tools_dir }}/image-view checkout -- Cargo.lock
  changed_when: true
  when:
    - not ansible_check_mode
    - dev_tools_image_view_lock.rc == 0
    - dev_tools_image_view_lock.stdout | trim | length > 0

- name: Decide whether the image-view checkout has to move
  ansible.builtin.include_role:
    name: pin-gate
    tasks_from: git
  vars:
    pin_gate_dest: "{{ nikos_tools_dir }}/image-view"
    pin_gate_commit: "{{ image_view_commit }}"

- name: Clone image-view
  ansible.builtin.git:
    repo: https://github.com/nikolareljin/image-view.git
    dest: "{{ nikos_tools_dir }}/image-view"
    # The commit of release tag image_view_version; `nikos update` moves an
    # existing clone to it.
    version: "{{ image_view_commit }}"
    update: "{{ nikos_update_mode | bool }}"
  when: not pin_gate_clone_current | bool

- name: Resolve cargo binary for image-view build
  # Prefer the rustup-managed cargo over any system apt cargo.
  # The apt cargo on Ubuntu 24.04 is 1.75.0, which predates edition2024 (stabilised
  # in Rust 1.85). Transitive dependencies of image-view (e.g. moxcms) require
  # edition2024, so we must use the toolchain rustup installed via distrodeck.
  # POSIX redirection, not `&>`: this runs under /bin/sh, which is dash on
  # Ubuntu. There `command -v rustup &>/dev/null` parses as "run in the
  # background, then redirect nothing", so the path is printed rather than
  # suppressed and the caller receives several lines instead of one.
  ansible.builtin.shell: |
    if command -v rustup >/dev/null 2>&1 && rustup which cargo >/dev/null 2>&1; then
      rustup which cargo
    elif command -v cargo >/dev/null 2>&1; then
      command -v cargo
    fi
  register: dev_tools_cargo_path
  changed_when: false
  failed_when: false
  check_mode: false

# Take the last line and nothing else. Whatever the resolver prints, only one
# path can be run, and passing several to `command` produced
# "error: unexpected argument" rather than a version string.
- name: Note the resolved cargo binary
  ansible.builtin.set_fact:
    dev_tools_cargo_bin: >-
      {{ (dev_tools_cargo_path.stdout | default('') | trim).split('\n')
         | last | default('', true) | trim }}

- name: Check cargo version for image-view build
  ansible.builtin.command: "{{ dev_tools_cargo_bin }} --version"
  register: dev_tools_cargo_version
  changed_when: false
  failed_when: false
  check_mode: false
  when:
    - dev_tools_cargo_bin | length > 0

# Set unconditionally. When this carried a `when`, a host without cargo left
# the fact undefined and every later `is version(...)` test raised on it -
# `and` does not reliably short-circuit before Ansible templates the whole
# condition.
# The dot is matched with a character class rather than \. on purpose. Written
# as '\\.' inside this folded scalar the backslash does not survive the YAML
# then Jinja parsing, the pattern never matches, and the version silently
# becomes the 0.0.0 default - which is below the 1.85 gate, so image-view was
# quietly never built. [.] needs no escaping and cannot regress that way.
- name: Set cargo version fact for image-view build
  ansible.builtin.set_fact:
    dev_tools_cargo_version_number: >-
      {{
        dev_tools_cargo_version.stdout
        | default('')
        | regex_search('[0-9]+[.][0-9]+[.][0-9]+')
        | default('0.0.0', true)
      }}

- name: Check whether image-view binary is already installed
  ansible.builtin.stat:
    path: "{{ nikos_home }}/.local/bin/image-view"
  register: dev_tools_image_view_bin

- name: Build and install image-view
  ansible.builtin.command: "{{ nikos_tools_dir }}/image-view/setup"
  changed_when: false
  environment:
    HOME: "{{ nikos_home }}"
    INSTALL_DIR: "{{ nikos_home }}/.local/bin"
    # Prepend the resolved cargo's bin dir so the setup script finds the right cargo.
    PATH: "{{ (dev_tools_cargo_bin | dirname) + ':' + ansible_env.PATH }}"
  register: dev_tools_image_view_result
  ignore_errors: true
  when:
    - not ansible_check_mode
    - dev_tools_cargo_bin | length > 0
    - dev_tools_cargo_version_number is version('1.85.0', '>=')
    - nikos_update_mode | bool or not dev_tools_image_view_bin.stat.exists

- name: Warn when image-view build failed
  ansible.builtin.debug:
    msg: >-
      image-view build failed (rc={{ dev_tools_image_view_result.rc | default('n/a') }}).
      It is optional — the rest of NikOS is fully installed.
      To retry: cd {{ nikos_tools_dir }}/image-view && cargo build --release
      Error: {{ dev_tools_image_view_result.stderr | default('') | truncate(200) }}
  when:
    - not ansible_check_mode
    - dev_tools_image_view_result is defined
    - dev_tools_image_view_result.failed | default(false)

- name: Warn when cargo is too old for image-view
  ansible.builtin.debug:
    msg: >-
      image-view skipped: Cargo {{ dev_tools_cargo_version_number }} is too old.
      image-view dependencies require Cargo 1.85+ for edition2024 support.
      Install/update Rust via distrodeck, then rerun nikos update.
  when:
    - not ansible_check_mode
    - dev_tools_cargo_bin | length > 0
    - dev_tools_cargo_version_number is version('1.85.0', '<')
    - nikos_update_mode | bool or not dev_tools_image_view_bin.stat.exists

- name: Warn when cargo was not found for image-view
  ansible.builtin.debug:
    msg: "image-view skipped: no cargo binary found. Select Rust in distrodeck install-tools, then rerun nikos update."
  when:
    - not ansible_check_mode
    - dev_tools_cargo_bin | length == 0

# ── git-lantern (repo dashboard CLI — command: lantern) ──

- name: Decide whether the git-lantern checkout has to move
  ansible.builtin.include_role:
    name: pin-gate
    tasks_from: git
  vars:
    pin_gate_dest: "{{ nikos_tools_dir }}/git-lantern"
    pin_gate_commit: "{{ git_lantern_commit }}"

- name: Clone git-lantern
  ansible.builtin.git:
    repo: https://github.com/nikolareljin/git-lantern.git
    dest: "{{ nikos_tools_dir }}/git-lantern"
    # The commit of release tag git_lantern_version; `nikos update` moves an
    # existing clone to it.
    version: "{{ git_lantern_commit }}"
    update: "{{ nikos_update_mode | bool }}"
    recursive: false
  when: not pin_gate_clone_current | bool

- name: Check whether git-lantern is installed
  ansible.builtin.stat:
    path: "{{ nikos_home }}/.local/bin/lantern"
  register: dev_tools_git_lantern_bin

- name: Ensure user local bin directory exists for git-lantern
  ansible.builtin.file:
    path: "{{ nikos_home }}/.local/bin"
    state: directory
    mode: "0755"

- name: Build and install git-lantern for the NikOS user
  ansible.builtin.command: >
    {{ nikos_tools_dir }}/git-lantern/install
    --prefix {{ nikos_home }}/.local/opt/git-lantern
    --bin-link {{ nikos_home }}/.local/bin/lantern
  changed_when: false
  when:
    - not ansible_check_mode
    - nikos_update_mode | bool or not dev_tools_git_lantern_bin.stat.exists

# Pinned release (mkcert_version), checked against mkcert_sha256. Installed
# when missing or older than the pin; never downgraded. Prints "v1.4.4".
- name: Read the installed mkcert version
  ansible.builtin.command: "{{ nikos_home }}/.local/bin/mkcert -version"
  register: dev_tools_mkcert_installed
  changed_when: false
  failed_when: false
  check_mode: false

- name: Decide whether mkcert needs installing
  ansible.builtin.include_role:
    name: pin-gate
    tasks_from: version
  vars:
    pin_gate_name: mkcert
    pin_gate_want: "{{ mkcert_version }}"
    pin_gate_path: "{{ nikos_home }}/.local/bin/mkcert"
    pin_gate_output: "{{ dev_tools_mkcert_installed.stdout | default('') }}"

- name: Install mkcert {{ mkcert_version }}
  ansible.builtin.get_url:
    url: "https://github.com/FiloSottile/mkcert/releases/download/{{ mkcert_version }}/mkcert-{{ mkcert_version }}-linux-amd64"
    dest: "{{ nikos_home }}/.local/bin/mkcert"
    checksum: "sha256:{{ mkcert_sha256 }}"
    force: true
    mode: "0755"
  when:
    - not ansible_check_mode
    - pin_gate_install | bool

# ── ai-runner (local Ollama model runner with simple UI) ──

- name: Decide whether the ai-runner checkout has to move
  ansible.builtin.include_role:
    name: pin-gate
    tasks_from: git
    apply:
      tags: [ai-runner]
  vars:
    pin_gate_dest: "{{ nikos_tools_dir }}/ai-runner"
    pin_gate_commit: "{{ ai_runner_commit }}"
  tags: [ai-runner]

- name: Clone ai-runner
  ansible.builtin.git:
    repo: https://github.com/nikolareljin/ai-runner.git
    dest: "{{ nikos_tools_dir }}/ai-runner"
    # The commit of release tag ai_runner_version; `nikos update` moves an
    # existing clone to it.
    version: "{{ ai_runner_commit }}"
    update: "{{ nikos_update_mode | bool }}"
  when: not pin_gate_clone_current | bool
  tags: [ai-runner]
