---
- name: Install nala (apt frontend)
  ansible.builtin.apt:
    name: nala
    state: present
    update_cache: true
    cache_valid_time: 3600

# `upgrade: safe` may install new packages, so it can pull a newer kernel
# through linux-generic. In an image build that leaves the squashfs on a kernel
# the live casper kernel does not match, so the kernel packages are held for
# the upgrade and released afterwards - a hold left in place would follow the
# image onto every installed machine and stop its kernel updates.
- name: Upgrade all packages
  vars:
    base_kernel_packages: >-
      {{ (ansible_facts.packages | default({})).keys()
         | select('match', '^linux-(image|generic|headers-generic|modules)')
         | list }}
  block:
    - name: Find the installed kernel packages to hold for an image build
      ansible.builtin.package_facts:
        manager: apt
      when: nikos_image_build | default(false) | bool

    - name: Hold the kernel packages during an image build
      ansible.builtin.dpkg_selections:
        name: "{{ item }}"
        selection: hold
      loop: "{{ base_kernel_packages }}"
      when: nikos_image_build | default(false) | bool

    - name: Upgrade packages
      ansible.builtin.apt:
        upgrade: safe
        update_cache: false
        cache_valid_time: 3600
  always:
    - name: Release the kernel package holds
      ansible.builtin.dpkg_selections:
        name: "{{ item }}"
        selection: install
      loop: "{{ base_kernel_packages }}"
      when: nikos_image_build | default(false) | bool

# Every package here has to make sense on a machine with no screen; the server
# profile runs this role. xfconf and inkscape used to be here only because the
# desktop and theming roles need them, and now live in those roles.
- name: Install core dependencies
  ansible.builtin.apt:
    name:
      - git
      - curl
      - wget
      - build-essential  # native builds: llama.cpp tools, pip wheels, bitnet
      - python3-pip
      - python3-venv
      - flatpak  # distrodeck and the music/education bundles install through it
      - gnupg  # vendor apt keys
      - lsb-release
      - ca-certificates
      - software-properties-common  # add-apt-repository
      - dialog  # TUI prompts used by install.sh and nikos scripts
      - openssh-server  # remote access; the only way into a server install
      - tmux
      - pipx
      - sqlite3
      - unzip
    state: present

# ── Dual boot ─────────────────────────────────────────────────────────────────
- name: Check whether this system boots with GRUB
  ansible.builtin.stat:
    path: /etc/default/grub
  register: base_grub_defaults

- name: Let GRUB list other operating systems
  when:
    - nikos_grub_os_prober | bool
    - not (nikos_image_build | default(false) | bool)
    - base_grub_defaults.stat.exists
  block:
    - name: Install os-prober
      ansible.builtin.apt:
        name: os-prober
        state: present

    - name: Ensure the GRUB drop-in directory exists
      ansible.builtin.file:
        path: /etc/default/grub.d
        state: directory
        mode: "0755"

    - name: Enable os-prober in GRUB
      ansible.builtin.copy:
        dest: /etc/default/grub.d/60-nikos-os-prober.cfg
        mode: "0644"
        content: |
          # Managed by NikOS (roles/base). Set nikos_grub_os_prober: false in
          # vars/local.yml to stop managing this file.
          GRUB_DISABLE_OS_PROBER=false
      notify: Base_update_grub

- name: Deploy default tmux config
  ansible.builtin.copy:
    src: tmux.conf
    dest: "{{ nikos_home }}/.tmux.conf"
    owner: "{{ ansible_user_id }}"
    group: "{{ ansible_user_gid }}"
    mode: "0644"
    force: false

- name: Set timezone
  community.general.timezone:
    name: "{{ nikos_timezone }}"
    hwclock: UTC

# `timedatectl set-ntp true` answers "NTP not supported" when no unit listed
# under /usr/lib/systemd/ntp-units.d is loaded; its CanNTP property is that
# same test. Ubuntu 22.04 and 24.04 get systemd-timesyncd only as a Recommends
# of systemd, and 25.10 and later ship chrony instead, so a minimal install, a
# `--no-install-recommends` one, or one where `apt remove chrony` ran has no
# time daemon at all. Install the one this release ships, then enable NTP.
# On 24.04 ntpsec and openntpd keep the clock without an ntp-units.d entry
# (26.04's ntpsec ships one), and every time daemon conflicts with the others,
# so nothing is installed next to one.
# A container cannot run either unit (ConditionVirtualization=!container), so
# it gets no package. With CanNTP=no it gets a note instead of a failed
# playbook. With CanNTP=yes (a daemon package already there) set-ntp exits 0,
# NTP stays no, there is no note, and `nikos doctor` warns.
- name: Enable NTP time synchronization
  when: not (nikos_image_build | default(false) | bool)
  vars:
    base_time_daemon: >-
      {{ 'chrony' if ansible_facts.distribution_version is version('25.10', '>=')
         else 'systemd-timesyncd' }}
    base_in_container: >-
      {{ 'container' in (ansible_facts.virtualization_tech_guest | default([])) }}
  block:
    - name: Ask systemd whether a time sync service is available
      ansible.builtin.command: timedatectl show --property=CanNTP --value
      register: base_can_ntp
      changed_when: false
      failed_when: false
      check_mode: false

    - name: List the installed packages that provide a time daemon
      ansible.builtin.shell: >-
        set -o pipefail;
        dpkg-query -W -f='${Package} ${Status}\t${Provides}\n'
        | awk -F'\t' '$1 ~ / installed$/ && $2 ~ /(^|[ ,])time-daemon($|[ ,(])/ { sub(/ .*/, "", $1); print $1 }'
      args:
        executable: /bin/bash
      register: base_time_daemons
      changed_when: false
      check_mode: false

    - name: Install the time sync service this Ubuntu release ships
      ansible.builtin.apt:
        name: "{{ base_time_daemon }}"
        state: present
      register: base_time_daemon_install
      when:
        - base_can_ntp.rc == 0
        - (base_can_ntp.stdout | trim) != 'yes'
        - base_time_daemons.stdout_lines | length == 0
        - not (base_in_container | bool)

    # systemd-timedated reads ntp-units.d once, when it starts, and the
    # timezone task above started it. Stopped here, it comes back on the next
    # timedatectl call (D-Bus activation) with the new unit in its list. Not a
    # handler: it has to run before the set-ntp call below, not at play end.
    - name: Stop timedated so it picks up the new time sync unit
      ansible.builtin.systemd:
        name: systemd-timedated.service
        state: stopped
      when: base_time_daemon_install is not skipped

    - name: Turn NTP on
      ansible.builtin.command: timedatectl set-ntp true
      register: base_set_ntp
      changed_when: false
      failed_when:
        - base_set_ntp.rc != 0
        - "'NTP not supported' not in (base_set_ntp.stderr | default(''))"

    - name: Report that timedatectl cannot turn NTP on
      ansible.builtin.debug:
        msg: "{{ base_ntp_off_note }}"
      vars:
        base_ntp_daemon_note: >-
          {{ base_time_daemons.stdout_lines | join(', ') }} is installed; systemd
          loads no unit for it (masked, or no /usr/lib/systemd/ntp-units.d entry).
        base_ntp_container_note: >-
          No time sync service can run on this host (a container). On a machine
          that can run one, `apt install {{ base_time_daemon }}` and
          `timedatectl set-ntp true` turn it on.
        base_ntp_installed_note: >-
          {{ base_time_daemon }} is installed, but systemd still loads no unit
          for it (masked, or no /usr/lib/systemd/ntp-units.d entry).
        base_ntp_not_installed_note: >-
          systemd loads no time sync unit on this host. `apt install
          {{ base_time_daemon }}` and `timedatectl set-ntp true` turn it on.
        base_ntp_off_note: >-
          timedatectl cannot turn NTP on here ({{ base_set_ntp.stderr | trim }}),
          so NTP stays off.
          {{ base_ntp_daemon_note if base_time_daemons.stdout_lines | length > 0
             else base_ntp_container_note if base_in_container | bool
             else base_ntp_installed_note if base_time_daemon_install is not skipped
             else base_ntp_not_installed_note }}
      when: (base_set_ntp.rc | default(0)) != 0

- name: Set locale
  community.general.locale_gen:
    name: "{{ nikos_locale }}"
    state: present

# --if-not-exists prints nothing when the remote exists, so the old
# "already exists" test reported a change on every run. Ask first.
- name: List flatpak remotes
  ansible.builtin.command: flatpak remotes --system --columns=name
  register: base_flatpak_remotes
  changed_when: false
  failed_when: false
  check_mode: false

- name: Add Flathub remote
  ansible.builtin.command: flatpak remote-add --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
  register: base_flathub_result
  changed_when: true
  when: "'flathub' not in (base_flatpak_remotes.stdout_lines | default([]) | map('trim') | list)"
