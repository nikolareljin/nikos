---
- name: Install nala (apt frontend)
  ansible.builtin.apt:
    name: nala
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Upgrade all packages
  ansible.builtin.apt:
    upgrade: safe
    update_cache: false
    cache_valid_time: 3600

# Every package here has to make sense on a machine with no screen; the server
# profile runs this role. xfconf and inkscape used to be here only because the
# desktop and theming roles need them, and now live in those roles.
- name: Install core dependencies
  ansible.builtin.apt:
    name:
      - git
      - curl
      - wget
      - build-essential  # native builds: llama.cpp tools, pip wheels, bitnet
      - python3-pip
      - python3-venv
      - flatpak  # distrodeck and the music/education bundles install through it
      - gnupg  # vendor apt keys
      - lsb-release
      - ca-certificates
      - software-properties-common  # add-apt-repository
      - dialog  # TUI prompts used by install.sh and nikos scripts
      - openssh-server  # remote access; the only way into a server install
      - tmux
      - pipx
      - sqlite3
      - unzip
    state: present

- name: Deploy default tmux config
  ansible.builtin.copy:
    src: tmux.conf
    dest: "{{ nikos_home }}/.tmux.conf"
    owner: "{{ ansible_user_id }}"
    group: "{{ ansible_user_gid }}"
    mode: "0644"
    force: false

- name: Set timezone
  community.general.timezone:
    name: "{{ nikos_timezone }}"
    hwclock: UTC

- name: Enable NTP time synchronization
  ansible.builtin.command: timedatectl set-ntp true
  changed_when: false

- name: Set locale
  community.general.locale_gen:
    name: "{{ nikos_locale }}"
    state: present

- name: Add Flathub remote
  ansible.builtin.command: flatpak remote-add --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
  register: base_flathub_result
  changed_when: "'already exists' not in (base_flathub_result.stderr | default(''))"
