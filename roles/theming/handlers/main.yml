---
# Never in an image build: there update-grub would probe the build host and
# write a grub.cfg the installed machine never reads.
- name: Theming_update_grub
  ansible.builtin.command: update-grub
  changed_when: true
  when: not (nikos_image_build | default(false) | bool)

- name: Theming_update_initramfs
  ansible.builtin.command: update-initramfs -u -k all
  changed_when: true

- name: Theming_update_icon_cache
  ansible.builtin.command: gtk-update-icon-cache -f -t /usr/share/icons/hicolor
  changed_when: true
  failed_when: false
