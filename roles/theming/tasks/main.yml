---
# Renders the SVG wallpaper to PNG below. Installed here rather than in base so
# a server install does not pull a vector graphics editor.
- name: Install inkscape for the wallpaper export
  ansible.builtin.apt:
    name: inkscape
    state: present

- name: Create NikOS asset directory
  ansible.builtin.file:
    path: /usr/share/nikos
    state: directory
    mode: "0755"

- name: Copy wallpaper SVG
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/assets/wallpaper.svg"
    dest: /usr/share/nikos/wallpaper.svg
    mode: "0644"
  register: theming_wallpaper_svg

- name: Check for the exported wallpaper PNG
  ansible.builtin.stat:
    path: /usr/share/nikos/wallpaper.png
  register: theming_wallpaper_png

# Export whenever the SVG moved, not just when the PNG is missing. A `creates:`
# guard would leave every existing install on the PNG rendered by the version
# it was first installed with, so artwork changes would never reach an upgrade.
- name: Export wallpaper SVG to PNG
  ansible.builtin.command: >
    inkscape /usr/share/nikos/wallpaper.svg
    --export-filename=/usr/share/nikos/wallpaper.png
    --export-width=1920 --export-height=1080
  changed_when: true
  when:
    - not ansible_check_mode
    - theming_wallpaper_svg is changed or not theming_wallpaper_png.stat.exists

# Portrait cut of the same artwork, for monitors rotated into vertical
# orientation. Scaling the landscape image onto a 9:16 screen leaves most of
# the screen empty; this keeps the marks readable at the same size.
- name: Copy portrait wallpaper SVG
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/assets/wallpaper-vertical.svg"
    dest: /usr/share/nikos/wallpaper-vertical.svg
    mode: "0644"
  register: theming_wallpaper_vertical_svg

- name: Check for the exported portrait wallpaper PNG
  ansible.builtin.stat:
    path: /usr/share/nikos/wallpaper-vertical.png
  register: theming_wallpaper_vertical_png

- name: Export portrait wallpaper SVG to PNG
  ansible.builtin.command: >
    inkscape /usr/share/nikos/wallpaper-vertical.svg
    --export-filename=/usr/share/nikos/wallpaper-vertical.png
    --export-width=1080 --export-height=1920
  changed_when: true
  when:
    - not ansible_check_mode
    - theming_wallpaper_vertical_svg is changed
      or not theming_wallpaper_vertical_png.stat.exists

- name: Install Papirus icon theme
  ansible.builtin.apt:
    name: papirus-icon-theme
    state: present

- name: Download Nordic GTK theme
  ansible.builtin.get_url:
    url: "{{ nordic_gtk_url }}"
    checksum: "sha256:{{ nordic_gtk_sha256 }}"
    dest: /tmp/Nordic.tar.xz
    mode: "0644"
  when: not ansible_check_mode

- name: Create themes directory
  ansible.builtin.file:
    path: /usr/share/themes
    state: directory
    mode: "0755"

- name: Extract Nordic GTK theme
  ansible.builtin.unarchive:
    src: /tmp/Nordic.tar.xz
    dest: /usr/share/themes/
    remote_src: true
    creates: /usr/share/themes/Nordic
  when: not ansible_check_mode

- name: Create GRUB themes directory
  ansible.builtin.file:
    path: /usr/share/grub/themes
    state: directory
    mode: "0755"

# NikOS ships its own GRUB theme (files/grub). It used to look for one in the
# Nordic GTK repo, which has never contained a GRUB theme, so every install
# printed "Nordic GRUB theme was not found" and booted the default menu.
- name: Install the NikOS GRUB theme
  ansible.builtin.copy:
    src: grub/
    dest: /usr/share/grub/themes/NikOS/
    mode: "0644"
    directory_mode: "0755"
  notify: Theming_update_grub

# GRUB reads the theme before the kernel runs, so it must sit on a filesystem
# GRUB can open. With an encrypted root or a separate /boot, /usr/share is not
# that filesystem, and the theme silently fails to load. Those installs also
# get a copy in /boot and GRUB_THEME points there. An image build keeps
# /usr/share only: its squashfs excludes boot/grub.
- name: Find the block devices under the root filesystem
  ansible.builtin.shell: |
    set -o pipefail
    # -v drops a btrfs subvolume suffix ("/dev/sda2[/@]"), which lsblk rejects;
    # -r prints one bare TYPE per line, without the tree prefix ("`-crypt")
    # that would hide an encrypted layer under LVM.
    lsblk -nrso TYPE "$(findmnt -nvo SOURCE /)" 2>/dev/null || true
  args:
    executable: /bin/bash
  register: theming_root_stack
  changed_when: false
  check_mode: false
  when: not (nikos_image_build | default(false) | bool)

- name: Choose where GRUB reads the theme from
  vars:
    theming_mount_points: "{{ ansible_facts.mounts | default([]) | map(attribute='mount') | list }}"
    theming_root_types: "{{ theming_root_stack.stdout_lines | default([]) }}"
  ansible.builtin.set_fact:
    theming_grub_theme_root: >-
      {{ '/boot/grub/themes'
         if (not (nikos_image_build | default(false) | bool))
            and (('/boot' in theming_mount_points) or ('crypt' in theming_root_types))
         else '/usr/share/grub/themes' }}

- name: Copy the NikOS GRUB theme to /boot for GRUB to read
  ansible.builtin.copy:
    src: grub/
    dest: /boot/grub/themes/NikOS/
    mode: "0644"
    directory_mode: "0755"
  when: theming_grub_theme_root == '/boot/grub/themes'

# GRUB is not always present. An installer payload carries the system that gets
# copied to the target disk, and the bootloader is installed onto that disk
# afterwards, so /etc/default/grub does not exist while the payload is being
# built. Editing it unconditionally turns a bootloader that is not there yet
# into a hard failure.
- name: Check whether GRUB defaults exist
  ansible.builtin.stat:
    path: /etc/default/grub
  register: theming_grub_defaults

- name: Configure GRUB to use the NikOS theme
  ansible.builtin.lineinfile:
    path: /etc/default/grub
    regexp: "^#?GRUB_THEME="
    line: 'GRUB_THEME="{{ theming_grub_theme_root }}/NikOS/theme.txt"'
  when: theming_grub_defaults.stat.exists
  notify: Theming_update_grub

- name: Ensure Plymouth splash is enabled in empty GRUB defaults
  ansible.builtin.replace:
    path: /etc/default/grub
    regexp: '^GRUB_CMDLINE_LINUX_DEFAULT=""$'
    replace: 'GRUB_CMDLINE_LINUX_DEFAULT="splash"'
  when: theming_grub_defaults.stat.exists
  notify: Theming_update_grub

- name: Replace disabled Plymouth token in GRUB defaults
  ansible.builtin.replace:
    path: /etc/default/grub
    regexp: '^(GRUB_CMDLINE_LINUX_DEFAULT="[^"]*)\bnosplash\b([^"]*")$'
    replace: '\1splash\2'
  when: theming_grub_defaults.stat.exists
  notify: Theming_update_grub

- name: Ensure Plymouth splash is enabled in GRUB defaults
  ansible.builtin.replace:
    path: /etc/default/grub
    regexp: '^(GRUB_CMDLINE_LINUX_DEFAULT=")(?![^"]*\bsplash\b)([^"]*\S)(")$'
    replace: '\1\2 splash\3'
  when: theming_grub_defaults.stat.exists
  notify: Theming_update_grub

- name: Install Plymouth and themes package
  ansible.builtin.apt:
    name:
      - plymouth
      - plymouth-label
      - plymouth-themes
    state: present

- name: Enable Plymouth framebuffer scripts in initramfs
  ansible.builtin.copy:
    dest: /etc/initramfs-tools/conf.d/nikos-plymouth
    content: |
      FRAMEBUFFER=y
    mode: "0644"
  notify: Theming_update_initramfs

- name: Copy NikOS logo PNG to system asset directory
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/assets/logo.png"
    dest: /usr/share/nikos/logo.png
    mode: "0644"

- name: Copy NikOS logo SVG to system asset directory
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/assets/logo.svg"
    dest: /usr/share/nikos/logo.svg
    mode: "0644"

# Panel menu button icon. Installed under hicolor as `nikos-menu` so the
# Whisker Menu can reference it by icon name and GTK scales the SVG per panel
# size, instead of pointing at an absolute path that only fits one size.
- name: Copy NikOS menu icon to system asset directory
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/assets/menu-icon.svg"
    dest: /usr/share/nikos/menu-icon.svg
    mode: "0644"

- name: Ensure the scalable hicolor app icon directory exists
  ansible.builtin.file:
    path: /usr/share/icons/hicolor/scalable/apps
    state: directory
    mode: "0755"

- name: Install the NikOS menu icon into the hicolor theme
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/assets/menu-icon.svg"
    dest: /usr/share/icons/hicolor/scalable/apps/nikos-menu.svg
    mode: "0644"
  notify: Theming_update_icon_cache

# GTK searches ~/.icons and ~/.local/share/icons ahead of /usr/share/icons, so
# a copy of nikos-menu in either shadows the one installed above and a
# reinstall silently changes nothing. Earlier NikOS builds left one behind, and
# it is why a machine could keep drawing the missing-image placeholder after
# the icon itself had been fixed. NikOS owns this icon name, so removing the
# user-level copies is safe: there is no user artwork to lose.
- name: Look for user-level copies of the NikOS menu icon
  ansible.builtin.stat:
    path: "{{ item }}"
  become: false
  loop:
    - "{{ nikos_home }}/.icons/hicolor/scalable/apps/nikos-menu.svg"
    - "{{ nikos_home }}/.local/share/icons/hicolor/scalable/apps/nikos-menu.svg"
  register: theming_user_menu_icons

# Restricted to regular files and symlinks. `state: absent` on a directory
# removes it and everything under it, so a directory that happens to carry this
# name would be deleted wholesale rather than skipped.
- name: Record which user-level copies are shadowing the system icon
  ansible.builtin.set_fact:
    theming_shadowing_menu_icons: >-
      {{ theming_user_menu_icons.results
         | selectattr('stat.exists')
         | selectattr('stat.isdir', 'false')
         | map(attribute='item')
         | list }}

- name: Remove user-level copies of the NikOS menu icon
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  become: false
  loop: "{{ theming_shadowing_menu_icons }}"

# A cache that still lists the icon is as good as the file itself: GTK trusts
# the cache and keeps resolving a name with nothing behind it. These
# directories carry no index.theme, so the cache is rebuilt without one. The
# loop is empty when nothing was shadowing, so this does not run on a clean
# machine.
- name: Refresh the user icon caches the removed copies were listed in
  ansible.builtin.command: >
    gtk-update-icon-cache --force --ignore-theme-index
    {{ item | dirname | dirname | dirname }}
  become: false
  changed_when: true
  failed_when: false
  loop: "{{ theming_shadowing_menu_icons }}"
  when: not ansible_check_mode

- name: Create NikOS Plymouth theme directory
  ansible.builtin.file:
    path: /usr/share/plymouth/themes/nikos
    state: directory
    mode: "0755"

- name: Copy NikOS Plymouth theme descriptor
  ansible.builtin.copy:
    src: plymouth/nikos.plymouth
    dest: /usr/share/plymouth/themes/nikos/nikos.plymouth
    mode: "0644"
  notify: Theming_update_initramfs

- name: Copy NikOS Plymouth theme script
  ansible.builtin.copy:
    src: plymouth/nikos.script
    dest: /usr/share/plymouth/themes/nikos/nikos.script
    mode: "0644"
  notify: Theming_update_initramfs

# Plymouth runs before any icon theme, font config or toolkit exists, so the
# whole splash has to arrive as pre-rendered PNGs. They are generated from the
# NikOS artwork by scripts/render-plymouth-assets.py and committed, so nothing
# has to be rendered on the target machine.
- name: Copy the NikOS Plymouth boot chrome into the theme directory
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/assets/plymouth/"
    dest: /usr/share/plymouth/themes/nikos/
    mode: "0644"
  notify: Theming_update_initramfs

# Older installs put the colour logo here under a name the script no longer
# loads. Left in place it is dead weight inside every initramfs rebuild.
- name: Remove the superseded Plymouth logo
  ansible.builtin.file:
    path: /usr/share/plymouth/themes/nikos/nikos-logo.png
    state: absent
  notify: Theming_update_initramfs

# xubuntu-artwork depends on plymouth-theme-xubuntu-logo and
# plymouth-theme-xubuntu-text, so those cannot be purged without dragging out
# the Xubuntu desktop with them. Selecting the NikOS theme through the
# default.plymouth alternative below puts that link in manual mode, which
# outranks anything the Xubuntu theme postinst configures afterwards.

- name: Set NikOS as default Plymouth theme in plymouthd.conf
  community.general.ini_file:
    path: /etc/plymouth/plymouthd.conf
    section: Daemon
    option: Theme
    value: nikos
    mode: "0644"
  notify: Theming_update_initramfs

- name: Register and select NikOS as default Plymouth theme (priority 200)
  community.general.alternatives:
    name: default.plymouth
    path: /usr/share/plymouth/themes/nikos/nikos.plymouth
    link: /usr/share/plymouth/themes/default.plymouth
    priority: 200
    state: selected
  notify: Theming_update_initramfs
  when: not ansible_check_mode

- name: Locate Plymouth theme helper
  ansible.builtin.find:
    paths:
      - /usr/sbin
      - /usr/bin
    patterns: plymouth-set-default-theme
    file_type: file
  register: theming_plymouth_theme_helper
  when: not ansible_check_mode

- name: Set Plymouth theme helper path
  ansible.builtin.set_fact:
    theming_plymouth_theme_helper_path: "{{ theming_plymouth_theme_helper.files[0].path }}"
  when:
    - not ansible_check_mode
    - (theming_plymouth_theme_helper.matched | default(0)) | int > 0

# Ubuntu's plymouth package ships no plymouth-set-default-theme (Debian's does).
# The default.plymouth alternative and plymouthd.conf above are how Ubuntu
# selects the theme, so this is the normal path here, not a fallback.
- name: Say how the Plymouth theme was set
  ansible.builtin.debug:
    msg: "Plymouth theme set through the default.plymouth alternative and plymouthd.conf (Ubuntu has no plymouth-set-default-theme; this is expected)."
  when:
    - not ansible_check_mode
    - (theming_plymouth_theme_helper.matched | default(0)) | int == 0

- name: Check selected Plymouth theme
  ansible.builtin.command: "{{ theming_plymouth_theme_helper_path }}"
  register: theming_plymouth_current_theme
  changed_when: false
  failed_when: false
  when:
    - not ansible_check_mode
    - theming_plymouth_theme_helper_path is defined

- name: Select NikOS Plymouth theme with Plymouth tool
  ansible.builtin.command: "{{ theming_plymouth_theme_helper_path }} nikos"
  changed_when: true
  notify: Theming_update_initramfs
  when:
    - not ansible_check_mode
    - theming_plymouth_theme_helper_path is defined
    - (theming_plymouth_current_theme.stdout | default('') | trim) != 'nikos'

- name: Ensure LightDM config directory exists
  ansible.builtin.file:
    path: /etc/lightdm
    state: directory
    mode: "0755"

- name: Ensure system-wide Xfce xfconf directory exists
  ansible.builtin.file:
    path: /etc/xdg/xfce4/xfconf/xfce-perchannel-xml
    state: directory
    mode: "0755"

# System-wide defaults (applied for new user accounts only)
- name: Deploy system-wide Xfce appearance defaults
  ansible.builtin.copy:
    src: xsettings.xml
    dest: /etc/xdg/xfce4/xfconf/xfce-perchannel-xml/xsettings.xml
    mode: "0644"

- name: Deploy system-wide Xfce window manager theme defaults
  ansible.builtin.copy:
    src: xfwm4.xml
    dest: /etc/xdg/xfce4/xfconf/xfce-perchannel-xml/xfwm4.xml
    mode: "0644"

- name: Deploy system-wide Xfce wallpaper defaults
  ansible.builtin.copy:
    src: xfce4-desktop.xml
    dest: /etc/xdg/xfce4/xfconf/xfce-perchannel-xml/xfce4-desktop.xml
    mode: "0644"

# The Xubuntu session puts /etc/xdg/xdg-xubuntu ahead of /etc/xdg in
# XDG_CONFIG_DIRS, so xubuntu-default-settings' xfce4-desktop.xml shadows the
# NikOS copy written above. xfdesktop also seeds every newly detected monitor
# from the `image-path` values in that file, which is how connector-named
# backdrops (monitorHDMI-A-0, monitorDisplayPort-2, ...) end up on the Xubuntu
# wallpaper. Repoint those values instead of replacing the whole conffile.
- name: Check for Xubuntu system-wide desktop defaults
  ansible.builtin.stat:
    path: /etc/xdg/xdg-xubuntu/xfce4/xfconf/xfce-perchannel-xml/xfce4-desktop.xml
  register: theming_xubuntu_desktop_defaults

- name: Repoint Xubuntu backdrop defaults at the NikOS wallpaper
  ansible.builtin.replace:
    path: /etc/xdg/xdg-xubuntu/xfce4/xfconf/xfce-perchannel-xml/xfce4-desktop.xml
    regexp: '(property name="(?:image-path|last-image)" type="string" value=")[^"]*(")'
    replace: '\g<1>/usr/share/nikos/wallpaper.png\g<2>'
  when: theming_xubuntu_desktop_defaults.stat.exists

- name: Set Xubuntu backdrop image-style defaults to Scaled
  ansible.builtin.replace:
    path: /etc/xdg/xdg-xubuntu/xfce4/xfconf/xfce-perchannel-xml/xfce4-desktop.xml
    regexp: '(property name="image-style" type="int" value=")[^"]*(")'
    replace: '\g<1>4\g<2>'
  when: theming_xubuntu_desktop_defaults.stat.exists

- name: Deploy LightDM GTK greeter config
  ansible.builtin.copy:
    src: lightdm-gtk-greeter.conf
    dest: /etc/lightdm/lightdm-gtk-greeter.conf
    mode: "0644"

# ── Apply theme settings to current user ─────────────────────────────────────
# System-wide /etc/xdg/ defaults are only loaded for brand-new user accounts
# with no personal config. Existing users need direct writes to their own
# ~/.config/xfce4/xfconf/xfce-perchannel-xml/ store.

- name: Ensure user Xfce xfconf directory exists
  ansible.builtin.file:
    path: "{{ nikos_home }}/.config/xfce4/xfconf/xfce-perchannel-xml"
    state: directory
    mode: "0755"
  become: false

- name: Apply GTK theme and icon theme to user xfconf
  ansible.builtin.copy:
    src: xsettings.xml
    dest: "{{ nikos_home }}/.config/xfce4/xfconf/xfce-perchannel-xml/xsettings.xml"
    mode: "0600"
  become: false

- name: Apply window manager theme to user xfconf
  ansible.builtin.copy:
    src: xfwm4.xml
    dest: "{{ nikos_home }}/.config/xfce4/xfconf/xfce-perchannel-xml/xfwm4.xml"
    mode: "0600"
  become: false

- name: Apply NikOS wallpaper to all configured monitor backdrop paths
  # Replace every last-image value regardless of monitor name, so the wallpaper
  # is applied for all displays (eDP-1, HDMI, VirtualBox, etc.) without needing
  # to know the monitor identifier in advance.
  ansible.builtin.replace:
    path: "{{ nikos_home }}/.config/xfce4/xfconf/xfce-perchannel-xml/xfce4-desktop.xml"
    regexp: '(property name="last-image" type="string" value=")[^"]*(")'
    replace: '\g<1>/usr/share/nikos/wallpaper.png\g<2>'
  become: false
  failed_when: false  # file may not exist on first login; system-wide default covers that

- name: Set wallpaper image-style to Scaled for all configured monitors
  # image-style int values: 0=None 1=Centered 2=Tiled 3=Stretched 4=Scaled 5=Zoomed
  # Some monitors default to 0 (None), which hides the wallpaper entirely.
  # Scaled keeps the whole image on screen whatever the monitor aspect ratio is;
  # the solid backdrop colour set below fills what is left over.
  ansible.builtin.replace:
    path: "{{ nikos_home }}/.config/xfce4/xfconf/xfce-perchannel-xml/xfce4-desktop.xml"
    regexp: '(property name="image-style" type="int" value=")[^"]*(")'
    replace: '\g<1>4\g<2>'
  become: false
  failed_when: false

- name: Apply GTK and window manager themes live via xfconf-query
  # xfconf-query writes via D-Bus/xfconfd; changes take effect immediately in a
  # running session. If no session is active the command fails silently, and
  # the file-level changes above ensure the settings load on next login.
  ansible.builtin.shell: |
    set -o pipefail
    xfconf-query -c xsettings   -p /Net/ThemeName     -s "Nordic"        2>/dev/null || true
    xfconf-query -c xsettings   -p /Net/IconThemeName -s "Papirus-Dark"  2>/dev/null || true
    xfconf-query -c xfwm4       -p /general/theme     -s "Nordic"        2>/dev/null || true
  args:
    executable: /bin/bash
  become: false
  changed_when: false
  failed_when: false
  when: not ansible_check_mode

# ── First-login wallpaper pass ───────────────────────────────────────────────
# xfdesktop creates the per-connector backdrop properties only once a session
# is running, so neither the file edits nor the xfconf-query calls above can
# reach the monitors this machine actually has. A one-shot autostart entry
# closes that gap on the first login after installation.

- name: Install the NikOS wallpaper helper
  ansible.builtin.copy:
    src: nikos-apply-wallpaper.sh
    dest: /usr/local/bin/nikos-apply-wallpaper
    owner: root
    group: root
    mode: "0755"

- name: Ensure the XDG autostart directory exists
  ansible.builtin.file:
    path: /etc/xdg/autostart
    state: directory
    mode: "0755"

- name: Register the NikOS wallpaper helper as an autostart entry
  ansible.builtin.copy:
    src: nikos-apply-wallpaper.desktop
    dest: /etc/xdg/autostart/nikos-apply-wallpaper.desktop
    owner: root
    group: root
    mode: "0644"

- name: Clear the wallpaper marker so the helper runs after this install
  ansible.builtin.file:
    path: "{{ nikos_home }}/.local/state/nikos/wallpaper-applied"
    state: absent
  become: false

- name: Apply the wallpaper now when an Xfce session is already running
  # No-op when the installer runs outside a session: the helper exits without
  # writing its marker, so the autostart entry retries at the next login.
  ansible.builtin.command: /usr/local/bin/nikos-apply-wallpaper
  become: false
  changed_when: false
  failed_when: false
  when: not ansible_check_mode

# The backdrop path does not change between releases, so re-setting it to the
# same value emits no xfconf signal and xfdesktop keeps serving the image it
# cached at session start. Reload it explicitly, so a re-rendered wallpaper
# appears without logging out.
- name: Reload xfdesktop so a re-rendered wallpaper is picked up
  ansible.builtin.command: xfdesktop --reload
  become: false
  changed_when: false
  failed_when: false
  when: not ansible_check_mode

# ── Firefox ──────────────────────────────────────────────────────────────────
# A dark Firefox whose whole window is one colour (#2E3440, the desktop's).
# Static third-party themes go stale: each Firefox release adds UI surfaces they
# never coloured, which is what broke the uniform background after an update.
# NikOS instead selects Mozilla's built-in Dark theme and adds a userChrome.css
# that paints every chrome surface one colour. Written as managed blocks, so a
# user's own user.js / userChrome.css lines are kept. Applies to profiles that
# exist; a profile created later gets it on the next `nikos update`.
# Set nikos_firefox_dark: false in vars/local.yml to leave Firefox alone.
# find warns about every path that does not exist, and a machine has one of
# these at most two, so only the ones present are searched.
- name: Check where Firefox keeps profiles (snap, deb and XDG)
  ansible.builtin.stat:
    path: "{{ item }}"
  loop:
    - "{{ nikos_home }}/snap/firefox/common/.mozilla/firefox"
    - "{{ nikos_home }}/.mozilla/firefox"
    # Newer Firefox keeps profiles under the XDG config directory.
    - "{{ nikos_home }}/.config/mozilla/firefox"
  register: theming_firefox_roots
  become: false

- name: Find Firefox profiles
  ansible.builtin.find:
    paths: >-
      {{ theming_firefox_roots.results | selectattr('stat.isdir', 'defined')
         | selectattr('stat.isdir') | map(attribute='item') | list }}
    patterns: prefs.js
    recurse: true
    depth: 2
    file_type: file
  register: theming_firefox_prefs
  become: false
  when: theming_firefox_roots.results | selectattr('stat.isdir', 'defined') | selectattr('stat.isdir') | list | length > 0

- name: Select the built-in Dark theme and enable userChrome.css
  ansible.builtin.blockinfile:
    path: "{{ item.path | dirname }}/user.js"
    marker: "// {mark} NikOS dark Firefox"
    block: "{{ lookup('ansible.builtin.file', 'firefox/user.js') }}"
    # user.js is re-applied at every Firefox start, so switching NikOS off
    # has to remove the block, not just stop writing it.
    state: "{{ 'present' if nikos_firefox_dark | bool else 'absent' }}"
    create: "{{ nikos_firefox_dark | bool }}"
    mode: "0644"
  loop: "{{ theming_firefox_prefs.files | default([]) }}"
  loop_control:
    label: "{{ item.path | dirname }}"
  become: false

- name: Create the Firefox chrome directories
  ansible.builtin.file:
    path: "{{ item.path | dirname }}/chrome"
    state: directory
    mode: "0755"
  loop: "{{ theming_firefox_prefs.files | default([]) }}"
  loop_control:
    label: "{{ item.path | dirname }}"
  become: false
  when: nikos_firefox_dark | bool

- name: Paint the Firefox window and new tab page one colour
  ansible.builtin.blockinfile:
    path: "{{ item.0.path | dirname }}/chrome/{{ item.1 }}"
    marker: "/* {mark} NikOS dark Firefox */"
    block: "{{ lookup('ansible.builtin.file', 'firefox/' ~ item.1) }}"
    state: "{{ 'present' if nikos_firefox_dark | bool else 'absent' }}"
    create: "{{ nikos_firefox_dark | bool }}"
    mode: "0644"
  loop: "{{ (theming_firefox_prefs.files | default([])) | product(['userChrome.css', 'userContent.css']) | list }}"
  loop_control:
    label: "{{ item.0.path | dirname }}/chrome/{{ item.1 }}"
  become: false

- name: Note that Firefox picks the theme up on its next start
  ansible.builtin.debug:
    msg: >-
      Dark Firefox set for {{ theming_firefox_prefs.files | default([]) | length }} profile(s);
      restart Firefox to see it.
      {{ 'No Firefox profile yet: start Firefox once, then run nikos update.'
         if (theming_firefox_prefs.files | default([]) | length) == 0 else '' }}
  when: nikos_firefox_dark | bool

# ── Chromium / Google Chrome ─────────────────────────────────────────────────
# Same idea for Chromium (snap and deb) and Google Chrome: dark, seeded with the
# desktop colour, in Classic mode (the snap cannot read the host GTK theme, so
# GTK mode falls back to light Adwaita). See files/nikos-chromium-theme.py. A
# running browser is skipped and reported; `nikos-chromium-theme` applies it
# later. Set nikos_chromium_dark: false in vars/local.yml to leave them alone.
- name: Install the Chromium theme helper
  ansible.builtin.copy:
    src: nikos-chromium-theme.py
    dest: /usr/local/bin/nikos-chromium-theme
    owner: root
    group: root
    mode: "0755"

- name: Make Chromium and Google Chrome dark in the desktop colour
  ansible.builtin.command:
    argv: [/usr/local/bin/nikos-chromium-theme, "{{ nikos_home }}"]
  register: theming_chromium_theme
  changed_when: "': changed' in theming_chromium_theme.stdout"
  become: false
  when:
    - nikos_chromium_dark | bool
    - not ansible_check_mode

- name: Report Chromium profiles that were skipped
  ansible.builtin.debug:
    msg: "{{ theming_chromium_theme.stdout_lines | select('regex', 'skipped') | list }}"
  when:
    - nikos_chromium_dark | bool
    - not ansible_check_mode
    - "'skipped' in (theming_chromium_theme.stdout | default(''))"
