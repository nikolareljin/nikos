---
- name: Create NikOS asset directory
  ansible.builtin.file:
    path: /usr/share/nikos
    state: directory
    mode: "0755"

- name: Copy wallpaper SVG
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/assets/wallpaper.svg"
    dest: /usr/share/nikos/wallpaper.svg
    mode: "0644"

- name: Export wallpaper SVG to PNG
  ansible.builtin.command: >
    inkscape /usr/share/nikos/wallpaper.svg
    --export-filename=/usr/share/nikos/wallpaper.png
    --export-width=1920 --export-height=1080
  args:
    creates: /usr/share/nikos/wallpaper.png
  when: not ansible_check_mode

# Portrait cut of the same artwork, for monitors rotated into vertical
# orientation. Scaling the landscape image onto a 9:16 screen leaves most of
# the screen empty; this keeps the marks readable at the same size.
- name: Copy portrait wallpaper SVG
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/assets/wallpaper-vertical.svg"
    dest: /usr/share/nikos/wallpaper-vertical.svg
    mode: "0644"

- name: Export portrait wallpaper SVG to PNG
  ansible.builtin.command: >
    inkscape /usr/share/nikos/wallpaper-vertical.svg
    --export-filename=/usr/share/nikos/wallpaper-vertical.png
    --export-width=1080 --export-height=1920
  args:
    creates: /usr/share/nikos/wallpaper-vertical.png
  when: not ansible_check_mode

- name: Install Papirus icon theme
  ansible.builtin.apt:
    name: papirus-icon-theme
    state: present

- name: Download Nordic GTK theme
  ansible.builtin.get_url:
    url: "{{ nordic_gtk_url }}"
    dest: /tmp/Nordic.tar.xz
    mode: "0644"
  when: not ansible_check_mode

- name: Create themes directory
  ansible.builtin.file:
    path: /usr/share/themes
    state: directory
    mode: "0755"

- name: Extract Nordic GTK theme
  ansible.builtin.unarchive:
    src: /tmp/Nordic.tar.xz
    dest: /usr/share/themes/
    remote_src: true
    creates: /usr/share/themes/Nordic
  when: not ansible_check_mode

- name: Clone Nordic repo (for GRUB theme)
  ansible.builtin.git:
    repo: https://github.com/EliverLara/Nordic.git
    dest: /tmp/Nordic-git
    depth: 1
    version: master
  when: not ansible_check_mode

- name: Create GRUB themes directory
  ansible.builtin.file:
    path: /boot/grub/themes
    state: directory
    mode: "0755"

- name: Locate Nordic GRUB theme
  ansible.builtin.find:
    paths: /tmp/Nordic-git
    patterns: theme.txt
    recurse: true
    file_type: file
  register: theming_nordic_grub_theme_files
  when: not ansible_check_mode

- name: Set Nordic GRUB theme directory
  ansible.builtin.set_fact:
    theming_nordic_grub_theme_dir: "{{ (theming_nordic_grub_theme_files.files | map(attribute='path') | first) | dirname }}"
  when:
    - not ansible_check_mode
    - (theming_nordic_grub_theme_files.matched | default(0)) | int > 0

- name: Install Nordic GRUB theme
  ansible.builtin.copy:
    src: "{{ theming_nordic_grub_theme_dir }}/"
    dest: /boot/grub/themes/Nordic/
    remote_src: true
    mode: "0644"
    directory_mode: "0755"
  when:
    - not ansible_check_mode
    - theming_nordic_grub_theme_dir is defined

- name: Configure GRUB to use Nordic theme
  ansible.builtin.lineinfile:
    path: /etc/default/grub
    regexp: "^#?GRUB_THEME="
    line: 'GRUB_THEME="/boot/grub/themes/Nordic/theme.txt"'
  when:
    - ansible_check_mode or theming_nordic_grub_theme_dir is defined
  notify: Theming_update_grub

- name: Ensure Plymouth splash is enabled in empty GRUB defaults
  ansible.builtin.replace:
    path: /etc/default/grub
    regexp: '^GRUB_CMDLINE_LINUX_DEFAULT=""$'
    replace: 'GRUB_CMDLINE_LINUX_DEFAULT="splash"'
  notify: Theming_update_grub

- name: Replace disabled Plymouth token in GRUB defaults
  ansible.builtin.replace:
    path: /etc/default/grub
    regexp: '^(GRUB_CMDLINE_LINUX_DEFAULT="[^"]*)\bnosplash\b([^"]*")$'
    replace: '\1splash\2'
  notify: Theming_update_grub

- name: Ensure Plymouth splash is enabled in GRUB defaults
  ansible.builtin.replace:
    path: /etc/default/grub
    regexp: '^(GRUB_CMDLINE_LINUX_DEFAULT=")(?![^"]*\bsplash\b)([^"]*\S)(")$'
    replace: '\1\2 splash\3'
  notify: Theming_update_grub

- name: Warn when Nordic GRUB theme is unavailable
  ansible.builtin.debug:
    msg: "Nordic GRUB theme was not found in the cloned repo; skipping GRUB theme installation."
  when:
    - not ansible_check_mode
    - theming_nordic_grub_theme_dir is not defined

- name: Install Plymouth and themes package
  ansible.builtin.apt:
    name:
      - plymouth
      - plymouth-label
      - plymouth-themes
    state: present

- name: Enable Plymouth framebuffer scripts in initramfs
  ansible.builtin.copy:
    dest: /etc/initramfs-tools/conf.d/nikos-plymouth
    content: |
      FRAMEBUFFER=y
    mode: "0644"
  notify: Theming_update_initramfs

- name: Copy NikOS logo PNG to system asset directory
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/assets/logo.png"
    dest: /usr/share/nikos/logo.png
    mode: "0644"

- name: Copy NikOS logo SVG to system asset directory
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/assets/logo.svg"
    dest: /usr/share/nikos/logo.svg
    mode: "0644"

- name: Create NikOS Plymouth theme directory
  ansible.builtin.file:
    path: /usr/share/plymouth/themes/nikos
    state: directory
    mode: "0755"

- name: Copy NikOS Plymouth theme descriptor
  ansible.builtin.copy:
    src: plymouth/nikos.plymouth
    dest: /usr/share/plymouth/themes/nikos/nikos.plymouth
    mode: "0644"
  notify: Theming_update_initramfs

- name: Copy NikOS Plymouth theme script
  ansible.builtin.copy:
    src: plymouth/nikos.script
    dest: /usr/share/plymouth/themes/nikos/nikos.script
    mode: "0644"
  notify: Theming_update_initramfs

- name: Copy NikOS Plymouth logo into Plymouth theme directory
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/assets/plymouth-logo.png"
    dest: /usr/share/plymouth/themes/nikos/nikos-logo.png
    mode: "0644"
  notify: Theming_update_initramfs

# xubuntu-artwork depends on plymouth-theme-xubuntu-logo and
# plymouth-theme-xubuntu-text, so those cannot be purged without dragging out
# the Xubuntu desktop with them. Selecting the NikOS theme through the
# default.plymouth alternative below puts that link in manual mode, which
# outranks anything the Xubuntu theme postinst configures afterwards.

- name: Set NikOS as default Plymouth theme in plymouthd.conf
  community.general.ini_file:
    path: /etc/plymouth/plymouthd.conf
    section: Daemon
    option: Theme
    value: nikos
    mode: "0644"
  notify: Theming_update_initramfs

- name: Register and select NikOS as default Plymouth theme (priority 200)
  community.general.alternatives:
    name: default.plymouth
    path: /usr/share/plymouth/themes/nikos/nikos.plymouth
    link: /usr/share/plymouth/themes/default.plymouth
    priority: 200
    state: selected
  notify: Theming_update_initramfs
  when: not ansible_check_mode

- name: Locate Plymouth theme helper
  ansible.builtin.find:
    paths:
      - /usr/sbin
      - /usr/bin
    patterns: plymouth-set-default-theme
    file_type: file
  register: theming_plymouth_theme_helper
  when: not ansible_check_mode

- name: Set Plymouth theme helper path
  ansible.builtin.set_fact:
    theming_plymouth_theme_helper_path: "{{ theming_plymouth_theme_helper.files[0].path }}"
  when:
    - not ansible_check_mode
    - (theming_plymouth_theme_helper.matched | default(0)) | int > 0

- name: Warn when Plymouth theme helper is unavailable
  ansible.builtin.debug:
    msg: "plymouth-set-default-theme is unavailable; using plymouthd.conf and default.plymouth alternatives only."
  when:
    - not ansible_check_mode
    - (theming_plymouth_theme_helper.matched | default(0)) | int == 0

- name: Check selected Plymouth theme
  ansible.builtin.command: "{{ theming_plymouth_theme_helper_path }}"
  register: theming_plymouth_current_theme
  changed_when: false
  failed_when: false
  when:
    - not ansible_check_mode
    - theming_plymouth_theme_helper_path is defined

- name: Select NikOS Plymouth theme with Plymouth tool
  ansible.builtin.command: "{{ theming_plymouth_theme_helper_path }} nikos"
  changed_when: true
  notify: Theming_update_initramfs
  when:
    - not ansible_check_mode
    - theming_plymouth_theme_helper_path is defined
    - (theming_plymouth_current_theme.stdout | default('') | trim) != 'nikos'

- name: Ensure LightDM config directory exists
  ansible.builtin.file:
    path: /etc/lightdm
    state: directory
    mode: "0755"

- name: Ensure system-wide Xfce xfconf directory exists
  ansible.builtin.file:
    path: /etc/xdg/xfce4/xfconf/xfce-perchannel-xml
    state: directory
    mode: "0755"

# System-wide defaults (applied for new user accounts only)
- name: Deploy system-wide Xfce appearance defaults
  ansible.builtin.copy:
    src: xsettings.xml
    dest: /etc/xdg/xfce4/xfconf/xfce-perchannel-xml/xsettings.xml
    mode: "0644"

- name: Deploy system-wide Xfce window manager theme defaults
  ansible.builtin.copy:
    src: xfwm4.xml
    dest: /etc/xdg/xfce4/xfconf/xfce-perchannel-xml/xfwm4.xml
    mode: "0644"

- name: Deploy system-wide Xfce wallpaper defaults
  ansible.builtin.copy:
    src: xfce4-desktop.xml
    dest: /etc/xdg/xfce4/xfconf/xfce-perchannel-xml/xfce4-desktop.xml
    mode: "0644"

# The Xubuntu session puts /etc/xdg/xdg-xubuntu ahead of /etc/xdg in
# XDG_CONFIG_DIRS, so xubuntu-default-settings' xfce4-desktop.xml shadows the
# NikOS copy written above. xfdesktop also seeds every newly detected monitor
# from the `image-path` values in that file, which is how connector-named
# backdrops (monitorHDMI-A-0, monitorDisplayPort-2, ...) end up on the Xubuntu
# wallpaper. Repoint those values instead of replacing the whole conffile.
- name: Check for Xubuntu system-wide desktop defaults
  ansible.builtin.stat:
    path: /etc/xdg/xdg-xubuntu/xfce4/xfconf/xfce-perchannel-xml/xfce4-desktop.xml
  register: theming_xubuntu_desktop_defaults

- name: Repoint Xubuntu backdrop defaults at the NikOS wallpaper
  ansible.builtin.replace:
    path: /etc/xdg/xdg-xubuntu/xfce4/xfconf/xfce-perchannel-xml/xfce4-desktop.xml
    regexp: '(property name="(?:image-path|last-image)" type="string" value=")[^"]*(")'
    replace: '\g<1>/usr/share/nikos/wallpaper.png\g<2>'
  when: theming_xubuntu_desktop_defaults.stat.exists

- name: Set Xubuntu backdrop image-style defaults to Scaled
  ansible.builtin.replace:
    path: /etc/xdg/xdg-xubuntu/xfce4/xfconf/xfce-perchannel-xml/xfce4-desktop.xml
    regexp: '(property name="image-style" type="int" value=")[^"]*(")'
    replace: '\g<1>4\g<2>'
  when: theming_xubuntu_desktop_defaults.stat.exists

- name: Deploy LightDM GTK greeter config
  ansible.builtin.copy:
    src: lightdm-gtk-greeter.conf
    dest: /etc/lightdm/lightdm-gtk-greeter.conf
    mode: "0644"

# ── Apply theme settings to current user ─────────────────────────────────────
# System-wide /etc/xdg/ defaults are only loaded for brand-new user accounts
# with no personal config. Existing users need direct writes to their own
# ~/.config/xfce4/xfconf/xfce-perchannel-xml/ store.

- name: Ensure user Xfce xfconf directory exists
  ansible.builtin.file:
    path: "{{ nikos_home }}/.config/xfce4/xfconf/xfce-perchannel-xml"
    state: directory
    mode: "0755"
  become: false

- name: Apply GTK theme and icon theme to user xfconf
  ansible.builtin.copy:
    src: xsettings.xml
    dest: "{{ nikos_home }}/.config/xfce4/xfconf/xfce-perchannel-xml/xsettings.xml"
    mode: "0600"
  become: false

- name: Apply window manager theme to user xfconf
  ansible.builtin.copy:
    src: xfwm4.xml
    dest: "{{ nikos_home }}/.config/xfce4/xfconf/xfce-perchannel-xml/xfwm4.xml"
    mode: "0600"
  become: false

- name: Apply NikOS wallpaper to all configured monitor backdrop paths
  # Replace every last-image value regardless of monitor name, so the wallpaper
  # is applied for all displays (eDP-1, HDMI, VirtualBox, etc.) without needing
  # to know the monitor identifier in advance.
  ansible.builtin.replace:
    path: "{{ nikos_home }}/.config/xfce4/xfconf/xfce-perchannel-xml/xfce4-desktop.xml"
    regexp: '(property name="last-image" type="string" value=")[^"]*(")'
    replace: '\g<1>/usr/share/nikos/wallpaper.png\g<2>'
  become: false
  failed_when: false  # file may not exist on first login; system-wide default covers that

- name: Set wallpaper image-style to Scaled for all configured monitors
  # image-style int values: 0=None 1=Centered 2=Tiled 3=Stretched 4=Scaled 5=Zoomed
  # Some monitors default to 0 (None), which hides the wallpaper entirely.
  # Scaled keeps the whole image on screen whatever the monitor aspect ratio is;
  # the solid backdrop colour set below fills what is left over.
  ansible.builtin.replace:
    path: "{{ nikos_home }}/.config/xfce4/xfconf/xfce-perchannel-xml/xfce4-desktop.xml"
    regexp: '(property name="image-style" type="int" value=")[^"]*(")'
    replace: '\g<1>4\g<2>'
  become: false
  failed_when: false

- name: Apply GTK and window manager themes live via xfconf-query
  # xfconf-query writes via D-Bus/xfconfd; changes take effect immediately in a
  # running session. If no session is active the command fails silently - the
  # file-level changes above ensure settings load on next login.
  ansible.builtin.shell: |
    set -o pipefail
    xfconf-query -c xsettings   -p /Net/ThemeName     -s "Nordic"        2>/dev/null || true
    xfconf-query -c xsettings   -p /Net/IconThemeName -s "Papirus-Dark"  2>/dev/null || true
    xfconf-query -c xfwm4       -p /general/theme     -s "Nordic"        2>/dev/null || true
  args:
    executable: /bin/bash
  become: false
  changed_when: false
  failed_when: false
  when: not ansible_check_mode

# ── First-login wallpaper pass ───────────────────────────────────────────────
# xfdesktop creates the per-connector backdrop properties only once a session
# is running, so neither the file edits nor the xfconf-query calls above can
# reach the monitors this machine actually has. A one-shot autostart entry
# closes that gap on the first login after installation.

- name: Install the NikOS wallpaper helper
  ansible.builtin.copy:
    src: nikos-apply-wallpaper.sh
    dest: /usr/local/bin/nikos-apply-wallpaper
    owner: root
    group: root
    mode: "0755"

- name: Ensure the XDG autostart directory exists
  ansible.builtin.file:
    path: /etc/xdg/autostart
    state: directory
    mode: "0755"

- name: Register the NikOS wallpaper helper as an autostart entry
  ansible.builtin.copy:
    src: nikos-apply-wallpaper.desktop
    dest: /etc/xdg/autostart/nikos-apply-wallpaper.desktop
    owner: root
    group: root
    mode: "0644"

- name: Clear the wallpaper marker so the helper runs after this install
  ansible.builtin.file:
    path: "{{ nikos_home }}/.local/state/nikos/wallpaper-applied"
    state: absent
  become: false

- name: Apply the wallpaper now when an Xfce session is already running
  # No-op when the installer runs outside a session: the helper exits without
  # writing its marker, so the autostart entry retries at the next login.
  ansible.builtin.command: /usr/local/bin/nikos-apply-wallpaper
  become: false
  changed_when: false
  failed_when: false
  when: not ansible_check_mode
