---
- name: Add GitHub CLI apt key
  ansible.builtin.get_url:
    url: https://cli.github.com/packages/githubcli-archive-keyring.gpg
    dest: /usr/share/keyrings/githubcli-archive-keyring.gpg
    mode: "0644"
  become: true

- name: Add GitHub CLI apt repository
  ansible.builtin.apt_repository:
    repo: >-
      deb [arch=amd64 signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg]
      https://cli.github.com/packages stable main
    filename: github-cli
  become: true

- name: Install gh CLI
  ansible.builtin.apt:
    name: gh
    state: present
    update_cache: true
    cache_valid_time: 3600
  become: true
  when: not ansible_check_mode

- name: Copy GitHub setup wizard
  ansible.builtin.copy:
    src: nikos-github-wizard.py
    dest: /usr/local/bin/nikos-github-wizard
    mode: "0755"
  become: true

- name: Copy NikOS welcome helper
  ansible.builtin.copy:
    src: nikos-welcome
    dest: /usr/local/bin/nikos-welcome
    mode: "0755"
  become: true

- name: Register first-terminal welcome hook in .bashrc
  ansible.builtin.blockinfile:
    path: "{{ nikos_home }}/.bashrc"
    marker: "# {mark} NikOS welcome"
    block: |
      if [[ -x /usr/local/bin/nikos-welcome ]]; then
        /usr/local/bin/nikos-welcome
      fi
    create: true
    mode: "0644"

- name: Link nikos-git-setup to the wizard
  ansible.builtin.file:
    src: /usr/local/bin/nikos-github-wizard
    dest: /usr/local/bin/nikos-git-setup
    state: link
  become: true

# Before 0.8 the hook was a multi-line lineinfile entry. Remove that text so an
# upgrade does not leave it next to the managed block below.
- name: Remove pre-0.8 wizard hook from .bashrc
  ansible.builtin.replace:
    path: "{{ nikos_home }}/.bashrc"
    regexp: '# NikOS first-run wizard \(runs once on first login\)\nif .*github-configured.*\n +/usr/local/bin/nikos-github-wizard\nfi\n'
    replace: ""
  failed_when: false

- name: Register first-terminal Git setup hook in .bashrc
  ansible.builtin.blockinfile:
    path: "{{ nikos_home }}/.bashrc"
    marker: "# {mark} NikOS git setup"
    block: |
      if [[ $- == *i* && ! -f "${HOME}/.config/nikos/github-configured" ]]; then
        /usr/local/bin/nikos-github-wizard
      fi
    state: "{{ 'present' if nikos_git_setup == 'ask' else 'absent' }}"
    create: true
    mode: "0644"
