---
# Downloaded to /tmp, checked against github_cli_key_fingerprints in
# vars/versions.yml, and only then installed where apt trusts it.
- name: Download the GitHub CLI apt key
  ansible.builtin.get_url:
    url: https://cli.github.com/packages/githubcli-archive-keyring.gpg
    dest: /tmp/githubcli-archive-keyring.gpg
    mode: "0644"
    force: true
  check_mode: false

- name: Verify the GitHub CLI apt key fingerprint
  ansible.builtin.command:
    argv: "{{ [playbook_dir ~ '/scripts/verify-key-fingerprint.sh', '/tmp/githubcli-archive-keyring.gpg'] + github_cli_key_fingerprints }}"
  changed_when: false
  check_mode: false

- name: Install the GitHub CLI apt key
  ansible.builtin.copy:
    src: /tmp/githubcli-archive-keyring.gpg
    remote_src: true
    dest: /usr/share/keyrings/githubcli-archive-keyring.gpg
    mode: "0644"
  become: true

- name: Add GitHub CLI apt repository
  ansible.builtin.apt_repository:
    repo: >-
      deb [arch=amd64 signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg]
      https://cli.github.com/packages stable main
    filename: github-cli
  become: true

- name: Install gh CLI
  ansible.builtin.apt:
    name: gh
    state: present
    update_cache: true
    cache_valid_time: 3600
  become: true
  when: not ansible_check_mode

- name: Copy GitHub setup wizard
  ansible.builtin.copy:
    src: nikos-github-wizard.py
    dest: /usr/local/bin/nikos-github-wizard
    mode: "0755"
  become: true

- name: Copy NikOS welcome helper
  ansible.builtin.copy:
    src: nikos-welcome
    dest: /usr/local/bin/nikos-welcome
    mode: "0755"
  become: true

- name: Register first-terminal welcome hook in .bashrc
  ansible.builtin.blockinfile:
    path: "{{ nikos_home }}/.bashrc"
    marker: "# {mark} NikOS welcome"
    block: |
      if [[ -x /usr/local/bin/nikos-welcome ]]; then
        /usr/local/bin/nikos-welcome
      fi
    create: true
    mode: "0644"

# force: in check mode the copy above has not run, so the target does not exist yet.
- name: Link nikos-git-setup to the wizard
  ansible.builtin.file:
    src: /usr/local/bin/nikos-github-wizard
    dest: /usr/local/bin/nikos-git-setup
    state: link
    force: true
  become: true

# Earlier releases added the hook as a multi-line lineinfile entry, which never matched
# itself, so every run appended another copy (25 on one machine). Remove all of them.
- name: Remove the old lineinfile wizard hook from .bashrc
  ansible.builtin.replace:
    path: "{{ nikos_home }}/.bashrc"
    regexp: '# NikOS first-run wizard \(runs once on first login\)\nif .*github-configured.*\n +/usr/local/bin/nikos-github-wizard\nfi\n\n?'
    replace: ""
  failed_when: false

- name: Register first-terminal Git setup hook in .bashrc
  ansible.builtin.blockinfile:
    path: "{{ nikos_home }}/.bashrc"
    marker: "# {mark} NikOS git setup"
    block: |
      if [[ $- == *i* && ! -f "${HOME}/.config/nikos/github-configured" ]]; then
        /usr/local/bin/nikos-github-wizard
      fi
    state: "{{ 'present' if nikos_git_setup == 'ask' else 'absent' }}"
    create: true
    mode: "0644"
