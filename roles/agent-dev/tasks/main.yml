---
- name: Create the private download directory
  ansible.builtin.file:
    path: "{{ nikos_user_download_dir }}"
    state: directory
    mode: "0700"
  become: false
  check_mode: false
  # The downloads below are tagged one by one, not at the role level; this
  # carries the same tags so a run limited to one of them still creates it.
  tags: [ai-claude]

- name: Install agent frameworks in nikos-ai env
  ansible.builtin.include_role:
    name: pin-gate
    tasks_from: pip
    apply:
      tags: [ai-local]
  vars:
    pin_gate_pip: "{{ nikos_home }}/miniforge3/envs/{{ nikos_conda_env }}/bin/pip"
    pin_gate_names:
      [langchain, langchain-community, langchain-openai, llama-index, llama-index-llms-ollama,
       openai, anthropic, instructor, fastapi, uvicorn, httpx]
  tags: [ai-local]

- name: Install ML and data libraries in nikos-ai env
  ansible.builtin.include_role:
    name: pin-gate
    tasks_from: pip
    apply:
      tags: [ai-local]
  vars:
    pin_gate_pip: "{{ nikos_home }}/miniforge3/envs/{{ nikos_conda_env }}/bin/pip"
    pin_gate_names: [sentence-transformers, chromadb, qdrant-client, datasets, evaluate, accelerate, litecli]
  tags: [ai-local]

# ── Image analysis ──────────────────────────────────────────────────────────
# OpenCV's wheels are dynamically linked; without these the import fails at
# runtime with "libGL.so.1: cannot open shared object file" on a minimal host.
- name: Install image analysis system libraries
  become: true
  ansible.builtin.apt:
    name: "{{ nikos_vision_apt_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600
  when: not ansible_check_mode
  tags: [ai-vision]

- name: Install Tesseract OCR engine
  become: true
  ansible.builtin.apt:
    name:
      - tesseract-ocr
      - tesseract-ocr-osd
    state: present
    update_cache: true
    cache_valid_time: 3600
  when: not ansible_check_mode
  tags: [ai-vision]

- name: Install Tesseract language data
  become: true
  ansible.builtin.apt:
    name: >-
      {{ ['tesseract-ocr-all'] if nikos_tesseract_languages == ['all']
         else nikos_tesseract_languages | map('regex_replace', '^', 'tesseract-ocr-') | list }}
    state: present
    update_cache: true
    cache_valid_time: 3600
  when: not ansible_check_mode
  tags: [ai-vision]

- name: Install Python image analysis libraries in nikos-ai env
  ansible.builtin.include_role:
    name: pin-gate
    tasks_from: pip
    apply:
      tags: [ai-local, ai-vision]
  vars:
    pin_gate_pip: "{{ nikos_home }}/miniforge3/envs/{{ nikos_conda_env }}/bin/pip"
    pin_gate_names: "{{ nikos_vision_pip_packages }}"
  tags: [ai-local, ai-vision]

# Claude Code ships a standalone binary, so it needs no Node at all - which is
# why it does not go through the npm path the other two CLIs use.
#
# The pinned native build is downloaded and checked against claude_code_sha256,
# the sha256 in that release's manifest.json (the manifest is signed by
# Anthropic's release key). claude.ai/install.sh did the same check, but the
# script itself was fetched and run unchecked. The verified binary's own
# `install` then sets up ~/.local/bin/claude exactly as the script did.
#
# Claude Code updates itself after install. NikOS installs only when the
# command is missing or older than the pin, so it never downgrades it.
#
# Deliberately not become: true. Everything goes under $HOME, and under sudo
# the binary lands in root's home and the `claude` command is then missing
# from the user's own shell.
- name: Read the installed Claude Code version
  ansible.builtin.command: "{{ nikos_home }}/.local/bin/claude --version"
  register: agent_dev_claude_installed
  changed_when: false
  failed_when: false
  check_mode: false
  tags: [ai-claude]

- name: Decide whether Claude Code needs installing
  ansible.builtin.include_role:
    name: pin-gate
    tasks_from: version
    apply:
      tags: [ai-claude]
  vars:
    pin_gate_name: Claude Code
    pin_gate_want: "{{ claude_code_version }}"
    pin_gate_path: "{{ nikos_home }}/.local/bin/claude"
    pin_gate_output: "{{ agent_dev_claude_installed.stdout | default('') }}"
  tags: [ai-claude]

- name: Install Claude Code {{ claude_code_version }}
  when:
    - not ansible_check_mode
    - pin_gate_install | bool
  tags: [ai-claude]
  block:
    - name: Download the Claude Code binary
      ansible.builtin.get_url:
        url: "https://downloads.claude.ai/claude-code-releases/{{ claude_code_version }}/linux-x64/claude"
        dest: "{{ nikos_user_download_dir }}/claude-{{ claude_code_version }}-linux-x64"
        checksum: "sha256:{{ claude_code_sha256 }}"
        mode: "0755"

    - name: Install Claude Code from the verified binary
      ansible.builtin.command:
        argv: ["{{ nikos_user_download_dir }}/claude-{{ claude_code_version }}-linux-x64", install, "{{ claude_code_version }}"]
      environment:
        HOME: "{{ nikos_home }}"
      changed_when: true

    - name: Remove the downloaded Claude Code binary
      ansible.builtin.file:
        path: "{{ nikos_user_download_dir }}/claude-{{ claude_code_version }}-linux-x64"
        state: absent
