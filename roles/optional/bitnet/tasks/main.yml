---
- name: Install BitNet.cpp build dependencies
  ansible.builtin.apt:
    name:
      - cmake
      - python3-dev
    state: present
    update_cache: true
    cache_valid_time: 3600
  become: true

- name: Clone BitNet.cpp
  ansible.builtin.git:
    repo: https://github.com/microsoft/BitNet.git
    dest: "{{ nikos_home }}/Projects/bitnet.cpp"
    version: main
    update: false
  when: not ansible_check_mode

# BitNet adds llama.cpp with add_subdirectory, which leaves LLAMA_STANDALONE
# off, and llama.cpp defaults LLAMA_BUILD_COMMON and LLAMA_BUILD_TOOLS to that
# value. Its CMakeLists then guards `add_subdirectory(tools)` on both, so the
# build produced only the shared libraries and no llama-cli, and the install
# step below failed with "Source .../build/bin/llama-cli not found". BitNet
# forces LLAMA_BUILD_SERVER on for the same reason but does not cover tools.
- name: Check whether the BitNet.cpp build is configured to build the CLI
  ansible.builtin.command: >
    grep -q '^LLAMA_BUILD_TOOLS:BOOL=ON'
    {{ nikos_home }}/Projects/bitnet.cpp/build/CMakeCache.txt
  register: bitnet_tools_configured
  changed_when: false
  failed_when: false
  when: not ansible_check_mode

# Re-configures an existing build tree as well as a fresh one. A `creates:`
# guard on CMakeCache.txt would leave any machine that already ran the old
# command with a cache that never builds the CLI, so the failure would survive
# every reinstall.
- name: Configure BitNet.cpp build
  ansible.builtin.command: >
    cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
    -DLLAMA_BUILD_COMMON=ON -DLLAMA_BUILD_TOOLS=ON
  args:
    chdir: "{{ nikos_home }}/Projects/bitnet.cpp"
  changed_when: true
  when:
    - not ansible_check_mode
    - bitnet_tools_configured.rc | default(1) != 0

- name: Build BitNet.cpp
  ansible.builtin.command: cmake --build build --config Release -j
  args:
    chdir: "{{ nikos_home }}/Projects/bitnet.cpp"
    creates: "{{ nikos_home }}/Projects/bitnet.cpp/build/bin/llama-cli"
  when: not ansible_check_mode

- name: Ensure the user bin directory exists
  ansible.builtin.file:
    path: "{{ nikos_home }}/.local/bin"
    state: directory
    mode: "0755"
  when: not ansible_check_mode

# A wrapper, not a copy of the binary. llama-cli links against the shared
# libraries in BitNet's build tree and carries a RUNPATH with that tree's
# absolute path baked in, so copying it out on its own produced something that
# only worked while the build directory stayed where it was built, under the
# home it was built with. Two parallel Projects trees on one machine is enough
# to break that. The wrapper resolves the path at run time and points the
# loader at the build output, which is the same shape as the distrodeck wrapper
# in the dev-tools role.
#
# No force: false here. The previous version installed the bare binary, so an
# existing bitnet-cli has to be replaced rather than kept.
- name: Install the BitNet.cpp CLI wrapper
  ansible.builtin.copy:
    dest: "{{ nikos_home }}/.local/bin/bitnet-cli"
    mode: "0755"
    content: |
      #!/usr/bin/env bash
      set -euo pipefail

      bitnet_bin="{{ nikos_home }}/Projects/bitnet.cpp/build/bin"

      if [[ ! -x "${bitnet_bin}/llama-cli" ]]; then
        echo "bitnet-cli: ${bitnet_bin}/llama-cli is missing." >&2
        echo "bitnet-cli: re-run the NikOS install with the bitnet bundle to rebuild it." >&2
        exit 127
      fi

      export LD_LIBRARY_PATH="${bitnet_bin}${LD_LIBRARY_PATH:+:${LD_LIBRARY_PATH}}"
      exec "${bitnet_bin}/llama-cli" "$@"
  when: not ansible_check_mode
