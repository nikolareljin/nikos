---
# Ubuntu's own netdata package (signed by the Ubuntu archive) replaces the
# get.netdata.cloud kickstart script, which was piped into a shell unchecked.
# The role only installs and starts the agent; it configures nothing that
# needs the upstream build or Netdata Cloud. The Ubuntu package listens on
# 127.0.0.1:19999.
#
# A machine set up by the kickstart script already has the agent: as the
# `netdata` package from Netdata's repository (apt sees it as installed and
# leaves it), or as a static build under /opt/netdata, which is left alone
# rather than starting a second agent on the same port.
- name: Report Netdata as unavailable on this release
  ansible.builtin.debug:
    msg: >-
      monitoring is not available on Ubuntu {{ ansible_facts['distribution_version'] }}:
      the Ubuntu archive has no netdata package for {{ ansible_facts['distribution_release'] }}.
  when: not nikos_release.netdata_package

- name: Check for a static Netdata build from the kickstart script
  ansible.builtin.stat:
    path: /opt/netdata/usr/sbin/netdata
  register: monitoring_static_netdata

- name: Install Netdata
  ansible.builtin.apt:
    name: "{{ nikos_release.netdata_package }}"
    state: present
  become: true
  when:
    - nikos_release.netdata_package | length > 0
    - not ansible_check_mode
    - not monitoring_static_netdata.stat.exists
