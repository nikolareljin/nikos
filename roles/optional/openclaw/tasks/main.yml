---
# `creates: /usr/bin/openclaw` used to short-circuit this task, so
# `openclaw@latest` was resolved exactly once - on the first install - and the
# package then stayed frozen at whatever version that was. state: latest lets
# `nikos update` actually move it forward.
#
# OpenClaw declares `node >=22.22.3 <23 || >=24.15.0 <25 || >=25.9.0`. The
# cloud-ai-cli role settles which Node the npm-only CLIs use - the system one
# when it is new enough, otherwise a pinned Node under the user's home through
# nvm - and records it in cloud_ai_cli_node_bin.
- name: Install or upgrade OpenClaw globally via npm
  community.general.npm:
    name: openclaw
    global: true
    state: latest
    executable: "{{ cloud_ai_cli_node_bin }}/npm"
  become: "{{ cloud_ai_cli_npm_needs_root }}"
  environment:
    PATH: "{{ cloud_ai_cli_node_bin }}:{{ ansible_env.PATH }}"
  when: not ansible_check_mode
