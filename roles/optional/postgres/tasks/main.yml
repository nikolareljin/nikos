---
# postgresql-contrib and pgvector are named per release in nikos_ubuntu_releases
# (vars/main.yml); an empty name means that release has no such package.
- name: Report pgvector as unavailable on this release
  ansible.builtin.debug:
    msg: >-
      pgvector is not available on Ubuntu {{ ansible_distribution_version }}:
      the Ubuntu archive has no pgvector package for {{ ansible_distribution_release }}.
      PostgreSQL is installed without it.
  when: not nikos_release.pgvector_package

- name: Install PostgreSQL and pgvector
  ansible.builtin.apt:
    name: >-
      {{ (['postgresql', nikos_release.postgres_contrib_package, nikos_release.pgvector_package])
         | select | list }}
    state: present
    update_cache: true
    cache_valid_time: 3600
  become: true

- name: Enable PostgreSQL service
  ansible.builtin.systemd:
    name: postgresql
    enabled: true
    state: started
  become: true
  when: not ansible_check_mode

- name: Install PostgreSQL Python client in nikos-ai env
  ansible.builtin.include_role:
    name: pin-gate
    tasks_from: pip
  vars:
    pin_gate_pip: "{{ nikos_home }}/miniforge3/envs/{{ nikos_conda_env }}/bin/pip"
    pin_gate_names: [psycopg2-binary]
  when: not ansible_check_mode
