---
- name: Install PostgreSQL and pgvector
  ansible.builtin.apt:
    name:
      - postgresql
      - postgresql-contrib
      - postgresql-16-pgvector
    state: present
    update_cache: true
    cache_valid_time: 3600
  become: true

- name: Enable PostgreSQL service
  ansible.builtin.systemd:
    name: postgresql
    enabled: true
    state: started
  become: true
  when: not ansible_check_mode

- name: Install PostgreSQL Python client in nikos-ai env
  ansible.builtin.include_role:
    name: pin-gate
    tasks_from: pip
  vars:
    pin_gate_pip: "{{ nikos_home }}/miniforge3/envs/{{ nikos_conda_env }}/bin/pip"
    pin_gate_names: [psycopg2-binary]
  when: not ansible_check_mode
