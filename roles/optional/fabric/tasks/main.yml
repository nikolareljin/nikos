---
# Fabric is installed at a pinned release (fabric_version), not @latest: an
# unpinned install shipped whatever the upstream branch held that day.
# `go install module@version` checks the module against the Go checksum
# database (sum.golang.org), so a tag moved or rewritten upstream fails to
# install instead of installing different code. Fabric's go.mod needs a newer Go
# than Ubuntu ships; GOTOOLCHAIN=auto fetches that toolchain, checked the same way.
- name: Read the installed Fabric version
  ansible.builtin.command: "{{ nikos_home }}/go/bin/fabric --version"
  register: fabric_installed
  changed_when: false
  failed_when: false
  check_mode: false

- name: Install Fabric AI pattern CLI {{ fabric_version }}
  ansible.builtin.command:
    argv:
      - go
      - install
      - "github.com/danielmiessler/fabric/cmd/fabric@{{ fabric_version }}"
  environment:
    HOME: "{{ nikos_home }}"
    GOPATH: "{{ nikos_home }}/go"
    GOTOOLCHAIN: auto
    GOSUMDB: sum.golang.org
    GONOSUMDB: ""
    GOPRIVATE: ""
    GOINSECURE: ""
  changed_when: true
  when:
    - not ansible_check_mode
    - (fabric_installed.stdout | default('') | trim) != fabric_version
