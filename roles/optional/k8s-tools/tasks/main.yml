---
- name: Ensure apt keyrings directory exists
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"
  become: true

- name: Download Kubernetes apt key
  ansible.builtin.get_url:
    url: "https://pkgs.k8s.io/core:/stable:/{{ kubernetes_apt_version }}/deb/Release.key"
    dest: /tmp/kubernetes-apt-release.key
    mode: "0644"
    force: true
  check_mode: false

# Checked against kubernetes_key_fingerprints in vars/versions.yml before apt
# trusts it. Dearmored to /tmp and copied rather than written behind a
# `creates:` guard, which kept whatever keyring an earlier run left there.
- name: Verify the Kubernetes apt key fingerprint
  ansible.builtin.command:
    argv: "{{ [playbook_dir ~ '/scripts/verify-key-fingerprint.sh', '/tmp/kubernetes-apt-release.key'] + kubernetes_key_fingerprints }}"
  changed_when: false
  check_mode: false

- name: Dearmor the Kubernetes apt key
  ansible.builtin.command:
    argv: [gpg, --batch, --yes, --dearmor, -o, /tmp/kubernetes-apt-keyring.gpg, /tmp/kubernetes-apt-release.key]
  changed_when: false
  check_mode: false

- name: Install the Kubernetes apt key
  ansible.builtin.copy:
    src: /tmp/kubernetes-apt-keyring.gpg
    remote_src: true
    dest: /etc/apt/keyrings/kubernetes-apt-keyring.gpg
    mode: "0644"
  become: true

- name: Add Kubernetes apt repository
  ansible.builtin.apt_repository:
    repo: >-
      deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.gpg]
      https://pkgs.k8s.io/core:/stable:/{{ kubernetes_apt_version }}/deb/ /
    filename: kubernetes
    state: present
  become: true
  when: not ansible_check_mode
- name: Install kubectl
  ansible.builtin.apt:
    name: kubectl
    state: present
    update_cache: true
  become: true
  when: not ansible_check_mode

# Pinned Helm 3 release (helm_version) checked against get.helm.sh's
# .sha256sum for it. Installed when missing or older than the pin; never
# downgraded. `helm version --short` prints "v3.22.0+g<commit>".
- name: Read the installed Helm version
  ansible.builtin.command: /usr/local/bin/helm version --short
  register: k8s_tools_helm_installed
  changed_when: false
  failed_when: false
  check_mode: false

- name: Decide whether Helm needs installing
  ansible.builtin.include_role:
    name: pin-gate
    tasks_from: version
  vars:
    pin_gate_name: Helm
    pin_gate_want: "{{ helm_version }}"
    pin_gate_path: /usr/local/bin/helm
    pin_gate_output: "{{ k8s_tools_helm_installed.stdout | default('') }}"

- name: Install Helm {{ helm_version }}
  when:
    - not ansible_check_mode
    - pin_gate_install | bool
  block:
    - name: Download the Helm release archive
      ansible.builtin.get_url:
        url: "https://get.helm.sh/helm-{{ helm_version }}-linux-amd64.tar.gz"
        dest: "/tmp/helm-{{ helm_version }}-linux-amd64.tar.gz"
        checksum: "sha256:{{ helm_sha256 }}"
        mode: "0644"

    - name: Unpack the Helm binary
      ansible.builtin.unarchive:
        src: "/tmp/helm-{{ helm_version }}-linux-amd64.tar.gz"
        dest: /usr/local/bin
        remote_src: true
        include: [linux-amd64/helm]
        extra_opts: [--strip-components=1]
        owner: root
        group: root
        mode: "0755"
      become: true
