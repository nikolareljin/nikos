---
# repo.mongodb.org publishes one repository per Ubuntu codename. Releases it
# has none for (mongodb_repo_codenames in vars/main.yml) skip the bundle
# rather than borrow another release's repository.
- name: Report MongoDB as unavailable on this release
  ansible.builtin.debug:
    msg: >-
      mongodb is not available on Ubuntu {{ ansible_facts['distribution_version'] }}:
      MongoDB publishes no repository for {{ ansible_facts['distribution_release'] }}.
  when: ansible_facts['distribution_release'] not in mongodb_repo_codenames

- name: Install MongoDB
  ansible.builtin.include_tasks: install.yml
  when: ansible_facts['distribution_release'] in mongodb_repo_codenames
