---
# Runs on both profiles (site.yml does not gate the role). The capture tools
# split by profile below: the Wireshark GUI and the OpenVPN NetworkManager
# plugins need a desktop. network-manager-openvpn depends on network-manager,
# which a server (netplan + networkd) must not get, so a server gets tshark and
# the plain openvpn client instead.

# Both wireshark and tshark pull in wireshark-common, whose postinst asks
# whether non-root users may capture. apt runs non-interactive here, so an
# unseeded question takes its default (false) and the wireshark group below
# does nothing. Seeded first, so a fresh install reads it; an install that
# already has the package re-reads it through the handler.
- name: Seed wireshark-common/install-setuid so the wireshark group may capture
  ansible.builtin.debconf:
    name: wireshark-common
    question: wireshark-common/install-setuid
    vtype: boolean
    value: "true"
  become: true
  notify: Reconfigure wireshark-common

- name: Install network tools
  ansible.builtin.apt:
    name:
      - nmap
      - traceroute
      - tcpdump
      - netcat-openbsd
    state: present
    update_cache: true
    cache_valid_time: 3600
  become: true

- name: Install the Wireshark GUI and the OpenVPN NetworkManager plugins
  ansible.builtin.apt:
    name:
      - wireshark
      - network-manager-openvpn
      - network-manager-openvpn-gnome
    state: present
  become: true
  when: nikos_profile == 'desktop'

- name: Install tshark and openvpn
  ansible.builtin.apt:
    name:
      - tshark
      - openvpn
    state: present
  become: true
  when: nikos_profile == 'server'

# wireshark-common's postinst creates the group, so a check run on a machine
# without it has no group to add to.
- name: Add user to wireshark group
  ansible.builtin.user:
    name: "{{ ansible_user_id }}"
    groups: wireshark
    append: true
  become: true
  when: not ansible_check_mode

# A server that ran an earlier version of this role still has the desktop
# packages. They are not removed here: removing network-manager over SSH can
# drop the connection. The run names them and the command instead.
- name: Read installed packages for the server leftover check
  ansible.builtin.package_facts:
    manager: apt
  when: nikos_profile == 'server'

- name: Warn about desktop network packages left on a server
  ansible.builtin.debug:
    msg:
      - "WARN: desktop network packages from an earlier run are still installed: {{ network_server_leftovers | join(' ') }}"
      - "Remove them by hand from a local console: sudo apt-get remove {{ network_server_leftovers | join(' ') }}"
      - "Removing network-manager over SSH can drop the connection; first check the server's netplan renderer is networkd."
  # network_installed_packages is a test seam: -e sets it to fake package facts.
  vars:
    network_server_leftovers: >-
      {{ ['wireshark', 'network-manager-openvpn-gnome', 'network-manager-openvpn', 'network-manager']
         | select('in', network_installed_packages | default(ansible_facts.packages | default({}))) | list }}
  when:
    - nikos_profile == 'server'
    - network_server_leftovers | length > 0
