---
- name: Install Redis server
  ansible.builtin.apt:
    name: redis-server
    state: present
    update_cache: true
    cache_valid_time: 3600
  become: true

- name: Enable Redis service
  ansible.builtin.systemd:
    name: redis-server
    enabled: true
    state: started
  become: true
  when: not ansible_check_mode

- name: Install Redis Python client in nikos-ai env
  ansible.builtin.include_role:
    name: pin-gate
    tasks_from: pip
  vars:
    pin_gate_pip: "{{ nikos_home }}/miniforge3/envs/{{ nikos_conda_env }}/bin/pip"
    pin_gate_names: [redis]
  when: not ansible_check_mode
