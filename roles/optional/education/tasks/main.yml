---
# Anki comes from the Ubuntu archive where it exists (22.04, 24.04). 26.04 has
# no anki package, so there it is the official ankitects/anki Linux tarball
# (anki_version in vars/versions.yml, sha256-checked), installed with the
# install.sh shipped inside it into /usr/local. Nothing changes on 22.04/24.04.
- name: Report Anki as unavailable on this release
  ansible.builtin.debug:
    msg: >-
      anki is not available on Ubuntu {{ ansible_facts['distribution_version'] }}:
      the Ubuntu archive has no anki package for {{ ansible_facts['distribution_release'] }}.
  when:
    - not nikos_release.anki_package
    - not (nikos_release.anki_release | default(false) | bool)

- name: Install education tools
  ansible.builtin.apt:
    name: "{{ ['libreoffice', nikos_release.anki_package] | select | list }}"
    state: present
    update_cache: true
    cache_valid_time: 3600
  become: true

- name: Install Anki from its release tarball
  ansible.builtin.include_tasks: anki_release.yml
  when:
    - not nikos_release.anki_package
    - nikos_release.anki_release | default(false) | bool

- name: Install draw.io desktop via Flatpak
  ansible.builtin.command: flatpak install -y flathub com.jgraph.drawio.desktop
  changed_when: false
