---
- name: Create the private download directory
  ansible.builtin.file:
    path: "{{ nikos_user_download_dir }}"
    state: directory
    mode: "0700"
  become: false
  check_mode: false

- name: Install zsh
  ansible.builtin.apt:
    name: zsh
    state: present
    update_cache: true
    cache_valid_time: 3600
  become: true

- name: Ensure local bin directory exists
  ansible.builtin.file:
    path: "{{ nikos_home }}/.local/bin"
    state: directory
    mode: "0755"

# Pinned release (starship_version) checked against the release's .sha256
# file. Installed when missing or older than the pin; never downgraded.
# Prints "starship 1.26.0" first.
- name: Read the installed Starship version
  ansible.builtin.command: "{{ nikos_home }}/.local/bin/starship --version"
  register: zsh_starship_installed
  changed_when: false
  failed_when: false
  check_mode: false

- name: Decide whether Starship needs installing
  ansible.builtin.include_role:
    name: pin-gate
    tasks_from: version
  vars:
    pin_gate_name: Starship
    pin_gate_want: "{{ starship_version }}"
    pin_gate_path: "{{ nikos_home }}/.local/bin/starship"
    pin_gate_output: "{{ zsh_starship_installed.stdout | default('') }}"

- name: Install Starship {{ starship_version }}
  when:
    - not ansible_check_mode
    - pin_gate_install | bool
  block:
    - name: Download the Starship release archive
      ansible.builtin.get_url:
        url: "https://github.com/starship/starship/releases/download/{{ starship_version }}/starship-x86_64-unknown-linux-gnu.tar.gz"
        dest: "{{ nikos_user_download_dir }}/starship-{{ starship_version }}-x86_64-unknown-linux-gnu.tar.gz"
        checksum: "sha256:{{ starship_sha256 }}"
        mode: "0644"

    - name: Unpack Starship
      ansible.builtin.unarchive:
        src: "{{ nikos_user_download_dir }}/starship-{{ starship_version }}-x86_64-unknown-linux-gnu.tar.gz"
        dest: "{{ nikos_home }}/.local/bin"
        remote_src: true
        include: [starship]
        mode: "0755"

- name: Deploy default zsh config
  ansible.builtin.copy:
    src: zshrc
    dest: "{{ nikos_home }}/.zshrc"
    mode: "0644"
    force: false
