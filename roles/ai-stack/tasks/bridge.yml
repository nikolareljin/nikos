---
# Containers reach the local Ollama through a forwarder on the Docker bridge
# address; Ollama itself stays on loopback (nikos_ollama_host). A systemd
# socket listens there and systemd-socket-proxyd passes each connection to
# loopback. Only loopback and Docker's bridge subnets may connect.
#
# Run in every mode, from ai-stack and again after every role (site.yml
# post_tasks): where the forwarder must not run, an installed one is removed.
# Every check fails closed: a check that cannot run refuses the forwarder.

- name: Find the Docker bridge address for the Ollama forwarder
  ansible.builtin.shell: |
    set -o pipefail
    command -v docker >/dev/null 2>&1 || exit 0
    # Rootless Docker keeps its bridge in another network namespace; a
    # forwarder on the host does not reach it.
    if docker info -f '{% raw %}{{.SecurityOptions}}{% endraw %}' 2>/dev/null | grep -q rootless; then exit 0; fi
    # Docker Desktop runs its engine in a VM: its bridge is not on this host.
    if docker info -f '{% raw %}{{.OperatingSystem}}{% endraw %}' 2>/dev/null | grep -qi 'docker desktop'; then exit 0; fi
    # The IPv4 gateway: with IPv6 enabled the IPv6 one can come first.
    docker network inspect bridge -f '{% raw %}{{range .IPAM.Config}}{{.Gateway}} {{end}}{% endraw %}' 2>/dev/null \
      | tr ' ' '\n' | grep -E '^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$' | head -1 || true
  args:
    executable: /bin/bash
  # As root: the user running the play may not be in the docker group yet (it is
  # added during this same install), and an unanswered docker call is no bridge.
  become: true
  register: ai_stack_bridge_probe
  changed_when: false
  failed_when: false
  when:
    - nikos_ollama_mode == 'local'
    - (nikos_ollama_bridge | default('auto')) == 'auto'

- name: Choose the Ollama forwarder address
  ansible.builtin.set_fact:
    ai_stack_bridge_addr: >-
      {{ '' if nikos_ollama_mode != 'local' or (nikos_ollama_bridge | default('auto')) == 'off'
         else ((ai_stack_bridge_probe.stdout | default('') | trim)
               if (nikos_ollama_bridge | default('auto')) == 'auto'
               else (nikos_ollama_bridge | trim)) }}
    ai_stack_bridge_port: "{{ nikos_ollama_host.split(':')[-1] }}"

# Bridge only: an address outside Docker's range would put Ollama, which has
# no authentication, on a network other machines can reach.
- name: Refuse an Ollama forwarder address outside the Docker bridge range
  ansible.builtin.fail:
    msg: >-
      nikos_ollama_bridge resolved to '{{ ai_stack_bridge_addr }}', which is not a
      Docker bridge address (172.16.0.0/12). Set nikos_ollama_bridge to the bridge
      address, or to off.
  when:
    - ai_stack_bridge_addr | length > 0
    - ai_stack_bridge_addr is not regex('^172\.(1[6-9]|2[0-9]|3[01])\.[0-9]{1,3}\.[0-9]{1,3}$')

# The socket admits loopback and Docker's bridge subnets only, and the
# interface filter below accepts only lo and Docker's bridges by exact name. files/nikos-ollama-
# bridge-check refuses an interface that passes the filter and is not Docker's,
# and only warns about another network in the range (a VPN
# routes 172.16.99.9): the filter drops that traffic. It runs here and again
# before every start of the forwarder (ExecCondition), and fails closed.
- name: Find networks outside Docker that use 172.16.0.0/12
  ansible.builtin.command: "{{ role_path }}/files/nikos-ollama-bridge-check"
  # As root, for the same reason as the probe: Docker's network list needs it.
  # The filter loaded now is about to be rewritten by this play; judge by
  # the one it writes (Docker's names only), not by an older br-* one.
  environment:
    NIKOS_BRIDGE_CHECK_IGNORE_LOADED: "1"
  become: true
  register: ai_stack_bridge_overlap
  changed_when: false
  failed_when: ai_stack_bridge_overlap.rc not in [0, 1]
  when: ai_stack_bridge_addr | length > 0

- name: Report networks in 172.16.0.0/12 that the forwarder's filter drops
  ansible.builtin.debug:
    msg: "{{ ai_stack_bridge_overlap.stderr_lines | select('match', '^warning: ') | list }}"
  when:
    - ai_stack_bridge_addr | length > 0
    - "ai_stack_bridge_overlap.stderr_lines | default([]) | select('match', '^warning: ') | list | length > 0"

- name: Decide whether the Ollama forwarder may run
  ansible.builtin.set_fact:
    ai_stack_bridge_shared: "{{ (ai_stack_bridge_overlap.stdout | default('') | trim) | length > 0 }}"
    ai_stack_bridge_wanted: >-
      {{ ai_stack_bridge_addr | length > 0
         and (ai_stack_bridge_overlap.stdout | default('') | trim) | length == 0 }}

# Ubuntu does not ship /usr/local/libexec; copy fails on a missing directory.
- name: Create the directory for the forwarder's network check
  ansible.builtin.file:
    path: /usr/local/libexec
    state: directory
    mode: "0755"
  become: true
  when: ai_stack_bridge_wanted | bool

- name: Install the forwarder's network check and filter refresh
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "/usr/local/libexec/{{ item }}"
    mode: "0755"
  loop: [nikos-ollama-bridge-check, nikos-ollama-bridge-refresh]
  become: true
  register: ai_stack_bridge_check
  when: ai_stack_bridge_wanted | bool

# The address filter on the socket decides by source address, which says
# nothing about where a packet came in. This filter decides by interface: the
# bridge address answers on the Ollama port only to loopback and to Docker's
# bridges, by exact name, from Docker's subnets. Both sets start empty (nothing
# is let in); nikos-ollama-bridge-refresh fills them when the filter loads and on every Docker network change, so a
# libvirt or LXC bridge named br-* is not let in. It is its own table, so it
# never touches Docker's rules, and the socket requires it: no filter, no
# forwarder.
- name: Install nftables for the Ollama forwarder's filter
  ansible.builtin.apt:
    name: nftables
    state: present
  become: true
  when: ai_stack_bridge_wanted | bool

- name: Create the NikOS configuration directory
  ansible.builtin.file:
    path: /etc/nikos
    state: directory
    mode: "0755"
  become: true
  when: ai_stack_bridge_wanted | bool

- name: Write the Ollama forwarder's interface filter
  ansible.builtin.copy:
    dest: /etc/nikos/ollama-bridge.nft
    mode: "0644"
    content: |
      # Managed by NikOS (roles/ai-stack). Loaded by nikos-ollama-bridge-filter.service.
      # The Ollama forwarder on {{ ai_stack_bridge_addr }}:{{ ai_stack_bridge_port }} answers
      # only to loopback and to Docker's subnets arriving on Docker's bridges.
      table inet nikos_ollama_bridge
      delete table inet nikos_ollama_bridge
      table inet nikos_ollama_bridge {
        set docker_ifs {
          type ifname
        }
        set docker_nets {
          type ipv4_addr
          flags interval
          auto-merge
        }
        chain input {
          type filter hook input priority filter - 5; policy accept;
          ip daddr {{ ai_stack_bridge_addr }} tcp dport {{ ai_stack_bridge_port }} jump from_docker_only
        }
        chain from_docker_only {
          iifname "lo" return
          iifname @docker_ifs ip saddr @docker_nets return
          drop
        }
      }
  become: true
  register: ai_stack_bridge_nft
  when: ai_stack_bridge_wanted | bool

- name: Write the Ollama forwarder's filter service
  ansible.builtin.copy:
    dest: /etc/systemd/system/nikos-ollama-bridge-filter.service
    mode: "0644"
    content: |
      # Managed by NikOS (roles/ai-stack). The socket requires it.
      [Unit]
      Description=NikOS: the Ollama forwarder answers only on Docker's bridges
      Before=nikos-ollama-bridge.socket
      # nftables.service flushes the whole ruleset when it (re)starts; load
      # after it, and again whenever it restarts.
      After=nftables.service
      PartOf=nftables.service

      [Service]
      Type=oneshot
      RemainAfterExit=yes
      ExecStart=/usr/sbin/nft -f /etc/nikos/ollama-bridge.nft
      # Docker may not be up yet at boot; the watcher refreshes once it is.
      ExecStartPost=-/usr/local/libexec/nikos-ollama-bridge-refresh
      ExecStop=/usr/sbin/nft delete table inet nikos_ollama_bridge

      [Install]
      WantedBy=sockets.target
  become: true
  register: ai_stack_bridge_filter_unit
  when: ai_stack_bridge_wanted | bool

# Docker creates br-<id> on `docker network create`; the set must follow, or
# a new compose network cannot reach Ollama until the next update.
- name: Write the watcher that refreshes the filter on Docker network changes
  ansible.builtin.copy:
    dest: /etc/systemd/system/nikos-ollama-bridge-watch.service
    mode: "0644"
    content: |
      # Managed by NikOS (roles/ai-stack).
      [Unit]
      Description=NikOS: keep the Ollama forwarder's filter on Docker's current bridges
      Requires=nikos-ollama-bridge-filter.service
      After=nikos-ollama-bridge-filter.service docker.service
      PartOf=nikos-ollama-bridge-filter.service

      [Service]
      # Refresh once (Docker may have changed while this was down), then on
      # every network create or destroy. Restarts with Docker.
      ExecStartPre=/usr/local/libexec/nikos-ollama-bridge-refresh
      ExecStart=/usr/local/libexec/nikos-ollama-bridge-refresh --watch
      Restart=always
      RestartSec=5

      [Install]
      WantedBy=multi-user.target
  become: true
  register: ai_stack_bridge_watch_unit
  when: ai_stack_bridge_wanted | bool

- name: Write the Ollama forwarder socket
  ansible.builtin.copy:
    dest: /etc/systemd/system/nikos-ollama-bridge.socket
    mode: "0644"
    content: |
      # Managed by NikOS (roles/ai-stack). Set nikos_ollama_bridge in vars/local.yml.
      [Unit]
      Description=NikOS: containers reach the local Ollama (Docker bridge only)
      # No interface filter, no forwarder.
      Requires=nikos-ollama-bridge-filter.service
      After=nikos-ollama-bridge-filter.service

      [Socket]
      ListenStream={{ ai_stack_bridge_addr }}:{{ ai_stack_bridge_port }}
      # The bridge address exists only once Docker is up; bind before that.
      FreeBind=yes
      IPAddressDeny=any
      # Loopback only here; nikos-ollama-bridge-refresh adds Docker's current
      # bridge subnets (e.g. 192.168.16.0/20 once 172.17-31 run out) in
      # nikos-ollama-bridge.socket.d/docker-subnets.conf. No drop-in, no
      # container gets in.
      IPAddressAllow=localhost

      [Install]
      WantedBy=sockets.target
  become: true
  register: ai_stack_bridge_socket
  when: ai_stack_bridge_wanted | bool

- name: Write the Ollama forwarder service
  ansible.builtin.copy:
    dest: /etc/systemd/system/nikos-ollama-bridge.service
    mode: "0644"
    content: |
      # Managed by NikOS (roles/ai-stack). Started by nikos-ollama-bridge.socket.
      [Unit]
      Description=NikOS: forward container connections to the local Ollama
      Requires=nikos-ollama-bridge.socket
      After=nikos-ollama-bridge.socket ollama.service

      [Service]
      # Checked before every start, as root (+): a LAN or VPN that joined
      # 172.16.0.0/12 since the play ran stops the forwarder. The proxy exits
      # when idle, so the next connection starts it, and the check, again.
      ExecCondition=+/usr/local/libexec/nikos-ollama-bridge-check
      # The interface filter must be loaded: nftables.service's stock config
      # starts with "flush ruleset", which would remove it under a running socket.
      ExecCondition=+/usr/sbin/nft list table inet nikos_ollama_bridge
      # To the engine's own address, as nikos_ollama_host sets it (127.0.0.1,
      # localhost or [::1]; site.yml allows only loopback).
      ExecStart=/usr/lib/systemd/systemd-socket-proxyd --exit-idle-time=60 {{ nikos_ollama_host }}
      DynamicUser=yes
      NoNewPrivileges=yes
      ProtectSystem=strict
      ProtectHome=yes
      PrivateTmp=yes
      PrivateDevices=yes
      RestrictAddressFamilies=AF_INET AF_INET6 AF_UNIX
  become: true
  register: ai_stack_bridge_service
  when: ai_stack_bridge_wanted | bool

- name: Enable and start the Ollama forwarder's filter
  ansible.builtin.systemd:
    name: nikos-ollama-bridge-filter.service
    enabled: true
    daemon_reload: true
    state: "{{ 'restarted' if (ai_stack_bridge_nft is changed or ai_stack_bridge_filter_unit is changed) else 'started' }}"
  become: true
  when:
    - ai_stack_bridge_wanted | bool
    - not ansible_check_mode

- name: Enable and start the filter's watcher
  ansible.builtin.systemd:
    name: nikos-ollama-bridge-watch.service
    enabled: true
    daemon_reload: true
    state: "{{ 'restarted' if (ai_stack_bridge_watch_unit is changed or ai_stack_bridge_check is changed) else 'started' }}"
  become: true
  when:
    - ai_stack_bridge_wanted | bool
    - not ansible_check_mode

- name: Enable and start the Ollama forwarder
  ansible.builtin.systemd:
    name: nikos-ollama-bridge.socket
    enabled: true
    daemon_reload: true
    state: >-
      {{ 'restarted' if (ai_stack_bridge_socket is changed or ai_stack_bridge_service is changed
                         or ai_stack_bridge_check is changed) else 'started' }}
  become: true
  when:
    - ai_stack_bridge_wanted | bool
    - not ansible_check_mode

# Off, remote mode, no Docker, or a shared range: an installed forwarder goes,
# before any refusal below, so a refusal never leaves one running.
- name: Look for an Ollama forwarder that must not run
  ansible.builtin.stat:
    path: "{{ item }}"
  loop:
    - /etc/systemd/system/nikos-ollama-bridge.socket
    - /etc/systemd/system/nikos-ollama-bridge-filter.service
    - /etc/nikos/ollama-bridge.nft
    - /usr/local/libexec/nikos-ollama-bridge-check
    - /usr/local/libexec/nikos-ollama-bridge-refresh
    - /etc/systemd/system/nikos-ollama-bridge-watch.service
    - /etc/systemd/system/nikos-ollama-bridge.socket.d
  register: ai_stack_bridge_found
  when: not (ai_stack_bridge_wanted | bool)

# Any piece left from an earlier run, even a partial one, means remove it all.
- name: Decide whether an Ollama forwarder is installed
  ansible.builtin.set_fact:
    ai_stack_bridge_installed:
      stat:
        exists: "{{ (ai_stack_bridge_found.results | default([]) | selectattr('stat', 'defined')
                    | map(attribute='stat.exists') | select | list | length) > 0 }}"

- name: Remove the Ollama forwarder that must not run
  when:
    - not (ai_stack_bridge_wanted | bool)
    - ai_stack_bridge_installed.stat.exists | default(false)
    - not ansible_check_mode
  become: true
  block:
    # A unit that is already gone is fine (a partial install is what this
    # cleans); one still running afterwards is not, and fails the play before
    # its files are deleted: deleting them would hide a listening socket.
    - name: Stop the Ollama forwarder's units
      ansible.builtin.shell: |
        set -uo pipefail
        units="nikos-ollama-bridge.socket nikos-ollama-bridge.service nikos-ollama-bridge-watch.service nikos-ollama-bridge-filter.service"
        for u in $units; do systemctl disable --now "$u" >/dev/null 2>&1 || true; done
        running=""
        for u in $units; do systemctl is-active --quiet "$u" && running="$running $u"; done
        if [ -n "$running" ]; then echo "still running:$running" >&2; exit 1; fi
      args:
        executable: /bin/bash
      changed_when: true
    - name: Delete the Ollama forwarder units
      ansible.builtin.file:
        path: "/etc/systemd/system/{{ item }}"
        state: absent
      loop: [nikos-ollama-bridge.socket, nikos-ollama-bridge.service, nikos-ollama-bridge-watch.service,
             nikos-ollama-bridge-filter.service, nikos-ollama-bridge.socket.d]
    - name: Delete the Ollama forwarder's interface filter
      ansible.builtin.file:
        path: /etc/nikos/ollama-bridge.nft
        state: absent
    - name: Delete the forwarder's network check and filter refresh
      ansible.builtin.file:
        path: "/usr/local/libexec/{{ item }}"
        state: absent
      loop: [nikos-ollama-bridge-check, nikos-ollama-bridge-refresh]
    - name: Reload systemd after removing the forwarder
      ansible.builtin.systemd:
        daemon_reload: true

- name: Refuse the Ollama forwarder where another network shares Docker's range
  ansible.builtin.fail:
    msg: >-
      Not running the Ollama forwarder: {{ ai_stack_bridge_overlap.stdout_lines | join(', ') }}
      would pass its interface filter, so machines on that network could reach Ollama.
      {{ 'The forwarder installed earlier was removed.'
         if ai_stack_bridge_installed.stat.exists | default(false) else '' }}
      Rename or remove that interface, or set nikos_ollama_bridge to off.
  when: ai_stack_bridge_shared | bool
