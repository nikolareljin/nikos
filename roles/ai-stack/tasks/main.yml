- name: Pull text generation Ollama models when requested - about 16 GB
  ansible.builtin.command: ollama pull {{ item }}
  loop: "{{ ollama_models_text }}"
  register: ai_stack_text_ollama_pull
  changed_when: >-
    'pulling' in ai_stack_text_ollama_pull.stdout or
    'success' in ai_stack_text_ollama_pull.stdout
  until: ai_stack_text_ollama_pull.rc == 0
