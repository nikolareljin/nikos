---
# Ollama runs as a *system* unit, /etc/systemd/system/ollama.service.
# Earlier releases managed a user-scope unit that does not exist and waited on
# /tmp/ollama.sock, which Ollama never creates; both had failed_when: false, so
# every run swallowed two failures and a 30 second timeout. The listen address
# is now set in one place (nikos_ollama_host) and readiness is an HTTP request.

# MainPID is 0 when the unit is stopped and the task fails when it does not
# exist yet; both mean "no listener of ours".
- name: Create the root-only download directory
  ansible.builtin.file:
    path: "{{ nikos_root_download_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0700"
  become: true
  check_mode: false

- name: Create the private download directory
  ansible.builtin.file:
    path: "{{ nikos_user_download_dir }}"
    state: directory
    mode: "0700"
  become: false
  check_mode: false

- name: Read the Ollama service main PID
  ansible.builtin.systemd:
    name: ollama
  register: ai_stack_ollama_unit
  failed_when: false
  check_mode: true
  when: nikos_ollama_mode == 'local'

# Whichever process binds first wins and the loser logs to a file nobody reads.
# When the port is held and NikOS's own unit is not the one running, stop here
# and name the holder rather than install a second owner.
- name: Find what is listening on the Ollama port
  ansible.builtin.command: ss -Hltnp "sport = :{{ nikos_ollama_host.split(':')[-1] }}"
  register: ai_stack_ollama_port
  changed_when: false
  failed_when: false
  check_mode: false
  become: true
  when: nikos_ollama_mode == 'local'

# A listener whose PID is not ollama.service's MainPID is a second owner. Only
# the configured port is probed: moving nikos_ollama_host to a free port passes
# and the drop-in change restarts the unit onto it.
- name: Refuse to start a second owner of the Ollama port
  vars:
    ai_stack_ollama_main_pid: "{{ ((ai_stack_ollama_unit.status | default({})).MainPID | default('0')) | string }}"
  ansible.builtin.fail:
    msg: >-
      Port {{ nikos_ollama_host.split(':')[-1] }} is already in use by another
      process: {{ ai_stack_ollama_port.stdout | trim }}.
      NikOS manages exactly one owner of this port (ollama.service). Stop that
      process, or set nikos_ollama_mode to "remote" in vars/local.yml if this
      machine should use an endpoint it does not run.
  when:
    - nikos_ollama_mode == 'local'
    - (ai_stack_ollama_port.stdout | default('') | trim) | length > 0
    - >-
      ai_stack_ollama_main_pid == '0' or ai_stack_ollama_main_pid not in
      (ai_stack_ollama_port.stdout | regex_findall('pid=([0-9]+)'))

# Ollama comes from the pinned release archive (ollama_version), checked
# against ollama_sha256 from that release's sha256sum.txt, not from
# ollama.com/install.sh piped into a shell. The tasks below do what that
# script did on Ubuntu: /usr/local/bin/ollama, /usr/local/lib/ollama, the
# ROCm runners on an AMD GPU, the `ollama` system user and ollama.service.
# NVIDIA drivers come from Ubuntu (ubuntu-drivers), below.
- name: Read the installed Ollama version
  ansible.builtin.command: /usr/local/bin/ollama --version
  register: ai_stack_ollama_installed
  changed_when: false
  failed_when: false
  check_mode: false
  when: nikos_ollama_mode == 'local'

# Installed when the binary is missing or older than ollama_version, by
# `nikos setup` and `nikos update` alike; a newer binary is left alone, and an
# unreadable version is not reinstalled over.
- name: Decide whether Ollama needs installing
  ansible.builtin.include_role:
    name: pin-gate
    tasks_from: version
  vars:
    pin_gate_name: Ollama
    pin_gate_want: "{{ ollama_version }}"
    pin_gate_path: /usr/local/bin/ollama
    # With the server down, or older than the binary, `ollama --version`
    # prints "Warning: client version is X" (alone, or after the server's
    # "ollama version is Y"). The binary's own (client) version is the one
    # that counts, so it goes first.
    pin_gate_output: >-
      {{ ((ai_stack_ollama_installed.stdout | default('') | regex_findall('client version is ([0-9]+[.][0-9]+[.][0-9]+)'))
          + [ai_stack_ollama_installed.stdout | default('')]) | first }}
  when: nikos_ollama_mode == 'local'

# install.sh's GPU probe: an AMD display device (PCI vendor 1002) gets the
# ROCm runners as well.
- name: Look for an AMD GPU
  ansible.builtin.shell: set -o pipefail; lspci -d '1002:' 2>/dev/null | grep -q AMD
  args:
    executable: /bin/bash
  register: ai_stack_amd_gpu
  changed_when: false
  failed_when: false
  check_mode: false
  when: nikos_ollama_mode == 'local'

# install.sh also installed an NVIDIA driver when it found an NVIDIA GPU with
# none loaded. Ubuntu's ubuntu-drivers does that from the signed Ubuntu archive
# (Canonical-signed prebuilt modules), so GPU machines keep CUDA acceleration.
# Skipped in image builds (the target hardware is unknown) and when
# nikos_nvidia_drivers is false.
- name: Look for an NVIDIA GPU without a loaded driver
  ansible.builtin.shell: >-
    set -o pipefail;
    lspci -d '10de:' 2>/dev/null | grep -Eiq 'VGA|3D|Display'
    && ! nvidia-smi -L >/dev/null 2>&1
  args:
    executable: /bin/bash
  register: ai_stack_nvidia_needs_driver
  changed_when: false
  failed_when: false
  check_mode: false
  when:
    - nikos_ollama_mode == 'local'
    - nikos_nvidia_drivers | default(true) | bool
    - not (nikos_image_build | default(false) | bool)

- name: Install the recommended NVIDIA driver from Ubuntu
  when:
    - not ansible_check_mode
    - ai_stack_nvidia_needs_driver.rc | default(1) == 0
  become: true
  block:
    - name: Install ubuntu-drivers
      ansible.builtin.apt:
        name: ubuntu-drivers-common
        state: present

    - name: Run ubuntu-drivers install
      ansible.builtin.command: ubuntu-drivers install
      register: ai_stack_nvidia_install
      changed_when: true

    - name: Say that the NVIDIA driver needs a reboot
      ansible.builtin.debug:
        msg: "NVIDIA driver installed from Ubuntu; reboot so Ollama can use the GPU."

# After the port check, so a machine whose port is already taken is refused
# before a second engine is installed onto it.
- name: Install Ollama {{ ollama_version }}
  when:
    - nikos_ollama_mode == 'local'
    - not ansible_check_mode
    - pin_gate_install | bool
  # The role runs unprivileged; everything here writes /usr/local.
  become: true
  block:
    - name: Install zstd for the Ollama release archive
      ansible.builtin.apt:
        name: zstd
        state: present

    - name: Download the Ollama release archive
      ansible.builtin.get_url:
        url: "https://github.com/ollama/ollama/releases/download/{{ ollama_version }}/ollama-linux-amd64.tar.zst"
        dest: "{{ nikos_root_download_dir }}/ollama-linux-amd64-{{ ollama_version }}.tar.zst"
        checksum: "sha256:{{ ollama_sha256 }}"
        mode: "0644"

    - name: Download the Ollama ROCm archive
      ansible.builtin.get_url:
        url: "https://github.com/ollama/ollama/releases/download/{{ ollama_version }}/ollama-linux-amd64-rocm.tar.zst"
        dest: "{{ nikos_root_download_dir }}/ollama-linux-amd64-rocm-{{ ollama_version }}.tar.zst"
        checksum: "sha256:{{ ollama_rocm_sha256 }}"
        mode: "0644"
      when: ai_stack_amd_gpu.rc | default(1) == 0

    # As install.sh did: a stale lib/ollama would mix two releases' runners.
    - name: Remove the previous Ollama libraries
      ansible.builtin.file:
        path: /usr/local/lib/ollama
        state: absent

    - name: Unpack Ollama into /usr/local
      ansible.builtin.command:
        argv: [tar, --zstd, -xf, "{{ nikos_root_download_dir }}/ollama-linux-amd64-{{ ollama_version }}.tar.zst", -C, /usr/local]
      changed_when: true
      register: ai_stack_ollama_update

    - name: Unpack the Ollama ROCm runners into /usr/local
      ansible.builtin.command:
        argv: [tar, --zstd, -xf, "{{ nikos_root_download_dir }}/ollama-linux-amd64-rocm-{{ ollama_version }}.tar.zst", -C, /usr/local]
      changed_when: true
      when: ai_stack_amd_gpu.rc | default(1) == 0

    - name: Remove the Ollama release archives
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - "{{ nikos_root_download_dir }}/ollama-linux-amd64-{{ ollama_version }}.tar.zst"
        - "{{ nikos_root_download_dir }}/ollama-linux-amd64-rocm-{{ ollama_version }}.tar.zst"

- name: Create the ollama system group
  ansible.builtin.group:
    name: ollama
    system: true
  become: true
  when: nikos_ollama_mode == 'local'

- name: Create the ollama system user
  ansible.builtin.user:
    name: ollama
    group: ollama
    system: true
    shell: /bin/false
    home: /usr/share/ollama
    create_home: true
  become: true
  when: nikos_ollama_mode == 'local'

# GPU device nodes are group render or video; a group that does not exist is
# skipped, as install.sh did.
- name: Read the system groups
  ansible.builtin.getent:
    database: group
  check_mode: false
  when: nikos_ollama_mode == 'local'

- name: Add the ollama user to the GPU device groups
  ansible.builtin.user:
    name: ollama
    groups: "{{ ['render', 'video'] | select('in', ansible_facts.getent_group | default({})) | list }}"
    append: true
  become: true
  when:
    - nikos_ollama_mode == 'local'
    - not ansible_check_mode

# The unit install.sh wrote. Settings NikOS owns go in the drop-in below.
- name: Write the Ollama system unit
  ansible.builtin.copy:
    dest: /etc/systemd/system/ollama.service
    mode: "0644"
    content: |
      # Managed by NikOS (roles/ai-stack). Local settings go in ollama.service.d.
      [Unit]
      Description=Ollama Service
      After=network-online.target

      [Service]
      ExecStart=/usr/local/bin/ollama serve
      User=ollama
      Group=ollama
      Restart=always
      RestartSec=3
      Environment="PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"

      [Install]
      WantedBy=default.target
  become: true
  register: ai_stack_ollama_unitfile
  when: nikos_ollama_mode == 'local'

- name: Create the Ollama unit drop-in directory
  ansible.builtin.file:
    path: /etc/systemd/system/ollama.service.d
    state: directory
    mode: "0755"
  become: true
  when: nikos_ollama_mode == 'local'

- name: Write the Ollama listen address drop-in
  ansible.builtin.copy:
    dest: /etc/systemd/system/ollama.service.d/nikos.conf
    mode: "0644"
    content: |
      # Managed by NikOS (roles/ai-stack). Set nikos_ollama_host in vars/local.yml.
      [Service]
      Environment="OLLAMA_HOST={{ nikos_ollama_host }}"
  become: true
  register: ai_stack_ollama_dropin
  when: nikos_ollama_mode == 'local'

- name: Enable and start the Ollama system service
  ansible.builtin.systemd:
    name: ollama
    enabled: true
    daemon_reload: true
    state: >-
      {{ 'restarted' if (ai_stack_ollama_dropin is changed or ai_stack_ollama_update is changed
                         or ai_stack_ollama_unitfile is changed) else 'started' }}
  become: true
  when:
    - nikos_ollama_mode == 'local'
    - not ansible_check_mode

- name: Wait for the Ollama endpoint to answer
  ansible.builtin.uri:
    url: "http://{{ nikos_ollama_host }}/api/version"
    return_content: false
  register: ai_stack_ollama_ready
  until: ai_stack_ollama_ready.status == 200
  retries: 15
  delay: 2
  when:
    - nikos_ollama_mode == 'local'
    - not ansible_check_mode

# Containers reach the local Ollama through a forwarder on the Docker bridge
# address; Ollama itself stays on loopback (nikos_ollama_host). A systemd
# socket listens there and systemd-socket-proxyd passes each connection to
# loopback. Only loopback and 172.16.0.0/12 may connect.
- name: Find the Docker bridge address for the Ollama forwarder
  ansible.builtin.shell: |
    set -o pipefail
    command -v docker >/dev/null 2>&1 || exit 0
    # Rootless Docker keeps its bridge in another network namespace; a
    # forwarder on the host does not reach it.
    if docker info -f '{% raw %}{{.SecurityOptions}}{% endraw %}' 2>/dev/null | grep -q rootless; then exit 0; fi
    docker network inspect bridge -f '{% raw %}{{(index .IPAM.Config 0).Gateway}}{% endraw %}' 2>/dev/null || true
  args:
    executable: /bin/bash
  register: ai_stack_bridge_probe
  changed_when: false
  failed_when: false
  when:
    - nikos_ollama_mode == 'local'
    - (nikos_ollama_bridge | default('auto')) == 'auto'

- name: Choose the Ollama forwarder address
  ansible.builtin.set_fact:
    ai_stack_bridge_addr: >-
      {{ '' if nikos_ollama_mode != 'local' or (nikos_ollama_bridge | default('auto')) == 'off'
         else ((ai_stack_bridge_probe.stdout | default('') | trim)
               if (nikos_ollama_bridge | default('auto')) == 'auto'
               else (nikos_ollama_bridge | trim)) }}
    ai_stack_bridge_port: "{{ nikos_ollama_host.split(':')[-1] }}"

# Bridge only: an address outside Docker's range would put Ollama, which has
# no authentication, on a network other machines can reach.
- name: Refuse an Ollama forwarder address outside the Docker bridge range
  ansible.builtin.fail:
    msg: >-
      nikos_ollama_bridge resolved to '{{ ai_stack_bridge_addr }}', which is not a
      Docker bridge address (172.16.0.0/12). Set nikos_ollama_bridge to the bridge
      address, or to off.
  when:
    - ai_stack_bridge_addr | length > 0
    - ai_stack_bridge_addr is not regex('^172\.(1[6-9]|2[0-9]|3[01])\.[0-9]{1,3}\.[0-9]{1,3}$')

# The allowlist trusts any source in 172.16.0.0/12. That is Docker's range
# only when no other network on this machine uses it: on a LAN or VPN in
# 172.16.0.0/12, a neighbour with a route to the bridge address would pass the
# filter and reach an Ollama that has no authentication.
- name: Find networks outside Docker that use 172.16.0.0/12
  ansible.builtin.shell: |
    set -o pipefail
    ip -4 -o addr show 2>/dev/null \
      | awk '$2 != "lo" && $2 != "docker0" && $2 !~ /^(br-|veth)/ { print $2, $4 }' \
      | grep -E ' 172\.(1[6-9]|2[0-9]|3[01])\.' || true
  args:
    executable: /bin/bash
  register: ai_stack_bridge_overlap
  changed_when: false
  failed_when: false
  when: ai_stack_bridge_addr | length > 0

- name: Refuse the Ollama forwarder where another network shares Docker's range
  ansible.builtin.fail:
    msg: >-
      Not installing the Ollama forwarder: {{ ai_stack_bridge_overlap.stdout_lines | join(', ') }}
      {{ 'is' if ai_stack_bridge_overlap.stdout_lines | length == 1 else 'are' }} in 172.16.0.0/12,
      the range the forwarder lets through, so machines on that network could reach Ollama.
      Set nikos_ollama_bridge to off, or move Docker's address pools out of that range
      (default-address-pools in /etc/docker/daemon.json).
  when:
    - ai_stack_bridge_addr | length > 0
    - (ai_stack_bridge_overlap.stdout | default('') | trim) | length > 0

- name: Write the Ollama forwarder socket
  ansible.builtin.copy:
    dest: /etc/systemd/system/nikos-ollama-bridge.socket
    mode: "0644"
    content: |
      # Managed by NikOS (roles/ai-stack). Set nikos_ollama_bridge in vars/local.yml.
      [Unit]
      Description=NikOS: containers reach the local Ollama (Docker bridge only)

      [Socket]
      ListenStream={{ ai_stack_bridge_addr }}:{{ ai_stack_bridge_port }}
      # The bridge address exists only once Docker is up; bind before that.
      FreeBind=yes
      IPAddressDeny=any
      IPAddressAllow=localhost 172.16.0.0/12

      [Install]
      WantedBy=sockets.target
  become: true
  register: ai_stack_bridge_socket
  when: ai_stack_bridge_addr | length > 0

- name: Write the Ollama forwarder service
  ansible.builtin.copy:
    dest: /etc/systemd/system/nikos-ollama-bridge.service
    mode: "0644"
    content: |
      # Managed by NikOS (roles/ai-stack). Started by nikos-ollama-bridge.socket.
      [Unit]
      Description=NikOS: forward container connections to the local Ollama
      Requires=nikos-ollama-bridge.socket
      After=nikos-ollama-bridge.socket ollama.service

      [Service]
      ExecStart=/usr/lib/systemd/systemd-socket-proxyd 127.0.0.1:{{ ai_stack_bridge_port }}
      DynamicUser=yes
      NoNewPrivileges=yes
      ProtectSystem=strict
      ProtectHome=yes
      PrivateTmp=yes
      PrivateDevices=yes
      RestrictAddressFamilies=AF_INET AF_INET6 AF_UNIX
  become: true
  register: ai_stack_bridge_service
  when: ai_stack_bridge_addr | length > 0

- name: Enable and start the Ollama forwarder
  ansible.builtin.systemd:
    name: nikos-ollama-bridge.socket
    enabled: true
    daemon_reload: true
    state: "{{ 'restarted' if (ai_stack_bridge_socket is changed or ai_stack_bridge_service is changed) else 'started' }}"
  become: true
  when:
    - ai_stack_bridge_addr | length > 0
    - not ansible_check_mode

- name: Look for an Ollama forwarder that no longer applies
  ansible.builtin.stat:
    path: /etc/systemd/system/nikos-ollama-bridge.socket
  register: ai_stack_bridge_installed
  when: ai_stack_bridge_addr | length == 0

- name: Remove the Ollama forwarder that no longer applies
  when:
    - ai_stack_bridge_addr | length == 0
    - ai_stack_bridge_installed.stat.exists | default(false)
    - not ansible_check_mode
  become: true
  block:
    - name: Stop the Ollama forwarder
      ansible.builtin.systemd:
        name: nikos-ollama-bridge.socket
        state: stopped
        enabled: false
    - name: Delete the Ollama forwarder units
      ansible.builtin.file:
        path: "/etc/systemd/system/{{ item }}"
        state: absent
      loop: [nikos-ollama-bridge.socket, nikos-ollama-bridge.service]
    - name: Reload systemd after removing the forwarder
      ansible.builtin.systemd:
        daemon_reload: true

- name: Pull default Ollama model
  ansible.builtin.command: ollama pull {{ ollama_default_model }}
  register: ai_stack_ollama_pull
  changed_when: "'pulling' in ai_stack_ollama_pull.stdout or 'success' in ai_stack_ollama_pull.stdout"
  until: ai_stack_ollama_pull.rc == 0
  retries: 3
  delay: 10
  ignore_errors: true
  environment:
    OLLAMA_HOST: "{{ nikos_ollama_host }}"
  when: nikos_ollama_mode == 'local'

# Each capability group carries its own tag as well as the shared
# `ollama-models` one, so a laptop can take a single group without pulling the
# whole set. `never` keeps them all off a default install.

- name: Pull general purpose reasoning Ollama models when requested - about 24 GB
  ansible.builtin.command: ollama pull {{ item }}
  loop: "{{ ollama_models_reasoning }}"
  register: ai_stack_reasoning_ollama_pull
  changed_when: >-
    'pulling' in ai_stack_reasoning_ollama_pull.stdout or
    'success' in ai_stack_reasoning_ollama_pull.stdout
  until: ai_stack_reasoning_ollama_pull.rc == 0
  retries: 3
  delay: 10
  ignore_errors: true
  environment:
    OLLAMA_HOST: "{{ nikos_ollama_host }}"
  when: nikos_ollama_mode == 'local'
  tags: [never, ollama-models, ollama-reasoning]

- name: Pull code Ollama models when requested - about 24 GB
  ansible.builtin.command: ollama pull {{ item }}
  loop: "{{ ollama_models_coding }}"
  register: ai_stack_coding_ollama_pull
  changed_when: >-
    'pulling' in ai_stack_coding_ollama_pull.stdout or
    'success' in ai_stack_coding_ollama_pull.stdout
  until: ai_stack_coding_ollama_pull.rc == 0
  retries: 3
  delay: 10
  ignore_errors: true
  environment:
    OLLAMA_HOST: "{{ nikos_ollama_host }}"
  when: nikos_ollama_mode == 'local'
  tags: [never, ollama-models, ollama-coding]

- name: Pull text generation Ollama models when requested - about 16 GB
  ansible.builtin.command: ollama pull {{ item }}
  loop: "{{ ollama_models_text }}"
  register: ai_stack_text_ollama_pull
  changed_when: >-
    'pulling' in ai_stack_text_ollama_pull.stdout or
    'success' in ai_stack_text_ollama_pull.stdout
  until: ai_stack_text_ollama_pull.rc == 0
  retries: 3
  delay: 10
  ignore_errors: true
  environment:
    OLLAMA_HOST: "{{ nikos_ollama_host }}"
  when: nikos_ollama_mode == 'local'
  tags: [never, ollama-models, ollama-text]

- name: Pull image analysis Ollama models when requested - about 9.4 GB
  ansible.builtin.command: ollama pull {{ item }}
  loop: "{{ ollama_models_vision }}"
  register: ai_stack_vision_ollama_pull
  changed_when: >-
    'pulling' in ai_stack_vision_ollama_pull.stdout or
    'success' in ai_stack_vision_ollama_pull.stdout
  until: ai_stack_vision_ollama_pull.rc == 0
  retries: 3
  delay: 10
  ignore_errors: true
  environment:
    OLLAMA_HOST: "{{ nikos_ollama_host }}"
  when: nikos_ollama_mode == 'local'
  tags: [never, ollama-models, ollama-vision]

- name: Pull embedding Ollama models when requested - about 1.3 GB
  ansible.builtin.command: ollama pull {{ item }}
  loop: "{{ ollama_models_embedding }}"
  register: ai_stack_embedding_ollama_pull
  changed_when: >-
    'pulling' in ai_stack_embedding_ollama_pull.stdout or
    'success' in ai_stack_embedding_ollama_pull.stdout
  until: ai_stack_embedding_ollama_pull.rc == 0
  retries: 3
  delay: 10
  ignore_errors: true
  environment:
    OLLAMA_HOST: "{{ nikos_ollama_host }}"
  when: nikos_ollama_mode == 'local'
  tags: [never, ollama-models, ollama-embedding]


- name: Ensure local bin directory exists
  ansible.builtin.file:
    path: "{{ nikos_home }}/.local/bin"
    state: directory
    mode: "0755"

# Each llama.cpp release lives in its own ~/.local/lib/llama.cpp-bNNNN tree.
# The pin is installed when no tree is as new as it; a newer tree from an
# earlier pin stays the active one, so `nikos update` never downgrades.
# A tree counts only when it holds llama-server, so a half-copied one from an
# interrupted run is installed again.
- name: Find the installed llama.cpp release trees
  ansible.builtin.find:
    paths: "{{ nikos_home }}/.local/lib"
    patterns: llama-server
    recurse: true
    depth: 2
    file_type: file
  register: ai_stack_llama_trees

- name: Choose the llama.cpp release to use
  vars:
    ai_stack_llama_newest: >-
      {{ (ai_stack_llama_trees.files | default([]) | map(attribute='path') | map('dirname') | map('basename')
          | map('regex_replace', '^llama[.]cpp-b', '') | select('match', '^[0-9]+$')
          | map('int') | list + [0]) | max }}
    ai_stack_llama_pin: "{{ llama_cpp_version | regex_replace('^b', '') }}"
  ansible.builtin.set_fact:
    ai_stack_llama_install: "{{ (ai_stack_llama_newest | int) < (ai_stack_llama_pin | int) }}"
    ai_stack_llama_active: "b{{ [ai_stack_llama_newest | int, ai_stack_llama_pin | int] | max }}"

# llama.cpp ships prebuilt binaries from GitHub releases. A missing asset or a
# network failure used to abort the whole play, taking every role after
# ai-stack with it, so the whole download/extract/install sequence is rescued.
- name: Install llama.cpp CPU binaries
  when:
    - not ansible_check_mode
    - ai_stack_llama_install | bool
  block:
    - name: Create llama.cpp extraction directory
      ansible.builtin.file:
        path: "{{ nikos_user_download_dir }}/llama-{{ llama_cpp_version }}"
        state: directory
        mode: "0755"

    - name: Download llama.cpp CPU binary archive
      ansible.builtin.get_url:
        url: "https://github.com/ggml-org/llama.cpp/releases/download/{{ llama_cpp_version }}/llama-{{ llama_cpp_version }}-bin-ubuntu-x64.tar.gz"
        dest: "{{ nikos_user_download_dir }}/llama-{{ llama_cpp_version }}-bin-ubuntu-x64.tar.gz"
        checksum: "sha256:{{ llama_cpp_sha256 }}"
        mode: "0644"

    - name: Extract llama.cpp CPU binaries
      ansible.builtin.unarchive:
        src: "{{ nikos_user_download_dir }}/llama-{{ llama_cpp_version }}-bin-ubuntu-x64.tar.gz"
        dest: "{{ nikos_user_download_dir }}/llama-{{ llama_cpp_version }}"
        remote_src: true

    # The archive layout is not stable across releases: older builds nested the
    # binaries under build/bin, b9151 puts them at the root of a single
    # top-level directory. Find them instead of assuming a path.
    - name: Locate the llama.cpp server binary
      ansible.builtin.find:
        paths: "{{ nikos_user_download_dir }}/llama-{{ llama_cpp_version }}"
        patterns: llama-server
        recurse: true
        file_type: file
      register: ai_stack_llama_server

    - name: Fail when the llama.cpp archive layout is unrecognised
      ansible.builtin.fail:
        msg: >-
          llama-server was not found anywhere in the extracted
          llama-{{ llama_cpp_version }} archive.
      when: (ai_stack_llama_server.matched | default(0)) | int == 0

    - name: Record the llama.cpp binary directory
      ansible.builtin.set_fact:
        ai_stack_llama_bin_dir: "{{ (ai_stack_llama_server.files | map(attribute='path') | first) | dirname }}"

    # The binaries are linked with RUNPATH=$ORIGIN and need libllama.so and the
    # libggml*.so set beside them, so the release tree is installed whole rather
    # than copying two executables into ~/.local/bin. cp -a, not the copy
    # module: copy with remote_src drops the symlinks, and llama-cli loads
    # libllama-common.so.0, which is one.
    - name: Create the llama.cpp release tree
      ansible.builtin.file:
        path: "{{ nikos_home }}/.local/lib/llama.cpp-{{ llama_cpp_version }}"
        state: directory
        mode: "0755"

    - name: Install the llama.cpp release tree
      ansible.builtin.command:
        argv:
          - cp
          - -a
          - "{{ ai_stack_llama_bin_dir }}/."
          - "{{ nikos_home }}/.local/lib/llama.cpp-{{ llama_cpp_version }}/"
      changed_when: true
  rescue:
    - name: Warn that llama.cpp could not be installed
      ansible.builtin.debug:
        msg: >-
          llama.cpp {{ llama_cpp_version }} could not be installed
          ({{ ansible_failed_result.msg | default('unknown error') }}).
          Continuing with the rest of the NikOS install; Ollama is unaffected.

# Outside the install block on purpose. The release tree can be in place from
# an earlier run while the links are gone, replaced or pointing at a version
# that was removed, and the block above is skipped in exactly that case.
- name: Re-check the llama.cpp release tree
  ansible.builtin.stat:
    path: "{{ nikos_home }}/.local/lib/llama.cpp-{{ ai_stack_llama_active }}/llama-server"
  register: ai_stack_llama_tree
  when: not ansible_check_mode

# $ORIGIN resolves against the symlink target, so linking into ~/.local/bin
# keeps the libraries reachable.
- name: Link llama.cpp binaries into the local bin directory
  ansible.builtin.file:
    src: "{{ nikos_home }}/.local/lib/llama.cpp-{{ ai_stack_llama_active }}/{{ item }}"
    dest: "{{ nikos_home }}/.local/bin/{{ item }}"
    state: link
    force: true
  loop:
    - llama-cli
    - llama-server
  when:
    - not ansible_check_mode
    - ai_stack_llama_tree.stat.exists | default(false)

- name: Check if Miniforge is already installed
  ansible.builtin.stat:
    path: "{{ nikos_home }}/miniforge3/bin/conda"
  register: ai_stack_miniforge_stat

- name: Download Miniforge installer
  ansible.builtin.get_url:
    url: "{{ miniforge_url }}"
    dest: "{{ nikos_user_download_dir }}/miniforge.sh"
    checksum: "sha256:{{ miniforge_sha256 }}"
    mode: "0755"
  when: not ai_stack_miniforge_stat.stat.exists

- name: Install Miniforge
  ansible.builtin.command: bash {{ nikos_user_download_dir }}/miniforge.sh -b -p {{ nikos_home }}/miniforge3
  when: not ai_stack_miniforge_stat.stat.exists
  changed_when: true

# nikos_python_version carries its own comparison operator, so it is
# concatenated rather than joined with "=" - "python=>=3.11" is not a spec
# conda accepts. This is ansible.builtin.command, not shell, so the < and > in
# the range are literal argv and never reach a shell.
- name: Create nikos-ai conda environment
  ansible.builtin.command: >
    {{ nikos_home }}/miniforge3/bin/conda create -n {{ nikos_conda_env }}
    python{{ nikos_python_version }} -y
  args:
    creates: "{{ nikos_home }}/miniforge3/envs/{{ nikos_conda_env }}"

- name: Install PyTorch CPU in nikos-ai env
  ansible.builtin.include_role:
    name: pin-gate
    tasks_from: pip
  vars:
    pin_gate_pip: "{{ nikos_home }}/miniforge3/envs/{{ nikos_conda_env }}/bin/pip"
    pin_gate_names: [torch, torchvision, torchaudio]
    pin_gate_pip_args: [--index-url, 'https://download.pytorch.org/whl/cpu']

- name: Install data science packages in nikos-ai env
  ansible.builtin.include_role:
    name: pin-gate
    tasks_from: pip
  vars:
    pin_gate_pip: "{{ nikos_home }}/miniforge3/envs/{{ nikos_conda_env }}/bin/pip"
    pin_gate_names: [transformers, jupyter, jupyterlab, pandas, numpy, scikit-learn, matplotlib]

- name: Install uv in nikos-ai env
  ansible.builtin.include_role:
    name: pin-gate
    tasks_from: pip
  vars:
    pin_gate_pip: "{{ nikos_home }}/miniforge3/envs/{{ nikos_conda_env }}/bin/pip"
    pin_gate_names: [uv]

# aider-chat pins each of its dependencies to an exact version (numpy 1.26.4,
# openai 2.20.0, ...). In the shared env it and the other packages overwrote
# each other's, and it does not install on Python 3.13 at all. It gets an env
# of its own; only an `aider` launcher goes on PATH.
- name: Create the aider conda environment
  ansible.builtin.command: >
    {{ nikos_home }}/miniforge3/bin/conda create -n {{ nikos_aider_conda_env }}
    python{{ nikos_aider_python_version }} -y
  args:
    creates: "{{ nikos_home }}/miniforge3/envs/{{ nikos_aider_conda_env }}"

- name: Install aider in its own env
  ansible.builtin.include_role:
    name: pin-gate
    tasks_from: pip
  vars:
    pin_gate_pip: "{{ nikos_home }}/miniforge3/envs/{{ nikos_aider_conda_env }}/bin/pip"
    pin_gate_names: [aider-chat]
    pin_gate_pins: "{{ nikos_aider_pip_pins }}"

- name: Check the aider command
  ansible.builtin.stat:
    path: "{{ nikos_home }}/miniforge3/envs/{{ nikos_aider_conda_env }}/bin/aider"
  register: ai_stack_aider_bin

# A launcher, not a symlink: python -s keeps ~/.local/lib/pythonX.Y out of
# sys.path, where it would come before the env and replace aider's pinned
# dependencies with whatever the user installed there.
- name: Install the aider launcher into the local bin directory
  ansible.builtin.copy:
    dest: "{{ nikos_home }}/.local/bin/aider"
    mode: "0755"
    content: |
      #!/bin/sh
      # Managed by NikOS (roles/ai-stack). aider runs from its own conda env.
      env="{{ nikos_home }}/miniforge3/envs/{{ nikos_aider_conda_env }}"
      exec "$env/bin/python" -s "$env/bin/aider" "$@"
  when: ai_stack_aider_bin.stat.exists

# An install from before aider had its own env has it in nikos-ai, where its
# `aider` would shadow the launcher above whenever that env is active. Removed
# only once the new one is in place. pip exits 0 when it is not installed.
- name: Remove aider from the nikos-ai env
  ansible.builtin.command:
    argv:
      - "{{ nikos_home }}/miniforge3/envs/{{ nikos_conda_env }}/bin/pip"
      - uninstall
      - -y
      - aider-chat
  register: ai_stack_aider_old
  changed_when: "'Successfully uninstalled' in ai_stack_aider_old.stdout"
  when:
    - not ansible_check_mode
    - ai_stack_aider_bin.stat.exists
