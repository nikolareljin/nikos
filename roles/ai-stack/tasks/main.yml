- name: Pull embedding Ollama models when requested - about 1.3 GB
  ansible.builtin.command: ollama pull {{ item }}
  loop: "{{ ollama_models_embedding }}"
  register: ai_stack_embedding_ollama_pull
  changed_when: >-
    'pulling' in ai_stack_embedding_ollama_pull.stdout or
