    OLLAMA_HOST: "{{ nikos_ollama_host }}"
  when: nikos_ollama_mode == 'local'
  tags: [never, ollama-models, ollama-embedding]


- name: Ensure local bin directory exists
  ansible.builtin.file:
    path: "{{ nikos_home }}/.local/bin"
    state: directory
    mode: "0755"

- name: Check whether this llama.cpp release is already installed
  ansible.builtin.stat:
    path: "{{ nikos_home }}/.local/lib/llama.cpp-{{ llama_cpp_version }}/llama-server"
  register: ai_stack_llama_installed

# llama.cpp ships prebuilt binaries from GitHub releases. A missing asset or a
# network failure used to abort the whole play, taking every role after
# ai-stack with it, so the whole download/extract/install sequence is rescued.
- name: Install llama.cpp CPU binaries
  when:
    - not ansible_check_mode
    - not ai_stack_llama_installed.stat.exists
  block:
    - name: Create llama.cpp extraction directory
      ansible.builtin.file:
        path: "/tmp/llama-{{ llama_cpp_version }}"
        state: directory
        mode: "0755"

    - name: Download llama.cpp CPU binary archive
      ansible.builtin.get_url:
        url: "https://github.com/ggml-org/llama.cpp/releases/download/{{ llama_cpp_version }}/llama-{{ llama_cpp_version }}-bin-ubuntu-x64.tar.gz"
        dest: "/tmp/llama-{{ llama_cpp_version }}-bin-ubuntu-x64.tar.gz"
        mode: "0644"

    - name: Extract llama.cpp CPU binaries
      ansible.builtin.unarchive:
        src: "/tmp/llama-{{ llama_cpp_version }}-bin-ubuntu-x64.tar.gz"
        dest: "/tmp/llama-{{ llama_cpp_version }}"
        remote_src: true

    # The archive layout is not stable across releases: older builds nested the
    # binaries under build/bin, b9151 puts them at the root of a single
    # top-level directory. Find them instead of assuming a path.
    - name: Locate the llama.cpp server binary
      ansible.builtin.find:
        paths: "/tmp/llama-{{ llama_cpp_version }}"
        patterns: llama-server
        recurse: true
        file_type: file
      register: ai_stack_llama_server

    - name: Fail when the llama.cpp archive layout is unrecognised
      ansible.builtin.fail:
        msg: >-
          llama-server was not found anywhere in the extracted
          llama-{{ llama_cpp_version }} archive.
      when: (ai_stack_llama_server.matched | default(0)) | int == 0

    - name: Record the llama.cpp binary directory
      ansible.builtin.set_fact:
        ai_stack_llama_bin_dir: "{{ (ai_stack_llama_server.files | map(attribute='path') | first) | dirname }}"

    # The binaries are linked with RUNPATH=$ORIGIN and need libllama.so and the
    # libggml*.so set beside them, so the release tree is installed whole rather
    # than copying two executables into ~/.local/bin.
    - name: Install the llama.cpp release tree
      ansible.builtin.copy:
        src: "{{ ai_stack_llama_bin_dir }}/"
        dest: "{{ nikos_home }}/.local/lib/llama.cpp-{{ llama_cpp_version }}/"
        remote_src: true
        mode: preserve
        directory_mode: "0755"
  rescue:
    - name: Warn that llama.cpp could not be installed
      ansible.builtin.debug:
        msg: >-
          llama.cpp {{ llama_cpp_version }} could not be installed
          ({{ ansible_failed_result.msg | default('unknown error') }}).
          Continuing with the rest of the NikOS install; Ollama is unaffected.

# Outside the install block on purpose. The release tree can be in place from
# an earlier run while the links are gone, replaced or pointing at a version
# that was removed, and the block above is skipped in exactly that case.
- name: Re-check the llama.cpp release tree
  ansible.builtin.stat:
    path: "{{ nikos_home }}/.local/lib/llama.cpp-{{ llama_cpp_version }}/llama-server"
  register: ai_stack_llama_tree
  when: not ansible_check_mode

# $ORIGIN resolves against the symlink target, so linking into ~/.local/bin
# keeps the libraries reachable.
- name: Link llama.cpp binaries into the local bin directory
  ansible.builtin.file:
    src: "{{ nikos_home }}/.local/lib/llama.cpp-{{ llama_cpp_version }}/{{ item }}"
    dest: "{{ nikos_home }}/.local/bin/{{ item }}"
    state: link
    force: true
  loop:
    - llama-cli
    - llama-server
  when:
    - not ansible_check_mode
    - ai_stack_llama_tree.stat.exists | default(false)

- name: Check if Miniforge is already installed
  ansible.builtin.stat:
    path: "{{ nikos_home }}/miniforge3/bin/conda"
  register: ai_stack_miniforge_stat

- name: Download Miniforge installer
  ansible.builtin.get_url:
    url: "{{ miniforge_url }}"
    dest: /tmp/miniforge.sh
    mode: "0755"
  when: not ai_stack_miniforge_stat.stat.exists

- name: Install Miniforge
  ansible.builtin.command: bash /tmp/miniforge.sh -b -p {{ nikos_home }}/miniforge3
  when: not ai_stack_miniforge_stat.stat.exists
  changed_when: true

# nikos_python_version carries its own comparison operator, so it is
# concatenated rather than joined with "=" - "python=>=3.11" is not a spec
# conda accepts. This is ansible.builtin.command, not shell, so the < and > in
# the range are literal argv and never reach a shell.
- name: Create nikos-ai conda environment
  ansible.builtin.command: >
    {{ nikos_home }}/miniforge3/bin/conda create -n {{ nikos_conda_env }}
    python{{ nikos_python_version }} -y
  args:
    creates: "{{ nikos_home }}/miniforge3/envs/{{ nikos_conda_env }}"

- name: Install PyTorch CPU in nikos-ai env
  ansible.builtin.command: >
    {{ nikos_home }}/miniforge3/bin/conda run -n {{ nikos_conda_env }}
    pip install {{ "--upgrade" if (nikos_update_mode | bool) else "" }} torch torchvision torchaudio --index-url https://download.pytorch.org/whl/cpu
  changed_when: false

- name: Install data science packages in nikos-ai env
  ansible.builtin.command: >
    {{ nikos_home }}/miniforge3/bin/conda run -n {{ nikos_conda_env }}
    pip install {{ "--upgrade" if (nikos_update_mode | bool) else "" }} transformers jupyter jupyterlab pandas numpy scikit-learn matplotlib
  changed_when: false

- name: Install aider and uv in nikos-ai env
  ansible.builtin.command: >
    {{ nikos_home }}/miniforge3/bin/conda run -n {{ nikos_conda_env }}
    pip install {{ "--upgrade" if (nikos_update_mode | bool) else "" }} aider-chat uv
  changed_when: false
