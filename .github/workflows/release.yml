name: Release

# The path for a tag pushed by hand. A tag created by the Auto Tag Release
# workflow is pushed with GITHUB_TOKEN and cannot trigger this, which is why
# that workflow publishes its own release rather than relying on this one.

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Version tag to release, e.g. 0.6.0"
        type: string
        required: true

permissions:
  contents: write

jobs:
  release:
    uses: nikolareljin/ci-helpers/.github/workflows/release-build.yml@production
    permissions:
      contents: write
    with:
      runner: ubuntu-24.04
      artifact_paths: install.sh
      release_tag: ${{ inputs.release_tag || github.ref_name }}
      release_name: "NikOS ${{ inputs.release_tag || github.ref_name }}"
