name: Lint

on:
  pull_request:
  push:
    branches: [main, dev]

jobs:
  ci:
    uses: nikolareljin/ci-helpers/.github/workflows/ci.yml@production
    with:
      runner: ubuntu-24.04
      python_version: "3.12"
      lint_command: |
        python -m pip install --upgrade pip
        python -m pip install ansible-lint pytest pillow
        sudo apt-get update
        sudo apt-get install -y shellcheck
        ansible-galaxy collection install -r requirements.yml
        ansible-lint site.yml
        shellcheck install.sh scripts/nikos scripts/nikos-progress.sh \
          scripts/repo-sync.sh roles/theming/files/nikos-apply-wallpaper.sh
      test_command: |
        python -m pytest tests/ -v
