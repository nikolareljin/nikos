<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920">
  <!--
    Portrait companion to wallpaper.svg, for monitors in vertical orientation.
    Same marks, same palette; only the canvas and the centring transform differ.

    Flat #2e3440 backdrop, the same colour NikOS writes into the xfdesktop
    rgba1 backdrop property, so the desktop colour left over by the Scaled
    image is continuous with the image instead of framing it.

    Keep <svg> as the first element after the XML declaration, so gdk-pixbuf
    can sniff the file as SVG.
  -->
  <rect width="1080" height="1920" fill="#2e3440"/>

  <!--
    The mark below is the landscape artwork verbatim, re-centred on the portrait
    canvas: the cluster spans x 749..1174 and y 304..748 with its centre at
    (960, 526), which the transform maps to (540, 960) at 1.5x.
  -->
  <g transform="translate(540,960) scale(1.5) translate(-960,-526)">

    <!-- ── Lines (drawn before nodes so nodes sit on top) ── -->

    <!-- Upper-left → Top  (bright blue) -->
    <line x1="800" y1="409" x2="937" y2="342"
          stroke="#2196F3" stroke-width="4.5" stroke-linecap="round"/>

    <!-- Top → Upper-right  (muted, symmetric) -->
    <line x1="983" y1="342" x2="1129" y2="409"
          stroke="#90a4ae" stroke-width="3.5" stroke-linecap="round" opacity="0.85"/>

    <!-- Lower-left → Lower-center  (bright blue) -->
    <line x1="801" y1="623" x2="937" y2="657"
          stroke="#2196F3" stroke-width="4.5" stroke-linecap="round"/>

    <!-- Lower-center → Lower-right  (muted, symmetric) -->
    <line x1="991" y1="657" x2="1125" y2="623"
          stroke="#90a4ae" stroke-width="3.5" stroke-linecap="round" opacity="0.85"/>

    <!-- ── Nodes ── -->

    <!-- Top-center -->
    <circle cx="960" cy="330" r="26" fill="#2196F3"/>

    <!-- Upper-left (r=33) ←→ Upper-right (r=24, muted) — same y=424 -->
    <circle cx="770"  cy="424" r="33" fill="#2196F3"/>
    <circle cx="1150" cy="424" r="24" fill="#90a4ae"/>

    <!-- Lower-left rounded-rect, centre (775,617) ←→ Lower-right circle, centre (1145,617) -->
    <rect x="749" y="591" width="52" height="52" rx="14" ry="14" fill="#2196F3"/>
    <circle cx="1145" cy="617" r="21" fill="#90a4ae"/>

    <!-- Lower-center -->
    <circle cx="964" cy="664" r="28" fill="#2196F3"/>

    <!-- ── Wordmark ── -->
    <text x="960" y="570"
          font-family="'Arial', 'Helvetica Neue', sans-serif"
          font-size="118"
          font-weight="800"
          fill="#eceff4"
          text-anchor="middle"
          letter-spacing="-3">NikOS</text>

    <!-- ── Full name ── -->
    <text x="960" y="710"
          font-family="'Arial', 'Helvetica Neue', sans-serif"
          font-size="19"
          fill="#81a1c1"
          text-anchor="middle"
          letter-spacing="1"
          opacity="0.85">Neural Innovation for Knowledge OS</text>

    <!-- ── Tagline ── -->
    <text x="960" y="748"
          font-family="'Courier New', monospace"
          font-size="15"
          fill="#4c566a"
          text-anchor="middle"
          letter-spacing="5">LIGHT SYSTEM. HEAVY THINKING.</text>
  </g>
</svg>
