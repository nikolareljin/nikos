---
# Every pinned external dependency (version, sha256, commit, apt key
# fingerprint) lives in vars/versions.yml, not here.

# Default to update mode so the 0.6.4 CLI, which invokes the newly checked-out
# playbook without extra variables, refreshes dependencies on its first 0.6.5
# update. `nikos setup` and `nikos add` explicitly set this false, keeping
# normal setup and add flows conservative.
nikos_update_mode: true

# ── Profile ──────────────────────────────────────────────────────────────────
# desktop (default) - the full workstation: Xfce, theming, VS Code
# server            - no desktop role at all: no display manager, no Xfce, no
#                     wallpaper, no Plymouth theme, no GUI editor. SSH, the AI
#                     stack, containers and the database bundles stay.
# install.sh asks once and writes the answer to vars/local.yml.
nikos_profile: "desktop"

# -- Git host setup ---------------------------------------------------------
# ask  - the first terminal runs nikos-git-setup (GitHub, GitLab, Bitbucket or
#        a custom server) until it is completed or skipped
# skip - no .bashrc hook; set up SSH keys yourself or run nikos-git-setup
nikos_git_setup: "ask"

# ── Boot ─────────────────────────────────────────────────────────────────────
# Let GRUB list other operating systems (Windows on a dual-boot machine).
# Ubuntu disables os-prober by default since GRUB 2.06. Only acts on an
# installed system that boots with GRUB, never during an image build.
nikos_grub_os_prober: true

# ── Inference endpoint ──────────────────────────────────────────────────────
# Exactly one process on a machine owns the Ollama port. The playbook and the
# `nikos` CLI both read these names, so set them once, in vars/local.yml.
#
#   nikos_ollama_mode  local  - this machine runs Ollama under systemd (default)
#                      remote - nothing local; clients use nikos_ollama_remote_url
#   nikos_node_role    workstation | inference | services - what this machine
#                      is for, so a lab of several machines can be described
#
# nikos_ollama_host is the listen address written to the ollama.service drop-in.
# It must stay on loopback: Ollama has no authentication, so binding 0.0.0.0
# would hand every model on the machine to the whole network. The play refuses
# any other value.
nikos_ollama_mode: "local"
nikos_node_role: "workstation"
nikos_ollama_host: "127.0.0.1:11434"
nikos_ollama_remote_url: ""

# Containers reach the local Ollama through a forwarder on the Docker bridge
# address (what host.docker.internal resolves to with host-gateway), because
# Ollama itself stays on loopback. Only loopback and Docker's 172.16.0.0/12 may
# connect, so another machine on the network cannot.
#   auto - the bridge of a rootful Docker Engine, when there is one (default)
#   off  - no forwarder; one installed earlier is removed
#   an address in 172.16.0.0/12 - that bridge
nikos_ollama_bridge: "auto"

nikos_version: "{{ lookup('file', playbook_dir + '/VERSION') | trim }}"

# Timezone and locale
# Fallback only — install.sh detects the system timezone via timedatectl and writes
# the chosen value to vars/local.yml, which overrides this. Europe/London is used
# only when the installer is run non-interactively without a vars/local.yml present.
nikos_timezone: "Europe/London"
nikos_locale: "en_US.UTF-8"

# -- Ubuntu release --------------------------------------------------------
# NikOS supports these Ubuntu / Xubuntu LTS releases (install.sh refuses the
# rest). Package names that differ between them, and distro packages a release
# does not have, are listed here and picked by the running release. An empty
# name means the package does not exist there; the role skips it and says why.
# Measured with apt-cache policy in the ubuntu:22.04/24.04/26.04 images.
nikos_ubuntu_releases:
  "22.04":
    glib_package: libglib2.0-0           # renamed libglib2.0-0t64 in 24.04
    xubuntu_minimal_package: xubuntu-core  # xubuntu-desktop-minimal is 24.04+
    postgres_contrib_package: postgresql-contrib
    pgvector_package: ""                 # jammy has no pgvector package
    netdata_package: netdata
    anki_package: anki
    netdata_vendor_repo: false
    anki_release: false
  "24.04":
    glib_package: libglib2.0-0t64
    xubuntu_minimal_package: xubuntu-desktop-minimal
    postgres_contrib_package: postgresql-contrib
    pgvector_package: postgresql-16-pgvector
    netdata_package: netdata
    anki_package: anki
    netdata_vendor_repo: false
    anki_release: false
  "26.04":
    glib_package: libglib2.0-0t64
    xubuntu_minimal_package: xubuntu-desktop-minimal
    postgres_contrib_package: ""         # merged into postgresql-18
    pgvector_package: postgresql-18-pgvector
    netdata_package: ""                  # dropped from the archive
    anki_package: ""                     # dropped from the archive
    # Not in the archive, so from verified vendor sources instead (only here):
    netdata_vendor_repo: true            # repo.netdata.cloud, key fingerprint-checked
    anki_release: true                   # ankitects/anki release tarball, sha256-checked
nikos_release: "{{ nikos_ubuntu_releases[ansible_facts['distribution_version']] }}"

# Codenames repo.mongodb.org publishes the mongodb_series repository for
# (dists/<codename>). On any other release the mongodb bundle is skipped,
# never pointed at another release's repository. resolute (26.04) had none
# on 2026-10-03.
mongodb_repo_codenames: [jammy, noble]

# ── Desktop environment ──────────────────────────────────────────────────────
# nikos_desktop_flavor selects the package set installed by the desktop role:
#   xubuntu-minimal — Xubuntu session, artwork and greeter without the full
#                     Xubuntu application suite (default)
#   xubuntu-full    — the complete xubuntu-desktop metapackage
#   xfce            — bare Xfce, no Xubuntu branding (pre-0.5.0 behaviour)
nikos_desktop_flavor: "xubuntu-minimal"

nikos_desktop_packages:
  xubuntu-minimal:
    - "{{ nikos_release.xubuntu_minimal_package }}"
    - xubuntu-default-settings
    - xubuntu-artwork
  xubuntu-full:
    - xubuntu-desktop
    - xubuntu-default-settings
    - xubuntu-artwork
  xfce:
    - xfce4

nikos_desktop_extra_packages:
  - xfconf  # the desktop role writes Xfce settings with it
  - xfce4-goodies
  - xfce4-terminal
  - lightdm
  - lightdm-gtk-greeter
  - lightdm-gtk-greeter-settings
  # Whisker Menu's "Edit Profile" button runs mugshot, but only Suggests it,
  # and Suggests are not installed. The full xubuntu-desktop Recommends it, so
  # a stock Xubuntu has it; NikOS installs xubuntu-desktop-minimal, which does
  # not, and the button then fails with "Failed to execute child process".
  - mugshot
  # Same gap, same failure: both the Xubuntu whiskermenu defaults and the NikOS
  # ones set command-menueditor=menulibre with the button shown, and menulibre
  # is a Recommends of the full xubuntu-desktop only.
  - menulibre

# GNOME packages the desktop role looks for when detecting an Ubuntu host.
nikos_gnome_packages:
  - ubuntu-desktop
  - ubuntu-desktop-minimal
  - ubuntu-session
  - gnome-session
  - gnome-session-bin
  - gnome-session-common
  - gnome-shell

# Leave GNOME installed by default so it stays selectable from the greeter.
# Set to true to purge it during the Ubuntu -> Xubuntu migration.
nikos_remove_gnome: false

# Disable the GDM3 service without removing the package, so LightDM owns the
# display-manager.service alias.
nikos_disable_gdm: true

# Default session written to AccountsService and the LightDM seat config.
# "auto" resolves to xubuntu when /usr/share/xsessions/xubuntu.desktop exists,
# otherwise xfce.
nikos_default_session: "auto"

# Theme
# Dark Firefox in the desktop colour: built-in Dark theme + userChrome.css,
# applied to every existing profile (roles/theming). false leaves Firefox alone.
nikos_firefox_dark: true
# Same for Chromium (snap/deb) and Google Chrome: dark, seeded with #2E3440.
nikos_chromium_dark: true

# ── Ollama models ────────────────────────────────────────────────────────────
# One model per role (general, reasoning, code, vision, embedding, ...), this
# machine's column of the fleet's approved set in ai-models.env (ADR-0058).
# script-helpers picks the column from memory and the largest GPU:
#   small     less than 11 GiB of memory and of GPU memory
#   standard  the default
#   large     a GPU with the role's NAME_LARGE_VRAM_GB, or 30 GiB of memory
#   xlarge    a GPU with the role's NAME_XLARGE_VRAM_GB
# `nikos setup` and `nikos update` pull the default module and the modules
# selected with `nikos add ollama-<module>`. `nikos update` first offers to
# remove installed models not approved for this machine, one question each.
# `nikos add model <name>` installs another model on purpose, and updates keep
# it. `nikos models` shows the class and the model per role.
#
# Name the class instead of measuring it (small, standard, large or xlarge):
nikos_ai_model_tier: ""

# The modules: which roles of ai-models.env each one pulls. The default always;
# the others with `nikos add ollama-<module>`.
ai_stack_model_modules:
  default: [OLLAMA_MODEL]
  text: [OLLAMA_MODEL, OLLAMA_CREATIVE_MODEL, OLLAMA_EXTRACT_MODEL, OLLAMA_CLASSIFY_MODEL]
  reasoning: [OLLAMA_REASONING_MODEL]
  coding: [OLLAMA_CODE_MODEL]
  vision: [OLLAMA_VISION_MODEL]
  embedding: [OLLAMA_EMBED_MODEL]
  models: []   # no names: every role in ai-models.env

# ── distrodeck ──────────────────────────────────────────────────────────────
# Where NikOS keeps the tool repositories it clones and builds (distrodeck,
# image-view, git-lantern, ai-runner, bitnet.cpp). Per user, no root: the tools
# build as the user. Not ~/Projects, which is the user's own workspace, and not
# under ~/.local/share/nikos, which is the NikOS git checkout itself.
# true: when an NVIDIA GPU has no loaded driver, install Ubuntu's recommended
# one (ubuntu-drivers install, signed Ubuntu archive). false: leave GPU drivers alone.
nikos_nvidia_drivers: true
# apt signing keys are downloaded, fingerprint-checked and dearmored here, not in
# /tmp, which every local user can write to. Root-only (0700).
nikos_key_staging_dir: /var/lib/nikos/keys
# Downloads go to private directories, never fixed /tmp paths: get_url skips a
# file whose checksum already matches, so a file another local user planted in
# /tmp could be swapped after the check and before it is run or unpacked.
nikos_root_download_dir: /var/lib/nikos/downloads
# An image build provisions /etc/skel as root: caching there would copy every
# archive into each new user's home, so it uses the root directory instead.
nikos_user_download_dir: >-
  {{ nikos_root_download_dir if (nikos_image_build | default(false) | bool)
     else nikos_home ~ '/.cache/nikos/downloads' }}
nikos_tools_dir: "{{ nikos_home }}/.local/share/nikos-tools"
# Where the dev-tools role clones and resolves distrodeck from (tests point it
# at a local repository). install.sh reads its catalog preview from GitHub.
distrodeck_repo_url: "https://github.com/nikolareljin/distrodeck.git"
# Comma-separated distrodeck tools to install. install.sh and `nikos add tools`
# set it from the saved selection (~/.config/nikos/selected-options.env); empty
# installs none.
nikos_distrodeck_tools: ""
# distrodeck catalog entries NikOS installs itself and never passes to
# distrodeck: Ollama is the ai-stack role's (one owner of the inference port),
# MongoDB is `nikos add mongodb`. Hidden from the selection screens and dropped
# from a saved list with a warning. scripts/nikos-tools.sh carries the same list.
nikos_distrodeck_owned_tools:
  - ollama
  - mongodb

# ── Java (optional bundle) ───────────────────────────────────────────────────
# OpenJDK releases `nikos add java` installs. The first is the default java.
nikos_java_versions: [21]

# ── Node.js for the npm-only CLIs ────────────────────────────────────────────
# Gemini CLI and OpenClaw publish through npm only - the Gemini release carries
# macOS binaries and a JS bundle, nothing native for Linux - so a Node new
# enough for them has to exist somewhere. Claude Code no longer needs one; it
# ships a standalone binary.
#
# NikOS does not install Node from apt. Ubuntu 24.04 ships Node 18, and the
# NodeSource package Conflicts with Ubuntu's `npm`, so upgrading in place
# removes npm and drags out eslint, webpack, node-tap and roughly fifteen
# Debian node-* library packages with it. That is a large, surprising change to
# make to a developer's machine in order to install two CLIs.
#
# Instead: use the system Node when it is already new enough, and otherwise
# install nvm and a pinned Node under the user's home, where a global npm
# install needs no root and cannot collide with the distribution's packages.
# A full version, not a major. OpenClaw requires >=22.22.3, and a major-only
# check would accept 22.22.2 and then fail at install time.
nikos_node_min_version: "22.22.3"

# ── Image analysis ───────────────────────────────────────────────────────────
# Shared object dependencies of the opencv-python wheels, plus video I/O.
# A desktop install already carries most of these; naming them keeps the stack
# working on a minimal or headless host too.
nikos_vision_apt_packages:
  - libgl1
  - "{{ nikos_release.glib_package }}"
  - libsm6
  - libxext6
  - ffmpeg

# Tesseract OCR. tesseract-ocr-osd handles orientation and script detection.
# nikos_tesseract_languages selects which language data to install; set it to
# ["all"] to pull tesseract-ocr-all (every one of the 160+ language packs).
nikos_tesseract_languages:
  - eng
  - fra
  - deu
  - spa
  - ita
  - por
  - rus
  - ell
  - srp

# Python image analysis packages, installed into the nikos-ai conda env at
# their pins in nikos_pip_pins (vars/versions.yml). A name added here without
# a pin installs whatever PyPI has newest; add its pin too.
nikos_vision_pip_packages:
  - opencv-contrib-python   # OpenCV with the contrib modules
  - pillow
  - scikit-image
  - imageio
  - pytesseract             # Python binding for the tesseract binary above
  - timm                    # pretrained vision backbones for torch

# Python / conda
nikos_conda_env: "nikos-ai"
# A conda version spec, operator included, not a bare version. A range lets
# conda pick whichever 3.1x actually solves against the AI stack; pinning an
# exact minor is what makes the environment unsolvable the moment one
# dependency drops support for it. Set it to "=3.12" to pin hard. The pip pins
# in vars/versions.yml are checked against every minor in this range
# (`python` under nikos_pin_sources.nikos_pip_pins): change both together.
nikos_python_version: ">=3.11,<3.14"
# aider lives in its own env (roles/ai-stack says why). Same kind of spec;
# aider-chat needs Python <3.13. Checked against nikos_aider_pip_pins.
nikos_aider_conda_env: "nikos-aider"
nikos_aider_python_version: ">=3.11,<3.13"

# VS Code extensions
nikos_vscode_extensions:
  - "Continue.continue"
  - "eamodio.gitlens"
  - "GitHub.copilot"
  - "nikolareljin.leak-lock"
  - "ms-python.python"
  - "ms-toolsai.jupyter"
  - "arcticicestudio.nord-visual-studio-code"
  - "ms-vscode-remote.remote-ssh"
  - "ms-azuretools.vscode-docker"
  - "humao.rest-client"
nikos_vscode_ai_extensions:
  - "Continue.continue"
  - "GitHub.copilot"
  - "nikolareljin.leak-lock"
