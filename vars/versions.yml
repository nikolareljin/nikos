# -- Vendor apt repositories: series and signing key fingerprints -------------
# Each key is downloaded, its primary fingerprints compared with these by
# scripts/verify-key-fingerprint.sh, and only then installed.
# packages.microsoft.com; fingerprint from learn.microsoft.com/linux/packages.
vscode_key_fingerprints:
  - "BC528686B50D79E339D3721CEB3E94ADBE1229CF"
# repo.netdata.cloud (Netdatabot); fingerprint from learn.netdata.cloud native
# packages docs and the key itself. Used only on 26.04 (no archive netdata).
netdata_key_fingerprints:
  - "6E155DC153906B73765A74A99DD4A74CECFA8F4F"
# cli.github.com; fingerprints from cli/cli docs/install_linux.md.
github_cli_key_fingerprints:
  - "2C6106201985B60E6C7AC87323F3D4EA75716059"
  - "7F38BBB59D064DBCB3D84D725612B36462313325"
# pkgs.k8s.io; same key from download.opensuse.org isv:kubernetes and keyserver.ubuntu.com.
kubernetes_apt_version: "v1.36"
kubernetes_key_fingerprints:
  - "DE15B14486CD377B9E876E1A234654DA9A296436"
# repo.mongodb.org; the 8.2 noble repository is signed with the 8.0 key, and
# MongoDB publishes no server-8.2.asc. Fingerprint also pinned by the Docker
# official mongo image (docker-library/mongo).
mongodb_series: "8.2"
mongodb_key_series: "8.0"
mongodb_key_fingerprints:
  - "4B0752C1BCA238C0B4EE14DC41DE058A4E7DCA05"

# ppa:ansible/ansible (install.sh, when the system Ansible is too old);
# fingerprint from the Launchpad API. install.sh carries the same value as
# ANSIBLE_PPA_KEY_FINGERPRINT because it runs before this file exists.
ansible_ppa_key_fingerprints:
  - "6125E2A8C77F2818FB7BD15B93C4A3FD7BB9C367"

# -- Machine-readable sources for scripts/bump-versions.py --------------------
# Keyed by pin name. Fields:
#   type          github-release | github-tag | github-commit | npm | pypi |
#                 pypi-map | go-module | nodejs | docker-image | apt-key
#   repo / package / module / image
#                 where the versions come from
#   version_var   the variable above that holds the version (tag)
#   tag_prefix    added before the version to form the tag (bun: "bun-v")
#   version_regex only versions matching this are eligible (e.g. Helm 3 only)
#   dist_tag      npm: follow this dist-tag instead of the newest release
#   python        pypi-map: the Python minors every pin must install on
#                 (Requires-Python); the same set nikos_python_version allows
#   extra_index   pypi-map: a second package index used when resolving
#   resolve_alone pypi-map: packages that pin their own dependencies exactly,
#                 so they are resolved by themselves, not with the rest
#   allow_prerelease  GitHub: accept releases marked pre-release (llama.cpp
#                 marks every build so)
#   artifacts     files hashed for the pin: asset (release asset name) or url,
#                 sha256_var, and optional checksums (vendor sums file: asset
#                 name, URL, or "github-digest" for the API digest, or
#                 "claude-manifest"). Templates: {version} {tag} {asset} {url}.
#   commit_var    github-tag / github-commit: variable holding the commit
#   digest_var    docker-image: variable holding the image digest
#   url, fingerprints_var
#                 apt-key (any pinned signing key): key URL (may use {var} from
#                 this file) and the list variable of expected fingerprints;
#                 never changed by the tool
nikos_pin_sources:
  ollama:
    type: github-release
    repo: ollama/ollama
    version_var: ollama_version
    artifacts:
      - {asset: ollama-linux-amd64.tar.zst, sha256_var: ollama_sha256, checksums: sha256sum.txt}
      - {asset: ollama-linux-amd64-rocm.tar.zst, sha256_var: ollama_rocm_sha256, checksums: sha256sum.txt}
  llama_cpp:
    type: github-release
    repo: ggml-org/llama.cpp
    version_var: llama_cpp_version
    version_regex: '^b[0-9]+$'
    # llama.cpp marks every build a GitHub pre-release; bNNNN builds are its releases.
    allow_prerelease: true
    artifacts:
      - {asset: "llama-{tag}-bin-ubuntu-x64.tar.gz", sha256_var: llama_cpp_sha256, checksums: github-digest}
  miniforge:
    type: github-release
    repo: conda-forge/miniforge
    version_var: miniforge_version
    version_regex: '^[0-9]+[.][0-9]+[.][0-9]+-[0-9]+$'
    artifacts:
      - {asset: "Miniforge3-{tag}-Linux-x86_64.sh", sha256_var: miniforge_sha256, checksums: "{asset}.sha256"}
  nikos_pip_pins:
    type: pypi-map
    version_var: nikos_pip_pins
    python: ["3.11", "3.12"]
    extra_index: https://download.pytorch.org/whl/cpu
    resolve_alone: [aider-chat]
  shell_gpt:
    type: pypi
    package: shell-gpt
    version_var: shell_gpt_version
  glances:
    type: pypi
    package: glances
    version_var: glances_version
  node:
    type: nodejs
    version_regex: '^22[.]'
    version_var: nikos_node_version
  nvm:
    type: github-tag
    repo: nvm-sh/nvm
    version_var: nikos_nvm_version
    version_regex: '^v[0-9]+[.][0-9]+[.][0-9]+$'
    artifacts:
      - {url: "https://raw.githubusercontent.com/nvm-sh/nvm/{tag}/install.sh", sha256_var: nvm_install_sha256}
  gemini_cli:
    type: npm
    package: "@google/gemini-cli"
    version_var: gemini_cli_version
  openclaw:
    type: npm
    package: openclaw
    dist_tag: extended-stable
    version_var: openclaw_version
  claude_code:
    type: npm
    package: "@anthropic-ai/claude-code"
    dist_tag: stable
    version_var: claude_code_version
    artifacts:
      - url: "https://downloads.claude.ai/claude-code-releases/{version}/linux-x64/claude"
        sha256_var: claude_code_sha256
        checksums: claude-manifest
  fabric:
    type: go-module
    module: github.com/danielmiessler/fabric
    version_var: fabric_version
  bun:
    type: github-release
    repo: oven-sh/bun
    tag_prefix: bun-v
    version_var: bun_version
    artifacts:
      - {asset: bun-linux-x64.zip, sha256_var: bun_sha256, checksums: SHASUMS256.txt}
  helm:
    type: github-release
    repo: helm/helm
    version_var: helm_version
    version_regex: '^v3[.][0-9]+[.][0-9]+$'
    artifacts:
      - url: "https://get.helm.sh/helm-{tag}-linux-amd64.tar.gz"
        sha256_var: helm_sha256
        checksums: "{url}.sha256sum"
  anki:
    type: github-release
    repo: ankitects/anki
    version_var: anki_version
    artifacts:
      - {asset: "anki-{tag}-linux-x86_64.tar.zst", sha256_var: anki_sha256, checksums: github-digest}
  act:
    type: github-release
    repo: nektos/act
    version_var: act_version
    artifacts:
      - {asset: act_Linux_x86_64.tar.gz, sha256_var: act_sha256, checksums: checksums.txt}
  starship:
    type: github-release
    repo: starship/starship
    version_var: starship_version
    artifacts:
      - {asset: starship-x86_64-unknown-linux-gnu.tar.gz, sha256_var: starship_sha256, checksums: "{asset}.sha256"}
  mkcert:
    type: github-release
    repo: FiloSottile/mkcert
    version_var: mkcert_version
    artifacts:
      - {asset: "mkcert-{tag}-linux-amd64", sha256_var: mkcert_sha256}
  mistralrs:
    type: github-release
    repo: EricLBuehler/mistral.rs
    version_var: mistralrs_version
    artifacts:
      - {asset: mistralrs-cpu-x86_64-unknown-linux-gnu.tar.gz, sha256_var: mistralrs_sha256, checksums: github-digest}
  nordic_gtk:
    type: github-release
    repo: EliverLara/Nordic
    version_var: nordic_gtk_version
    artifacts:
      - {asset: Nordic.tar.xz, sha256_var: nordic_gtk_sha256}
  qdrant:
    type: docker-image
    image: qdrant/qdrant
    repo: qdrant/qdrant
    version_var: qdrant_version
    digest_var: qdrant_image_digest
  distrodeck:
    type: github-tag
    repo: nikolareljin/distrodeck
    version_var: distrodeck_version
    commit_var: distrodeck_commit
    version_regex: '^[0-9]+[.][0-9]+[.][0-9]+$'
  image_view:
    type: github-tag
    repo: nikolareljin/image-view
    version_var: image_view_version
    commit_var: image_view_commit
    version_regex: '^[0-9]+[.][0-9]+[.][0-9]+$'
  git_lantern:
    type: github-tag
    repo: nikolareljin/git-lantern
    version_var: git_lantern_version
    commit_var: git_lantern_commit
    version_regex: '^[0-9]+[.][0-9]+[.][0-9]+$'
  ai_runner:
    type: github-tag
    repo: nikolareljin/ai-runner
    version_var: ai_runner_version
    commit_var: ai_runner_commit
    version_regex: '^[0-9]+[.][0-9]+[.][0-9]+$'
  bitnet:
    type: github-commit
    repo: microsoft/BitNet
    branch: main
    commit_var: bitnet_commit
  netdata_key:
    type: apt-key
    url: https://repo.netdata.cloud/netdatabot.gpg.key
    fingerprints_var: netdata_key_fingerprints
  vscode_key:
    type: apt-key
    url: https://packages.microsoft.com/keys/microsoft.asc
    fingerprints_var: vscode_key_fingerprints
  github_cli_key:
    type: apt-key
    url: https://cli.github.com/packages/githubcli-archive-keyring.gpg
    fingerprints_var: github_cli_key_fingerprints
  kubernetes_key:
    type: apt-key
    url: "https://pkgs.k8s.io/core:/stable:/{kubernetes_apt_version}/deb/Release.key"
    fingerprints_var: kubernetes_key_fingerprints
  mongodb_key:
    type: apt-key
    url: "https://pgp.mongodb.com/server-{mongodb_key_series}.asc"
    fingerprints_var: mongodb_key_fingerprints
  ansible_ppa_key:
    type: apt-key
    url: "https://keyserver.ubuntu.com/pks/lookup?op=get&search=0x6125E2A8C77F2818FB7BD15B93C4A3FD7BB9C367"
    fingerprints_var: ansible_ppa_key_fingerprints
  claude_code_key:
    type: apt-key
    url: https://downloads.claude.ai/keys/claude-code.asc
    fingerprints_var: claude_code_key_fingerprints
