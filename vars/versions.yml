---
# Every pinned external dependency NikOS installs, in one place.
#
# Rules (enforced by tests/test_pinned_sources.py):
# - Only verifiable sources: distro packages, vendor apt repos whose key
#   fingerprint is checked here, release files pinned to a version and a
#   sha256, registry installs at an exact version, git clones at a tag or
#   commit. Never `curl | sh`, `releases/latest`, `@latest` or a branch head.
# - Each pin is a flat variable Ansible reads (site.yml loads this file after
#   vars/main.yml; vars/local.yml still overrides any of them). Prefer the
#   upstream release tag as the version.
# - Each pin has an entry in nikos_pin_sources at the bottom, which
#   scripts/bump-versions.py reads to check, bump and verify it.
# - The Jev SDK has its own hash-pinned lock file:
#   roles/optional/jev/files/requirements.lock.
#
# Update with: python3 scripts/bump-versions.py --check | --bump NAME | --verify

# -- Ollama (roles/ai-stack) --------------------------------------------------
# github.com/ollama/ollama releases; sha256 from the release's sha256sum.txt.
ollama_version: "v0.35.1"
ollama_sha256: "9fcd79ac4575b2bd31b992eee18b1000c8ad126b451627c8f8cd091714cfbb10"
ollama_rocm_sha256: "786e1ba2ed7877b48aa948315ab704da2ea54a4b636e0ca18c3d328c84ff22cf"

# -- llama.cpp CPU build (roles/ai-stack) -------------------------------------
# github.com/ggml-org/llama.cpp releases; no sums file, sha256 = GitHub asset digest.
llama_cpp_version: "b11321"
llama_cpp_sha256: "b53d1a8fc0e31752d0309172e711c7bc8c0c11f9f1d6607766a6ac880da6badc"

# -- Miniforge (roles/ai-stack) -----------------------------------------------
# github.com/conda-forge/miniforge releases; sha256 from the asset's .sha256 file.
miniforge_version: "26.7.2-0"
miniforge_sha256: "281b0ac7d550802efc81af633225a5e6116d29ae72f3ab4eae7168c3931a4c05"
miniforge_url: "https://github.com/conda-forge/miniforge/releases/download/{{ miniforge_version }}/Miniforge3-{{ miniforge_version }}-Linux-x86_64.sh"

# -- Python packages in the nikos-ai conda env (ai-stack, agent-dev, optional DB roles)
# PyPI (torch, torchvision, torchaudio from download.pytorch.org/whl/cpu).
# Exact versions, resolved per install group with `uv pip compile` for every
# Python the env may have: the `python` list of this pin's entry in
# nikos_pin_sources, which matches nikos_python_version in vars/main.yml. An
# env made by an earlier release keeps its Python, so a pin that needs a newer
# one fails `nikos update` there (numpy 2.5 needs 3.12; aider-chat needs
# <3.13). `bump-versions.py --bump` moves them together and holds back any
# that stop the set resolving. vars/local.yml
# replaces this whole mapping: list every package in an override, or one left
# out is installed at PyPI's newest when it is missing.
nikos_pip_pins:
  torch: "2.14.1"
  torchvision: "0.29.1"
  torchaudio: "2.11.0"
  transformers: "5.18.0"
  jupyter: "1.1.1"
  jupyterlab: "4.6.4"
  pandas: "3.0.6"
  numpy: "2.4.6"
  scikit-learn: "1.9.1"
  matplotlib: "3.11.2"
  aider-chat: "0.86.2"
  uv: "0.12.22"
  langchain: "1.4.3"
  langchain-community: "0.4.2"
  langchain-openai: "1.6.7"
  llama-index: "0.14.25"
  llama-index-llms-ollama: "0.11.0"
  openai: "2.54.0"
  anthropic: "1.11.0"
  instructor: "1.17.0"
  fastapi: "0.142.2"
  uvicorn: "0.54.0"
  httpx: "0.28.1"
  sentence-transformers: "6.1.0"
  chromadb: "1.5.9"
  qdrant-client: "1.19.1"
