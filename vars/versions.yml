# github.com/EricLBuehler/mistral.rs releases, CPU build; sha256 = GitHub asset digest.
mistralrs_version: "v0.9.4"
mistralrs_sha256: "99a8f233db07927b9af4d6ac8d5c1541bc9e4c6c90ebeec1be97fe6306e00feb"
# github.com/EliverLara/Nordic releases; the asset is unsigned, hashed by hand.
