---
- name: NikOS Setup
  hosts: local  # inventory group defined in inventory/local
  become: true
  force_handlers: true
  vars_files:
    - vars/main.yml
    - vars/versions.yml
  vars:
    # lookup runs on the controller before privilege escalation — gives the real user's home
    nikos_home: "{{ lookup('env', 'HOME') }}"
    # same reason: the login name that owns the desktop session being configured
    nikos_user: "{{ lookup('env', 'USER') }}"
  pre_tasks:
    - name: Check whether local override vars exist
      ansible.builtin.stat:
        path: "{{ playbook_dir }}/vars/local.yml"
      register: local_vars_stat
      tags: [always]

    - name: Load local override vars
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/vars/local.yml"
      when: local_vars_stat.stat.exists
      tags: [always]

    # Settings a typo would silently turn into a different machine. Checked
    # after vars/local.yml is loaded, so the message can name the file to fix.
    - name: Validate the profile and inference endpoint settings
      ansible.builtin.assert:
        that:
          - nikos_profile in ['desktop', 'server']
          - nikos_ollama_mode in ['local', 'remote']
          - nikos_node_role in ['workstation', 'inference', 'services']
          - nikos_ollama_host is match('^(127\\.[0-9.]+|localhost|\\[::1\\]):[0-9]+$')
          - nikos_git_setup in ['ask', 'skip']
          - nikos_ollama_mode != 'remote' or (nikos_ollama_remote_url | length) > 0
        fail_msg: >-
          Invalid NikOS settings. Fix them in {{ playbook_dir }}/vars/local.yml:
          nikos_profile={{ nikos_profile }} (desktop or server),
          nikos_ollama_mode={{ nikos_ollama_mode }} (local or remote),
          nikos_node_role={{ nikos_node_role }} (workstation, inference or services),
          nikos_ollama_host={{ nikos_ollama_host }} (must be a loopback address with a port;
          Ollama has no authentication),
          nikos_ollama_remote_url={{ nikos_ollama_remote_url | default('') }} (required when the mode is remote),
          nikos_git_setup={{ nikos_git_setup }} (ask or skip).
        quiet: true
      tags: [always]

    # An ISO build runs this play in a chroot with /etc/skel as the home. Boot
    # loader and kernel changes there would act on the build host's view of
    # /boot, not on the machine the image is installed onto.
    - name: Detect an image build
      ansible.builtin.set_fact:
        nikos_image_build: >-
          {{ (nikos_image_build | default(false) | bool)
             or (ansible_facts.is_chroot | default(false) | bool)
             or nikos_home == '/etc/skel' }}
      tags: [always]

    - name: Check whether playbook directory is a git checkout
      ansible.builtin.stat:
        path: "{{ playbook_dir }}/.git"
      register: playbook_git_stat
      tags: [always]

    # Remove any old-format vscode.list entry. The playbook now uses DEB822
    # (vscode.sources + microsoft.gpg) which matches what VS Code's own dpkg
    # postinst writes, so the two entries are always identical and never conflict.
    - name: Remove legacy VS Code apt source list before any apt operations
      ansible.builtin.file:
        path: /etc/apt/sources.list.d/vscode.list
        state: absent
      tags: [always]

    - name: Find any remaining VS Code apt source files before any apt operations
      ansible.builtin.shell: >
        grep -rl "packages.microsoft.com/repos/code"
        /etc/apt/sources.list.d/ 2>/dev/null || true
      register: vscode_source_files
      changed_when: false
      tags: [always]

    - name: Remove any remaining VS Code apt source files before any apt operations
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop: "{{ vscode_source_files.stdout_lines }}"
      # Exclude vscode.sources — that is now the canonical file managed by this playbook
      when: >-
        (vscode_source_files.stdout_lines | length) > 0 and
        item != '/etc/apt/sources.list.d/vscode.sources'
      tags: [always]

  # Layers. core: every install. desktop: only when nikos_profile is desktop,
  # whatever tags are passed. See docs/profiles.md.
  roles:
    - role: base
      tags: [base]
    - role: desktop
      tags: [desktop]
      when: nikos_profile == 'desktop'
    - role: theming
      tags: [theming]
      when: nikos_profile == 'desktop'
    - role: github-setup
      become: false
    - role: ai-stack
      become: false
      tags: [ai-local]
    - role: editors
      become: false
      tags: [editors]
      when: nikos_profile == 'desktop'
    - role: cloud-ai-cli
      become: false
    - role: agent-dev
      become: false
    - role: dev-tools
      become: false
    - role: network
      tags: [network]
    - role: music
      tags: [music]
      when: nikos_profile == 'desktop'
    - role: education
      tags: [education]
      when: nikos_profile == 'desktop'
    - role: neovim
      become: false
      tags: [never, neovim]
    - role: java
      tags: [never, java]
    - role: podman
      tags: [never, podman]
    - role: openclaw
      become: false
      tags: [never, openclaw]
    - role: bun
      become: false
      tags: [never, bun]
    - role: redis
      become: false
      tags: [never, redis]
    - role: postgres
      become: false
      tags: [never, postgres]
    - role: mongodb
      become: false
      tags: [never, mongodb]
    - role: zsh
      become: false
      tags: [never, zsh]
    - role: act
      become: false
      tags: [never, act]
    - role: fabric
      become: false
      tags: [never, fabric]
    - role: jev
      become: false
      tags: [never, jev]
    - role: k8s-tools
      become: false
      tags: [never, k8s-tools]
    - role: qdrant
      become: false
      tags: [never, qdrant]
    - role: bitnet
      become: false
      tags: [never, bitnet]
    - role: mistral-rs
      become: false
      tags: [never, mistral-rs]
    - role: monitoring
      become: false
      tags: [never, monitoring]

  post_tasks:
    - name: Initialize git submodules (script-helpers)  # noqa: command-instead-of-module
      ansible.builtin.command:
        cmd: git submodule update --init --recursive
        chdir: "{{ playbook_dir }}"
      become: false
      register: submodule_result
      changed_when: >-
        submodule_result.rc == 0 and (
          'Submodule path ' in (submodule_result.stdout | default('')) or
          'Submodule path ' in (submodule_result.stderr | default('')) or
          'Cloning into ' in (submodule_result.stdout | default('')) or
          'Cloning into ' in (submodule_result.stderr | default(''))
        )
      when:
        - playbook_git_stat.stat.exists
        - not ansible_check_mode

    - name: Check nikos CLI script exists
      ansible.builtin.stat:
        path: "{{ playbook_dir }}/scripts/nikos"
      register: nikos_cli_stat

    - name: Install nikos CLI
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/scripts/nikos"
        dest: /usr/local/bin/nikos
        mode: "0755"
      become: true
      when: nikos_cli_stat.stat.exists
